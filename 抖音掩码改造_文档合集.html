<div class=&quot;section&quot;><h2 id=&quot;sec-1&quot;>0. 三分钟看懂</h2>
<h3 id=&quot;sec-2&quot;>0.1 变化本身只有一句话</h3>
<p><strong>抖音来的线索，以后没有真手机号了。给的是「带星号的假号 + 一串不可逆的乱码 + 抖音的线索编号」。</strong></p>
<p>后果：判重、坐席搜索、归属地分城、门店分派、黑名单、报表回填——这些动作全部拿手机号当键，<strong>键没了，整条链上所有&quot;认人&quot;的地方都要换键</strong>。不是&quot;接口加几个字段&quot;。</p>

<div class=&quot;section&quot;><h2 id=&quot;sec-6&quot;>1. 先统一四个词</h2>
<p>开会第一件事，把这四个词对齐，后面所有讨论都靠它们。</p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>词</th>
<th>长什么样</th>
<th>会不会变</th>
<th>拿来干什么</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>掩码号</strong></td>
<td><code><strong>*</strong>**3090</code>，11 位、前 7 位是星号</td>
<td><strong>固定不变</strong></td>
<td>给人看的（坐席、门店）、兜底外呼的展示号。<strong>不能当判重键</strong></td>
</tr>
<tr>
<td><strong>加密标识</strong></td>
<td>一串 64 位不可逆乱码（建议预留 128 位）</td>
<td>一个手机号只对应一个，永不变</td>
<td><strong>认人的唯一凭据</strong>：判重、黑名单命中、跨渠道撞重全靠它</td>
</tr>
<tr>
<td><strong>抖音原线索 ID</strong></td>
<td>抖音自己的线索编号</td>
<td>不变</td>
<td>换可外呼号码的入参；现网查重键本来就是它，直接复用</td>
</tr>
<tr>
<td><strong>中间号</strong>（外呼临时号）</td>
<td>每次外呼时系统临时分配的号码</td>
<td><strong>每次外呼都会变</strong></td>
<td>只是拨号通道，不能用来认人</td>
</tr>
</tbody>
</table></div>
<p><strong>一句话记住：号是假的、号还会变，认人只能靠那串乱码。</strong></p>
<blockquote>
<p>我方本地算出的加密标识与平台下发的<strong>是同一套算法、同一把盐，一个手机号只对应一个加密标识</strong>。所以本地密文可以和平台下发的直接比对——这是后面&quot;撞重补全&quot;能成立的前提。</p>
</blockquote>
<h3 id=&quot;sec-7&quot;>1.1 五条关键判据（读完 480 页原型提炼，判断任何改造点先对这几条）</h3>
<ol>
<li><strong>同一客户会先后出现在两条链路</strong>（先留资线索进主机厂，去重后转培育线索）→ 加密标识必须在两条链路间<strong>同口径</strong>，否则培育侧把老客户当新客，重复外呼。</li><li><strong>去重不在我方</strong>，在 NEV 中台。我方要做的不是自己做跨渠道去重，而是<strong>保证标识传到中台、且中台愿意用它</strong>。</li><li><strong>号码校验是两道门槛，顺序不能颠倒</strong>：车巴巴「13~19 位」在前，线索中心正则 + 在网查询在后。<strong>第一道不过，线索根本进不来</strong>——所以必须从车巴巴开始改。</li><li><strong>空号检测与在网检测是两套缓存</strong>：空号 15 天、在网 48 小时，分别处理、分别降级。</li><li><strong>字节系 11 个入口，号码字段叫法不一、校验强度从&quot;强校验&quot;到&quot;完全没校验&quot;都有</strong>：先出映射表再动手，不要一个入口一个入口猜。</li>
</ol>
<hr>
</div>
<div class=&quot;section&quot;><h2 id=&quot;sec-8&quot;>2. 改造范围：11 个入口，其实只有 4 个窗口</h2>
<h3 id=&quot;sec-9&quot;>2.1 四窗口（按窗口改，不按页面改）</h3>

</tr>
</tbody>
</table></div>
<p>E6 东风南方抖音号、E7 启辰抖店官方店不在四组里，但与 ②③ 同走车巴巴接口 B，字段口径随接口走，不单开一套。</p>
<h3 id=&quot;sec-10&quot;>2.2 三个结论（直接影响改造顺序）</h3>
<ul>
<li><strong>掩码号在车巴巴这一层就进不来</strong>——13~19 位强校验比线索中心的正则更靠前。所以第一批改动必须是 CB9（校验分流），它不改，后面全部无从验证。</li><li><strong>查重键本来就是线索 ID</strong>（<code>extsystem_clue_id</code> / <code>outSystemCluekey</code>），不是手机号。抖音原线索 ID 直接落到这个字段，<strong>不用新建一套判重逻辑</strong>——这是个利好。</li><li><strong>E11 是唯一&quot;没人守门&quot;的入口</strong>，拉取型、无校验，要额外确认它会不会把星号当合法电话入库。</li>
</ul>
<hr>
</div>

<h3 id=&quot;sec-13&quot;>3.2 认人：把所有&quot;拿号码当键&quot;的地方换成加密标识</h3>
<p>这是改造面最大的一块。逐项清单：</p>
<div class=&quot;tbl&quot;><table>

</tr>

<td>3 家店把同一人当 3 个新客</td>
</tr>
<tr>
<td>首触归因</td>

</tr>
<tr>
<td>关键行为提醒（同店再次留资 T/N）</td>

<td>提醒不触发</td>
</tr>
</tbody>
</table></div>
<p><strong>两条纪律，违反任何一条整条链就失效：</strong></p>
<ol>
<li><strong>加密节点全系统只能有一个</strong>。任何模块私自按另一套参数加密，立刻造出对不上的密文——而这种错在数据上不显眼，只表现为&quot;撞不上&quot;，极难倒查。</li><li><strong>密钥轮换必须双向同步</strong>（R3a）。字节或我方任一侧换了盐而另一侧没跟，历史密文与平台下发立刻全部对不上，<strong>不报错、不告警</strong>，只表现为撞重命中率归零。做法：轮换前取 100 条已知明文跑一遍两侧比对，一致再切；命中率跌破基线即告警。</li>
</ol>
<h3 id=&quot;sec-14&quot;>3.3 取真号：只有两条路</h3>
<p>号码不能凭空变出来。合规的、技术可行的只有两条：</p>
<h4>路 A：撞重补全（成本最低，但要平台书面认可用途）</h4>
<p><strong>原理</strong>：不去平台问&quot;这位客户是谁&quot;，而是<strong>本地把对方线索的明文加密一遍，拿密文回自己库里查有没有对应的掩码线索</strong>。明文不出库，不向平台发任何请求。</p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>线索来源</th>
<th>加密标识丢了能不能补</th>
</tr>
</thead>
<tbody>
<tr>
<td>自有渠道（展会、门店、DMS、垂媒、手工导入）</td>
<td>有明文，本地重算即可补回，可批量跑</td>
</tr>
<tr>
<td>字节渠道</td>
<td>手上只有星号和密文，<strong>补不出来</strong>，只能按原线索 ID 回头找字节要，或等正式链路转明</td>
</tr>
</tbody>
</table></div>
<p><strong>两道闸门，全过才补：</strong></p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>闸门</th>
<th>条件</th>
<th>不满足时</th>
</tr>
</thead>
<tbody>
<tr>
<td>密文同源</td>
<td>已确认（2026-10-17），不再是风险项</td>
<td>运行期监控&quot;加密标识命中率（撞重率）&quot;，异常下降=加密节点配置漂移</td>
</tr>
<tr>
<td>明文可信</td>
<td>对方明文非空、过 11 位校验、非掩码形态、不是空号</td>
<td>不补</td>
</tr>
</tbody>
</table></div>
<blockquote>
<p><strong>责任归属</strong>：平台对&quot;撞重取得明文&quot;没有官方书面材料，该行为属我方自主行为。因此以下三条需要我方约束：① 只写候选、不写主字段；② <strong>默认不</strong>用于外呼取号与对外提供——是否放开由按品牌/门店的策略开关决定，<strong>开关默认关</strong>；③ 全程审计留痕（含补给了哪个门店）。</p>
</blockquote>
<p><strong>补的规则——补空，不覆盖，且只写候选：</strong></p>
<blockquote>
<p>先说清楚一条线索长什么样：一条线索就是一行记录，里面有一排格子——<strong>手机号</strong>（正式栏）、<strong>掩码号</strong>、<strong>加密标识</strong>、<strong>候选明文</strong>、<strong>验证状态</strong>。下面说的&quot;补&quot;，就是往其中某一格写数。</p>
</blockquote>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>情形</th>
<th>怎么做</th>
<th>举个例子</th>
</tr>
</thead>
<tbody>
<tr>
<td>抖音线索的&quot;手机号&quot;栏还空着</td>
<td>才把撞出来的号写进去；栏里已经有号的，一个字都不碰</td>
<td>坐席昨天已经手动录过一个号 → 这次不覆盖，免得两个号打架</td>
</tr>
<tr>
<td>补进来的号放在哪</td>
<td>写在&quot;候选明文&quot;格——线索里专门放疑似号码的一格；&quot;手机号&quot;正式格继续空着。<strong>原因</strong>：全系统的外呼、短信、导出都只读正式格，没核实的号放在候选格，天然用不出去</td>
<td>乱码相同只是系统推断，客户本人没确认过；坐席看到的是&quot;疑似号码·待核实&quot;，不是&quot;确认号码&quot;</td>
</tr>
<tr>
<td>写入的同时打三个标记</td>
<td>来源=3（撞重补全）、状态=0（待验证）、记下是从哪条线索撞来的</td>
<td>以后报表能把&quot;撞来的号&quot;和&quot;客户自己给的号&quot;分开统计；出了争议也查得到来历</td>
</tr>
<tr>
<td>线索条数变不变</td>
<td>不变。只补号码，不合并线索</td>
<td>拆给广州风日、东莞南菱两家就是两条，各补各的；要不要并成一条，是&quot;重复跟进判断（LC-B3）&quot;的事</td>
</tr>
<tr>
<td>后来官方回了不一样的号</td>
<td>以正式链路（到店转明 / 成交回传）为准改掉，同时记差异日志并告警；撞出来的旧号不删，进历史表备查</td>
<td>撞出来是 138 尾 8899，到店回传是 139 尾 1234 → 改成 1234，并告警：当初可能认错了人，要回查；8899 留在历史表——也可能只是客户换号了</td>
</tr>
<tr>
<td>什么时候补</td>
<td>两个时机都做：① 实时——自有渠道线索一进来，马上撞一次；② 日终——每天凌晨把&quot;有乱码但没号&quot;的抖音线索全扫一遍</td>
<td>客户周一在门店留资，抖音线索周二才进来——周一实时那次它还不存在，只能靠周二凌晨那轮补上。少一轮就漏一批</td>
</tr>
<tr>
<td>一条真号对多条抖音线索</td>
<td>每条都补，补同一个号</td>
<td>一条线索拆给 3 家店就是 3 条，3 条都补——本来就是同一个人，不是 3 个人</td>
</tr>
<tr>
<td>一条抖音线索对多个历史号码</td>
<td>取<strong>最近一次有效留资</strong>的号，不取最早的</td>
<td>客户 6 月、9 月、10 月各留过一次 → 用 10 月的；6 月那个号可能已经被运营商回收给别人了。旧号不删，进审计表备查</td>
</tr>
</tbody>
</table></div>
<blockquote>
<p>转正不另开一套流程，走下面&quot;路 B&quot;的验证与转正，与坐席录入共用同一套状态机。</p>
</blockquote>
<p><strong>灰度</strong>：先 dry-run 两周，只统计不写；准确率 ≥95% 才开写。同源确认后，&quot;密文没命中&quot;是正常查不到，不是异常。</p>
<h4>路 B：坐席录入 → 验证 → 转正（不依赖任何外部答复，P0 可先做）</h4>
<p>现网《任务跟进》已经允许坐席改号，改完直接盖在号码字段上——不校验、不留痕。掩码上线后这个动作就是&quot;坐席录入真号&quot;的唯一入口，要做的是<strong>改它的行为</strong>：改号仍可当场拨（那是本次呼叫的会话参数），但<strong>不再直接写主字段，改写候选</strong>。</p>
<p><strong>号码相关字段（摘要；完整 11 列含类型与索引，见辅材 2.5 ①）</strong></p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>列名</th>
<th>含义</th>
<th>谁写</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>phone</code></td>
<td>已验证明文。<strong>只有验证通过才有值</strong></td>
<td>转正事务</td>
</tr>
<tr>
<td><code>mask_phone</code> / <code>encrypt_id</code></td>
<td>掩码号 / 加密标识</td>
<td>接口入参 / 加密节点</td>
</tr>
<tr>
<td><code>candidate_phone</code></td>
<td>候选明文（未验证）</td>
<td>坐席录入 / 撞重补全</td>
</tr>
<tr>
<td><code>phone_source</code></td>
<td>1 报文明文 / 2 正式链路 / 3 撞重补全 / 4 坐席采集</td>
<td>写入时打标</td>
</tr>
<tr>
<td><code>phone_status</code></td>
<td>0 待验证 / 1 已验证 / 2 已失效</td>
<td>状态机</td>
</tr>
<tr>
<td><code>phone_verified_by</code> / <code>_at</code></td>
<td>验证方式（二次留资 / 店端核对 / 短信 / 人工复听）与时间</td>
<td>验证动作</td>
</tr>
</tbody>
</table></div>
<p>索引就三条：<code>idx_encrypt_id</code>、<code>idx_phone</code>、<code>idx_phone_status</code>。要点只有一条——<strong>候选明文不建索引，占用检查用密文查、不拿明文当查询条件</strong>（完整定义见辅材 2.5 ①）。</p>
<p><strong>状态机：只有&quot;已验证&quot;才写主字段</strong></p>

<p><strong>录入四道校验（顺序执行，任一不过就拦）</strong>：① 11 位正则 → ② 不能是掩码形态、不能等于本条掩码号 → ③ 号码占用检查（<strong>用密文查</strong>，命中提示对方门店，让坐席判断&quot;是同一人&quot;还是&quot;录错了&quot;）→ ④ 坐席对该线索有跟进权限。</p>

<h3 id=&quot;sec-15&quot;>3.4 掩码线索外呼怎么干（作业要点）</h3>
<blockquote>
<p>前三节解决「号怎么收、怎么认、怎么取」，这一节解决<strong>活怎么干</strong>：掩码线索进总部培育后，任务怎么生成、人怎么呼、呼不通怎么办、接通后怎么开口。</p>
</blockquote>
<p><strong>① 任务生成：什么线索能进外呼任务</strong></p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>线索形态</th>
<th>能否生成外呼任务</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td>掩码线索（无候选明文）</td>
<td>✅ 能，照常生成</td>
<td>拨的是掩码号，坐席界面显示 <code><strong>*</strong>**3090</code> + 「掩码」标记</td>
</tr>
<tr>
<td>掩码线索 + 已有候选明文</td>
<td>✅ 能，优先拨候选</td>
<td>候选只作本次呼叫参数，不写主字段；验证通过才转正</td>
</tr>
<tr>
<td>掩码线索 + 已验证明文</td>
<td>✅ 能，拨真号</td>
<td>与普通线索无异</td>
</tr>
<tr>
<td>号码不可拨（平台限制 / 线路不通）</td>
<td>❌ 拦下，转「待补充触达」</td>
<td>记「未触达-无可用号码」，不进未接统计</td>
</tr>
</tbody>
</table></div>
<p>举个例子：张先生从抖音留资，进来只有 <code><strong>*</strong>**3090</code>；当天 10:00 照常生成外呼任务，坐席任务池里看到的是掩码号 + 「抖音」来源标签，正常分配。</p>
<p><strong>② 外呼模式：人工可用，预测外呼待定</strong></p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>模式</th>
<th>掩码线索</th>
<th>卡点</th>
</tr>
</thead>
<tbody>
<tr>
<td>人工预览（PHONEBAR 点击拨号）</td>
<td>✅ 主用</td>
<td>LC-B7 改造：拨号经智能 DCC 取本次中间号</td>
</tr>
<tr>
<td>预测外呼（批量自动拨）</td>
<td>⏳ 待定（N21）</td>
<td>中间号每次外呼会变，批量取号的并发与失败重试需平台说明</td>
</tr>
<tr>
<td>AI 外呼（试驾排程等）</td>
<td>⏳ 待定（N21）</td>
<td>同上前提；且 AI 话术无法临场引导客户留真号，收益偏低</td>
</tr>
</tbody>
</table></div>
<p>判断口径：<strong>预测外呼的事和天润切换评估一起定</strong>——两件都落在「批量外呼任务池」这一层，分开定必返工。</p>
<p><strong>③ 呼不通怎么办：重拨与兜底</strong></p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>结果</th>
<th>动作</th>
<th>举个张先生的例子</th>
</tr>
</thead>
<tbody>
<tr>
<td>未接</td>
<td>按原重拨规则：间隔 2 小时、上限 3 次</td>
<td>10:00 未接 → 12:00、15:00 各再呼一次</td>
</tr>
<tr>
<td>三次未接</td>
<td>原「自动转短信辅助建联」<strong>失效</strong>（短信发不到掩码号）→ 改转「待短信池」，拿到明文后补发</td>
<td>三次未接 → 进待短信池挂「待补充触达」，不静默丢弃</td>
</tr>
<tr>
<td>接通即挂</td>
<td>计入接通，正常跟进</td>
<td>记「接通 8 秒」，仍算一次有效触达</td>
</tr>
<tr>
<td>空号 / 停机音</td>
<td>掩码线索不查在网状态（N5），只能靠触达结果反推</td>
<td>连续三次空号音 → 打「疑似空号」标签，人工复核</td>
</tr>
</tbody>
</table></div>
<p><strong>关键变化</strong>：掩码号<strong>不能回拨</strong>（客户回拨走平台线路，不回我们线路），二次触达只剩「我方再呼」一条路——<strong>首呼时效比以往更重要</strong>，任务生成到首呼建议压到 4 小时内。</p>
<p><strong>④ 接通之后：三步 + 两个必须确认</strong></p>
<p>三步（话术见运营附件，不进本文档）：</p>
<ol>
<li><strong>确认身份</strong>：不念掩码号、不透「抖音」来源细节，按姓名 + 意向车型核对</li><li><strong>要真号 / 加微</strong>：客户同意后坐席录入，当场可拨（作会话参数），验证通过才转正（3.3 路 B）</li><li><strong>约到店</strong>：到店登记即完成验证转正（3.3 状态机），这是唯一不用等客户再留资的转正方式</li>
</ol>
<p>两个必须确认：</p>
<ul>
<li><strong>外显号码</strong>（N22）：客户来电显示是坐席号、门店号还是平台号——直接影响接听率</li><li><strong>通道费用与并发</strong>（N22）：智能 DCC 取号的计费方式与并发上限，立项要出数</li>
</ul>
<p><strong>⑤ 本节落地</strong></p>
<ul>
<li>话术：单独出《总部培育掩码线索外呼话术》运营附件，本文档不写死</li><li>N21、N22 已进第 7 章待确认清单</li>
</ul>
<hr>
</div>

<td>失去外呼失败后的短信兜底，接通率与二次触达率下降；报表必须按来源拆分</td>
<td>中</td>
</tr>
<tr>
<td>R6</td>
<td>掩码号稳定性误解</td>
<td>判重键只认加密标识，禁止以掩码号判重</td>
<td>中</td>
</tr>
<tr>
<td>R7</td>
<td>时间风险</td>
<td>11 月初须启动、10 月下旬须立项；准备过渡预案</td>
<td>高</td>
</tr>
</tbody>
</table></div>
<p><strong>过渡兜底（三档才启用）</strong>：「智能 DCC + 隐私号」路径——号码 90 天有效、不支持跨渠道去重；需额外做「号码有效期类型 / 剩余天数」字段、到期预警、剩余不足拦截外呼、转其他触达。代价是明年再切一次。</p>
<hr>
</div>

<div class=&quot;section&quot;><h2 id=&quot;sec-2&quot;>二、留资线索链路：改造范围</h2>
<p>留资链路分三段：车巴巴收（2.1）→ 线索中心校验并下发（2.2）→ 厂商系统入库（2.3）。三段都要动，其中前两段是号码闸门所在。</p>
<h3 id=&quot;sec-3&quot;>2.0 先看这张表：同一个东西，在各处叫什么</h3>
<p>各系统历史上各叫各的，先看这张对照表，后面遇到新名字不用再猜。概念本身（掩码号、加密标识、中间号是什么、会不会变）见<strong>交底总方案第 1 章</strong>，这里只管「字段名叫什么」。</p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>说的是什么</th>
<th>各处实际叫什么</th>
<th>本文统一叫</th>
</tr>
</thead>
<tbody>
<tr>
<td>客户的明文手机号</td>
<td>接口 A <code>phone</code>、接口 B <code>contactTel</code>、东风南方 / 启辰抖店 <code>telephone</code>、懂车云店原型写「电话」、汽车之家状态回传 <code>customerPhone</code>、主库列名也是 <code>phone</code></td>
<td><strong>主字段</strong></td>
</tr>
<tr>
<td>抖音给的线索 ID</td>
<td>接口 A <code>extsystem_clue_id</code>、接口 B <code>outSystemCluekey</code>、抖音入口 <code>id</code> 或「线索ID」、回写接口「线索外部系统线索id」、报表「NEV线索中台编码」</td>
<td><strong>原线索 ID</strong></td>
</tr>
<tr>
<td>这条线索是明文还是掩码</td>
<td><code>phone_type</code>（A）/ <code>phoneType</code>（B）</td>
<td><strong>号码形态</strong></td>
</tr>
<tr>
<td>平台下发的 <code><strong>*</strong>**3090</code></td>
<td><code>mask_phone</code>（A）/ <code>maskPhone</code>（B）</td>
<td><strong>掩码号</strong></td>
</tr>
<tr>
<td>不可逆的密文</td>
<td><code>encrypt_id</code>（A）/ <code>encryptId</code>（B）</td>
<td><strong>加密标识</strong></td>
</tr>
<tr>
<td>坐席或撞重拿到、但还没验证的明文</td>
<td><code>candidate_phone</code></td>
<td><strong>候选明文</strong></td>
</tr>
</tbody>
</table></div>
<p>全文就这六个中文名：主字段、原线索 ID、号码形态、掩码号、加密标识、候选明文。</p>
<p><strong>三层名字别混</strong>：接口层是报文字段名（车巴巴 A 接口用下划线、B 接口用驼峰，两边本来就不一致）；存储层是主库列名，统一下划线（如 <code>candidate_phone</code>）；展示层是页面与报表上的中文标签。讲接口入参一律说「手机号」，讲落库与转正一律说「主字段」。</p>

<p>研发实现时，上表的「号码形态」对应 <code>phone_type</code>（接口 B 为 <code>phoneType</code>），「手机号」对应报文的 <code>phone</code>（接口 B 为 <code>contactTel</code>）。错误码文案是给调用方看的，所以用中文；条件表达式在代码里用字段名。</p>
</blockquote>
<p><strong>② 例外：声明是掩码线索，却同时传了 11 位明文号</strong></p>
<p>这种报文一定会出现（上游复用 DTO、过渡期平台双发、链路中途补号），处置原则一句话：<strong>不拒收、不采信——主字段置空，明文转存候选，验证过才准用。</strong> 密文同源已确认（2026-10-17），所以问题不是&quot;对不上&quot;，是&quot;这个随报文塞进来的号码本身不敢信&quot;：它没经过平台背书，也可能是占位号或旧号；一旦采信，坐席照着拨、正式转明时覆盖打架、老旧模块绕过加密标识走手机号判重，三个坑全踩。</p>
<p>处置分五层：</p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>层</th>
<th>处置</th>
<th>为什么</th>
</tr>
</thead>
<tbody>
<tr>
<td>校验</td>
<td>只校验三件套，<strong>不校验明文号格式</strong></td>
<td>不因明文号非法而拒收，兼容上游现状</td>
</tr>
<tr>
<td>落库</td>
<td>主字段落 NULL；明文值转存候选明文，来源记 <strong>1（报文明文）</strong>、验证状态=0。该列不参与判重、外呼、展示等业务动作，录入与转正规则见 2.5</td>
<td>主字段保持干净，信息不丢</td>
</tr>
<tr>
<td>判重</td>
<td>只用加密标识 + 专营店，<strong>不读候选明文</strong></td>
<td>与纯掩码线索同一套键，不分裂</td>
</tr>
<tr>
<td>展示</td>
<td>显示掩码号；候选明文仅在有权限的详情页以「待验证」标识展示</td>
<td>防坐席照着打</td>
</tr>
<tr>
<td>外呼</td>
<td>走隐私号双轨，<strong>默认不拨候选明文</strong>；按品牌/门店的策略开关放开后可拨，并打标留痕（开关默认关，见交底总方案 3.3 责任归属）</td>
<td>号码未验证；放开属业务决策，做成开关而不是写死禁止</td>
</tr>
</tbody>
</table></div>
<p>候选明文唯一的转正条件：到店转明 / 成交回传的<strong>正式链路</strong>带回明文并核对一致，才写主字段（来源置 2，留审计痕迹）；撞重补全走 2.4，来源记 3，审计分得开。另外按调用方计数上报这类报文，推动上游改干净——否则问题会被「兼容」悄悄掩盖。</p>
<p><strong>③ 存储与索引（有一条硬约束）</strong></p>
<ul>
<li>号码相关字段共 <strong>11 列</strong>，完整定义只在 <strong>2.5 ①</strong> 维护一份，本节不重复列表，避免两处口径打架。本节只涉及其中五列：主字段、号码形态、掩码号、加密标识、候选明文。默认值 <code>phone_type=1</code>，其余为 NULL；MySQL 8 用 instant add column，不锁表</li><li><strong><code>encrypt_id</code> 不能建唯一索引</strong>：同一客户从不同渠道来会生成多条线索，加密标识必然重复，唯一约束会把这些正常线索直接挡回去。建<strong>普通索引</strong> <code>idx_encrypt_id</code> 供撞重查询即可</li><li>候选明文不建索引、不进查询条件——号码占用检查靠密文查 <code>idx_encrypt_id</code>，不靠这个明文列（做法见 2.5 ④）</li><li>幂等仍靠原线索 ID（A <code>extsystem_clue_id</code> / B <code>outSystemCluekey</code>），与现有逻辑一致，不新增判重路径</li>
</ul>
<p><strong>④ 向下游透传</strong></p>
<ul>
<li>车巴巴 → 线索中心：号码形态、掩码号、加密标识三个字段原样带过去；线索中心在主字段为空时 LC-A1 放行、LC-A2 跳过（改法见 2.2）</li><li><strong>候选明文不向下游透传</strong>：它未经验证，一旦流到线索中心与厂商系统，就等于把「不采信」的决定在下一跳推翻</li><li>一对多拆分：每条复制<strong>同一</strong>加密标识与掩码号，原线索 ID 相同——否则 3 家店会把同一客户当 3 个新客户</li>
</ul>
<p><strong>⑤ 灰度与验收</strong></p>
<ul>
<li>灰度：按 <code>page_id</code>、<code>dataSource</code> 两个维度做白名单，放开号码形态=2 的受理（先小范围）。先拿 1 个品牌 + 1 家店跑通。开关关着时一律返回 1006——不复用 1002，避免把「没开放」误报成「掩码号格式错」</li><li>验收用例，八条：</li>

<h3 id=&quot;sec-7&quot;>2.4 撞重补全：工程前提、审计约束与自测</h3>
<p>同源在工程上等价于两条：<strong>同一号码，本地算与平台下发得到同一个密文；且本地任意时点可对任意明文重算密文</strong>。有了这两条才能做撞重——本地把对方线索的明文加密一遍，拿密文回自己库里查有没有对应的掩码线索，不向平台发请求、明文不出库。</p>
<blockquote>
<p>这条能力是双刃的：谁能调加密节点，谁就能对任意号码算出密文去撞库。因此加密节点只由服务端调用、业务侧不开放直接调用；所有反查必须记操作人与事由，与 2.5 ④ 号码占用检查共用同一套审计约束。</p>
</blockquote>
<p><strong>方案口径全部在交底总方案 3.3 路 A</strong>：两道闸门（密文同源 / 明文可信）、补的八条规则（补空不覆盖、只写候选、打三标、不并线索、正式链路覆盖并告警、实时 + 日终两个触发点、一条对多条全补、多条对一条取最近一次）、责任归属与三条自我约束，以那份为准，本节不重复。</p>
<p><strong>本节交付给开发的自测清单</strong>：① 撞重命中 → 号码落候选明文、主字段仍空、来源=3、状态=0；② 跨店撞重 → 照补（2026-10-21 起不限门店），且能查到「补给了哪个门店」；③ 字节线索主字段已有值 → 一个字不碰；④ 补全后正式链路带回不同明文 → 以正式链路为准，差异有日志、有告警。</p>
<p><strong>灰度</strong>：先 dry-run 两周只统计不写，准确率 ≥95% 再开写。同源已确认后，「密文没命中」是正常的查不到；真正要盯的异常是「明明同一个人却算不出同一个密文」，那是加密节点配置漂移，按故障排查，不计入业务拒绝。</p>
<h3 id=&quot;sec-8&quot;>2.5 人工跟进拿到明文之后：录入、验证、回写</h3>
<p><strong>这条路线不需要新造功能，落点在现网已有的动作上。</strong></p>
<p>《任务跟进》原型（v10.1，2026-04-08）原文写着：「任务列表的『呼叫』按钮，唤起 PHONEBAR 的『外呼』拨号键，回填任务关联的手机号。<strong>备注：坐席可以修改手机号，和修改线路呼出，不影响关联回访任务。</strong>」</p>
<p>也就是说，坐席改号现在就能做，改完直接盖在号码字段上——不校验、不留痕、不知道改的是对是错。掩码上线后，这个动作就是「坐席录入真实号码」的唯一入口。本节要做的就是改它的行为：<strong>改号仍然当场可拨（那是本次呼叫的会话参数），但不再直接写主字段，改写候选。</strong></p>

<h4>④ 号码占用检查：用密文查，不查明文</h4>
<p>这一步防的是「坐席错一位数，正好是另一个真实客户」。看起来概率低，线索量上百万就是天天发生，而且后果是两个客户的数据交叉、两家店抢同一个客户。</p>
<p>做法：写入前先把输入的号码本地加密，得到一个加密标识，再用 <code>idx_encrypt_id</code> 索引查这个密文是否已经在<strong>其他</strong>线索上：</p>
<ul>
<li>未命中 → 允许录入，号码落候选明文</li><li>命中其他线索 → 拦下，提示对方的门店，让坐席二选一：<strong>是同一位客户</strong>（转撞重流程，走 LC-B3）/ <strong>录错了</strong>（清空重录）</li>
</ul>
<p>好处是三重的：不用给候选明文建索引、不拿明文做查询条件、与 2.1.3 定的存储约束一致。前提是加密节点全系统统一、且与平台同算法同盐——<strong>后一条已于 2026-10-17 由字节确认</strong>。</p>

<p><strong>LC-B15 落地说明：导入场景下「加密」由谁做、模板怎么改</strong></p>
<p><strong>加密由程序在上传后自动完成，员工不需要、也不该手工填加密标识。</strong> 分两种场景：</p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>场景</th>
<th>Excel 里有什么</th>
<th>程序做什么</th>
<th>模板改不改</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 明文号码（常态：展会、门店、DCC 手工收集）</td>
<td>客户姓名 + 11 位手机号</td>
<td>服务端先做 11 位校验 → 本地加密生成加密标识 → 与明文号码同行落库（号码形态记 1）</td>
<td><strong>不用改</strong>，员工无感；加密标识由系统生成，不开放填写</td>
</tr>
<tr>
<td>② 带掩码的数据（外部系统导出、批量承接字节线索）</td>
<td>手机号列是掩码格式，另有加密标识、原线索 ID</td>
<td>按号码列的形态<strong>自动分流</strong>：是 11 位明文就走场景①；是掩码格式就走掩码入库，此时加密标识与原线索 ID 必填，缺一个就整行拒收并在结果里标出行号</td>
<td>增加三列<strong>可选</strong>列：掩码号 / 加密标识 / 原线索 ID；不填就走场景①</td>
</tr>
</tbody>
</table></div>
<p>两个必须守住的口径：</p>
<ul>
<li><strong>加密与字节下发同算法同盐，已确认（2026-10-17）</strong>。所以场景①本地生成的加密标识，和平台下发的能直接比对：这位客户从手工导入渠道进来，能跟字节来的那条撞上，导入判重成立。原来是这条链上最悬的一环，现在落地了。要守住的是——加密节点必须严格按字节给的算法与盐配置，不许自行选参数或换实现。</li><li><strong>导入判重键跟着变</strong>：明文行按现有手机号判重不变；掩码行按加密标识（或原线索 ID）判重，同一文件内重复行提示合并，不重复建线索。</li>
</ul>
<h3 id=&quot;sec-10&quot;>3.1 短信：已确认发不出去，影响六处</h3>
<p>2026-10-17 已确认：<strong>掩码号不能接收短信，平台也不代发</strong>。且短信<strong>不是</strong>任务生成的前置条件（原型批次 10,000 条去重、短信成功 9,911 条，任务照样 10,000 个，见交底总方案 4.5）——抖音线索不会卡在短信这一步，真正丢的是下面六处动作：</p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>#</th>
<th>落点</th>
<th>原型出处（现状证据）</th>
<th>改法（开发执行）</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>三无忧「短信预触达」</td>
<td>批次执行记录四步：候选池生成（准入/分层/去重过滤）→ 短信预触达 → 生成任务；报表列「短信成功」排在「DCC培育任务」之前</td>
<td>掩码线索跳过预触达、直接进任务池；报表「短信成功」列对掩码线索显示「不适用」，成功率分母剔除</td>
</tr>
<tr>
<td>2</td>
<td>AI 外呼结束后的短信下发（5 条规则）</td>
<td>《短信下发配置》：按外呼类型、通话状态、外呼标签、优先级命中后下发，共 5 个模板</td>
<td>规则执行前先判线索来源，掩码线索直接跳过并记「未触达-无可用号码」</td>
</tr>
<tr>
<td>3</td>
<td><strong>三次未接的自动兜底</strong></td>
<td>《2~N呼接通率》自愈机制：「若 3 次外呼皆未接通，系统自动触发退池机制，将其转为『短信辅助建联』策略」</td>
<td>改为「转待短信池」：标记等明文，拿到明文后补发；掩码期不计入「短信辅助建联」口径</td>
</tr>
<tr>
<td>4</td>
<td>坐席「未接通」下的跟进结果</td>
<td>《任务跟进》跟进结果枚举：未接通 → 稍后回拨 / 短信跟进（未接通发短信、客户要求短信、其他）</td>
<td>掩码线索隐藏「短信跟进」，只留「稍后回拨」；客户明确要求短信时，落一条「待补发」待办</td>
</tr>
<tr>
<td>5</td>
<td>坐席任务卡「下发短信 / 下发关怀短信」</td>
<td>《任务跟进》任务卡两个按钮</td>
<td>掩码线索按钮置灰，悬浮写明原因</td>
</tr>
<tr>
<td>6</td>
<td>任务排班 4 类模板</td>
<td>《任务排班-短信模板》：到店提醒、跟进回访、活动邀约、生日祝福</td>
<td>模板标注「掩码线索不可用」；到店提醒改由坐席电话或企微提醒，试驾排程页同步</td>
</tr>
</tbody>
</table></div>
<p>改完的净效果：<strong>抖音线索在拿到明文之前，触达手段只剩外呼一种，且没有短信兜底。</strong> 接通率与二次触达率都会受影响，报表必须能按线索来源分开看，否则会被当成系统故障排查。</p>
<hr>
</div>

<td>《外呼任务明细》导出按手机号反查线索回填「NEV线索中台编码」，掩码后整列空</td>
</tr>
<tr>
<td>试驾 / 排程（4.4）</td>
<td>TD1–TD3</td>
<td>P1</td>
<td>试驾回访工单按手机号取 180 天记录</td>
</tr>
<tr>
<td>配置器群（4.5）</td>
<td>CF1–CF5</td>
<td>P0（CF5）</td>
<td>回访预外呼重推配置按手机号查店端跟进状态（CF5），与 OT1 同款查询</td>
</tr>
<tr>
<td>其他散页（4.6）</td>
<td>OT1、OT2、OT4</td>
<td>P0</td>
<td>智能体填单审核按号码判重（OT1）；私域留资未满同步的唯一 ID 生成（OT2）</td>
</tr>
<tr>
<td>已排查、无落点</td>
<td>—</td>
<td>仅核对</td>
<td>CDP 打标签、AI 场景专营店选取规则：号码只用于展示或条件匹配，不产生新的改造项</td>
</tr>
</tbody>
</table></div>
<p>读法：标 P0 的六行不同步改，上线当天会同时出问题——媒体线索进不来、接入层拦下、坐席搜不到人、报表对不上账、判重重复建单。</p>
</div>

<h1>抖音掩码改造 · 疑问与依赖梳理</h1>
<p class=&quot;sub&quot;></p>
<div class=&quot;meta&quot;><b>依据</b> 《抖音掩码改造_开发交底总方案》v1.3 第 7 / 8 章 ｜ <b>整理</b> 黄裕烽 ｜ 2026-10-23 ｜ 16 条疑问三级分层 · 每条含场景、卡点、例子与建议对接方</div>
</div>
<div class=&quot;section&quot;><h2 id=&quot;sec-1&quot;>一、要请字节侧答复的疑问</h2>
<h3 id=&quot;sec-1-0&quot;>先看链路：一条抖音线索怎么走到主机厂</h3>
<p><strong>客户留资 → 抖音线索系统 → DNDC 接入平台 → 下发主机厂（COC / NEV）</strong></p>
<ul>
<li><strong>客户留资</strong>：客户在抖音 App 里填表单、私信、直播间组件留了购车意向；</li>
<li><strong>抖音线索系统</strong>：抖音把线索收集起来，按 2027-01-04 新政脱敏后向主机厂侧分发；</li>
<li><strong>DNDC 接入平台</strong>：我们这一端收报文、验号码、判重、向下转发——<strong>本次改造的课题基本都压在这一环</strong>；</li>
<li><strong>下发主机厂（COC / NEV）</strong>：线索进入 COC / NEV 中台，再流到 DCC 培育与门店跟进。</li>
</ul>
<h3>围绕 DNDC 接入平台的课题（先看大局）</h3>
<p>按上面四个环节，16 条疑问归成五类课题。每类先说一句话，<strong>细节（场景、卡点、例子、建议谁去问）按阻断 → 重要 → 一般三级列在本节后半部分</strong>：</p>
<div class=&quot;tbl&quot;><table>
<thead><tr><th>环节</th><th>课题一句话</th><th>相关编号</th></tr></thead>
<tbody>
<tr><td><strong>进</strong>：报文收得进来吗</td><td>号码在报文里怎么传、我方校验放不放行——三种形态对应三套改法，不定无法开工</td><td>N1、N9、N19、N13</td></tr>
<tr><td><strong>认</strong>：认得出是谁吗</td><td>判重从手机号换成加密标识，这个字段和归属地能不能跟着线索一路带过来</td><td>N2、N3</td></tr>
<tr><td><strong>转</strong>：转得出主机厂吗</td><td>向 COC / NEV 转发的报文要不要加掩码字段，卡在下游排期</td><td>N8、N10</td></tr>
<tr><td><strong>用</strong>：外呼还灵不灵</td><td>话单录音怎么回传、空号检测还能不能做——决定培育环节的能力边界</td><td>N20、N5</td></tr>
<tr><td><strong>出</strong>：明文怎么回来</td><td>到店回传口径、政策有效期、评级与进展回传——决定取号与转化的闭环</td><td>N15、N17、N18、N6、N7、N16</td></tr>
</tbody>
</table></div>
<p><strong>一句话读法</strong>：进和转是「能不能开工」（阻断 / 契约），认和用是「做到一半停不停」（设计依赖），出是「闭环闭不闭得上」（政策口径）。五类课题的明细如下。</p>
<h3 id=&quot;sec-1-1&quot;>阻断级</h3>
<blockquote>
<p>这三条拿不到答复，对应的代码就没法开始写。</p>
</blockquote>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>编号</th>
<th>什么场景</th>
<th>卡在哪</th>
<th>不确认会怎样（举个例子）</th>
<th>建议谁去问 / 渠道</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>N1</strong>（11/05 前）</td>
<td>11 个字节系入口把线索推 / 拉给我们：E2–E10 对方推送、E1 与 E11 我方轮询拉取</td>
<td><strong>报文里号码怎么传</strong>没有说法——① 掩码号填进原「电话」字段；② 电话字段留空、另加掩码号与加密标识；③ 仍给明文。同时我方接口 <code>phone</code> / <code>contactTel</code> 必填、车巴巴另有 13~19 位强校验（5 处），<strong>校验是否放开也要一起定</strong></td>
<td>三种形态对应三种改法，分流方案与工作量都估不出，还可能出现线索全被拒收：懂车云店推一条只有 <code>*******3090</code> 的线索过来，现有校验判「手机号码不合法」，整条进异常表</td>
<td><strong>产品书面发字节</strong>：附 E1–E11 清单与三种形态选项让对方勾选，需正式答复</td>
</tr>
<tr>
<td><strong>N9</strong>（11/05 前）</td>
<td>头条 MAPI 这一路：下发每 10 分钟、更新每 6 小时，由我方轮询拉取</td>
<td>号码<strong>从哪个字段取</strong>不知道——下发与更新两页原型的示例只有姓名 / 省 / 市 / 经销商 / 车型，没有电话那一格</td>
<td>窗口 ① 无法改造，头条来源的线索取不到号：头条推一条「广州风日 H2901X」的线索过来，报文里翻不到号码放在哪个 key，加密比对无从做起</td>
<td><strong>研发进技术群直接问</strong>：纯字段确认，可与 N1 同一封发出</td>
</tr>
<tr>
<td><strong>N20</strong>（11/10 前）</td>
<td>话单与录音回传、坐席监听 / 耳语</td>
<td>话单明细<strong>包含哪些字段、时效、格式</strong>不清；<strong>实时信令（监听 / 耳语）是否开放</strong>未知</td>
<td>录音落库表、质检关联、监听功能都设计不了：质检要按「通话超过 60 秒」筛线索，不知道话单里有没有时长字段，这个筛选就写不出来</td>
<td><strong>研发对接</strong>：纯技术问题，建议拉字节研发与我方质检开发三方碰一次</td>
</tr>
</tbody>
</table></div>
<h3 id=&quot;sec-1-2&quot;>重要级</h3>
<blockquote>
<p>这六条可以先动手，但做到一半一定会停下来等答复。</p>
</blockquote>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>编号</th>
<th>什么场景</th>
<th>卡在哪</th>
<th>不确认会怎样（举个例子）</th>
<th>建议谁去问 / 渠道</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>N2</strong></td>
<td>线索归属地分派与一对多下发——现规则「专营店城市 &amp;gt; 手机号城市 &amp;gt; 专营店省份 &amp;gt; 手机号省份」</td>
<td>掩码线索<strong>是否仍带</strong>省 / 市 / 经销商编码（E2–E5 已知带「意向城市 / 意向省份 / 分发经销商ID」）</td>
<td>只能按手机号归属地猜城市：原来靠「分发经销商ID」直接把线索派到广州风日，这个字段在掩码线索上没了，就只能猜客户在哪个城市</td>
<td><strong>随 N1 一并书面确认</strong>：同属报文形态问题，不单发</td>
</tr>
<tr>
<td><strong>N3</strong></td>
<td>同一客户在抖音和其他渠道分别留资，要在 NEV 中台判成同一人</td>
<td>加密标识<strong>能否透传到 NEV 中台</strong>并用于其去重（算法同源已确认，剩链路与中台是否采用）</td>
<td>透传断了重复线索激增：客户在抖音留一次、在官网留一次，两边密文一模一样，中台不认，仍建两条线索，派给两家店</td>
<td><strong>研发对接，两问合一</strong>：字节确认透传 + 联友确认中台是否采用</td>
</tr>
<tr>
<td><strong>N15</strong></td>
<td>客户到店转明、成交后回传明文——这是<strong>唯一合规的取号方式</strong></td>
<td>触发条件、返回字段、时效、校验方式分别是什么（是当天回传还是 T+1？号码放在哪个字段？）</td>
<td>路 B 只能做本地那一半：张先生到店，DMS 什么时候回传、回传到哪一列都不清楚，坐席录入的号就只能一直挂在候选格，永远转不了正</td>
<td><strong>产品牵头问字节</strong>：涉及业务流程与合规取号，需书面</td>
</tr>
<tr>
<td><strong>N17</strong></td>
<td>豁免期（2027-01-14）结束后，此前以明文下发的存量线索怎么办</td>
<td>豁免期内取得的明文<strong>还能不能用</strong>、要不要我方对存量线索重新按隐私号口径取号</td>
<td>可能要二次改造：库里已有的存量明文线索，1 月 14 号之后还能不能拨、要不要重取一遍号，没人回答就只能先按最坏情况预留工作量</td>
<td><strong>产品 / 商务问字节</strong>：政策口径，书面确认并留凭证</td>
</tr>
<tr>
<td><strong>N18</strong></td>
<td>掩码号「不限期」这个有效期口径，直接决定任务调度与号码回收怎么写</td>
<td>是否与线索状态有关、已成交或已关单<strong>能否再呼</strong>、是否需周期性重新取号</td>
<td>任务调度设计不了：客户三个月前已经成交，这条号码是永远有效，还是关单就该停呼——两种做法对应两套调度逻辑</td>
<td><strong>随 N17 一并问</strong>：同为政策有效期口径</td>
</tr>
<tr>
<td><strong>N5</strong></td>
<td>外呼前查在网 / 空号，把无效号码提前拦掉（现有两套空号缓存 48 小时 / 15 天）</td>
<td>掩码号<strong>能否用于</strong>在网 / 空号检测，或平台是否直接返回号码有效性</td>
<td>两套缓存口径都要改，拦不住就白打：现在查到空号直接拦，掩码号查不了，就只能拨出去才知道是空号，坐席空号率上升</td>
<td><strong>研发进技术群问</strong>：能力接口类，一句话可答</td>
</tr>
</tbody>
</table></div>
<h3 id=&quot;sec-1-3&quot;>一般级</h3>
<blockquote>
<p>这 7 条都不是「报错型」问题——失败时系统不崩、日志无告警，只会<strong>静默少干活</strong>（评级空了、回传匹配不上、字段传不过去），容易拖到上线后才发现。</p>
</blockquote>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>编号</th>
<th>什么场景</th>
<th>卡在哪</th>
<th>不确认会怎样（举个例子）</th>
<th>建议谁去问 / 渠道</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>N6</strong></td>
<td>车巴巴的「火山引擎线索评级」：拿客户手机号算 MD5，与媒体人群包匹配，得出线索意向分级</td>
<td>掩码线索只有掩码号和加密标识；加密标识是 VOPRF 密文、<strong>不是 MD5</strong>，与人群包对不上</td>
<td>评级<strong>静默变空值</strong>，不报错。张先生的抖音线索原来是 A 级高意向，现在算不出 MD5、评级为空，被排到队列尾部，三天后才有人拨。要问：能否提供按加密标识匹配人群包的替代方式，或直接下发画像标签</td>
<td><strong>随 N1 书面发字节</strong>：涉及媒体人群包，可能需拉媒体方</td>
</tr>
<tr>
<td><strong>N7</strong></td>
<td>线索有进展（已联系 / 已到店 / 已购车）要回传媒体（汽车之家等），请求参数里 <code>customerPhone</code> 现为明文</td>
<td>掩码线索没有已验证的明文：填掩码号媒体认不出，留空可能被拒</td>
<td>回传匹配不上 → 媒体侧看不到转化 → 投放优化与线索成本结算受影响。张先生已到店，回传时 <code>customerPhone</code> 填 <code>*******3090</code>，汽车之家不知道是哪条线索。要问：能否改传隐私号或改用线索 ID 映射——本质是「双方认同一个键」</td>
<td><strong>随 N15 一并书面</strong>：同为状态回传口径，可能涉及媒体方</td>
</tr>
<tr>
<td><strong>N8</strong></td>
<td>车巴巴收到线索后转发下游（主机厂 COC / NEV 中台），转发报文里 <code>phone</code> 必填</td>
<td>掩码线索没有明文 phone：传空行不行？能否新增 <code>mask_phone</code>、<code>encrypt_id</code> 字段？下游不在我方，需对方排期</td>
<td>字段加不了，加密标识<strong>断在车巴巴这一层</strong>——后面 NEV、DCC 的判重全部失去依据。张先生的线索转发给 NEV 中台，phone 传空被拒收，整条停在车巴巴，NEV 侧看不到。与 N3 一起问：N3 是目的、N8 是手段</td>
<td><strong>与 N3 合并发联友</strong>：报文加字段由联友排期</td>
</tr>
<tr>
<td><strong>N10</strong></td>
<td>我们的跟进记录回写到 NEV 线索中台，现状报文<strong>不含电话字段</strong></td>
<td>能不能加号码字段？加了之后中台<strong>采不采信</strong>（拿它去重与下发）</td>
<td>若中台收到但不用，这条回写白做——所以它是「值不值得做」而非「能不能做」，答案为「不采信」则该功能点砍掉只留本地。坐席在 DCC 跟进张先生并回写，但中台不拿号码判重，下次他在官网留资中台仍当新客户。<strong>回答能省工作量</strong></td>
<td><strong>群里先问</strong>：一句话定做不做，研发即可发起</td>
</tr>
<tr>
<td><strong>N13</strong></td>
<td>E11「启辰本地通车云店」入口，我方每 10 分钟拉取一次</td>
<td>那页原型修订记录写着「<strong>下线接口服务</strong>」（2024-01-04），可能两年前就停了，无人确认</td>
<td>两个方向都有成本：停了 → 11 入口变 10、改造量可减；还在跑 → 它是唯一无入站强校验的入口，掩码号会直接当合法电话入库。<code>*******3090</code> 进来没有任何校验拦截，只能靠线索中心那层兜底。<strong>问一句就能省工作量或补漏洞</strong></td>
<td><strong>群里先问</strong>：一句话定入口个数</td>
</tr>
<tr>
<td><strong>N16</strong></td>
<td>只与<strong>过渡方案</strong>有关：若 11 月底字节不答复，走「智能 DCC + 隐私号」路径，该路径号码 90 天有效（部分场景 14 天）</td>
<td>号码到期后是什么状态？在途未呼完的任务怎么处理？</td>
<td>没定义就只能等报错。过渡路径下张先生的号码 90 天到期，任务列表还有 3 条待呼，到期瞬间集体失败。主方案掩码号不限期、无此问题，<strong>标「仅过渡路径」是为防开发误以为主线也要做有效期字段</strong>。可暂不问</td>
<td><strong>暂不问</strong>：走了过渡路径再问</td>
</tr>
<tr>
<td><strong>N19</strong></td>
<td>客户在抖音<strong>私信聊天里自己打手机号</strong>（走 E11，<code>clue_source=8</code>、来源「私信」），平台会做脱敏处理</td>
<td>脱敏后给我们的<strong>字段形态</strong>没人确认：是掩码号、<code>138****8899</code> 中间打码、还是别的格式？字段定义能否同步</td>
<td>形态不明则解析规则写不了，按 11 位正则匹配全部失败，这类线索整批进异常表。客户私信打「我电话 138xxxx8899」，平台给我们 <code>138****8899</code>——既不是掩码号、也不是加密标识、也不是明文，是设计之外的第 4 种形态</td>
<td><strong>随 N1 书面发字节</strong>：字段定义类，要正式答复</td>
</tr>
</tbody>
</table></div>
<p><strong>这 7 条分三类，问的顺序建议</strong>：</p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>类型</th>
<th>条目</th>
<th>不确认的代价</th>
</tr>
</thead>
<tbody>
<tr>
<td>防静默降级</td>
<td>N6 评级、N7 回传、N19 私信解析</td>
<td>上线后才发现：评级空、转化回传不上、整类线索进异常表</td>
</tr>
<tr>
<td>契约确认（下游改不改）</td>
<td>N8 报文加字段、N16 过渡路径到期</td>
<td>卡在别人排期上，越晚问越贵</td>
</tr>
<tr>
<td>能省工作量</td>
<td>N10 回写值不值得做、N13 入口还剩几个</td>
<td>不问就得按最坏情况估工作量</td>
</tr>
</tbody>
</table></div>
<p>N13、N10 最便宜（一句话定工作量），可先在群里问掉；N6、N19 最易被忽略但坑最深，建议与 N1 一起发给字节；N8 与 N3 合并成一封；N16 先不问——只有走过渡方案才需要，现在问反而让人以为我们要选那条路。</p>
<hr />
</div><div class=&quot;section&quot;><h2 id=&quot;sec-2&quot;>二、要跟联友 / DNDC、内部对齐的依赖</h2>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>依赖项</th>
<th>对齐什么</th>
<th>现状</th>
<th>建议对接方（谁牵头确认）</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>加密节点全系统统一</strong></td>
<td>全系统只能有一个加密节点（同一算法、同一把盐）；各方落库 / 传输环节都用它算密文</td>
<td>已与字节确认同源；联友侧系统是否接入同一节点<strong>待对齐</strong></td>
<td><strong>我方数据团队</strong>牵头（节点由其部署运维，见总方案 5.2）；<strong>联友侧接口负责人</strong>配合确认 NEV 链路是否接同一节点</td>
</tr>
<tr>
<td><strong>NEV 报文 / 回写接口加字段</strong></td>
<td>加密标识、掩码号要能透传（N8 / N10）</td>
<td>待接口侧排期</td>
<td><strong>联友（NEV 中台接口侧）</strong> 确认能否加字段、是否采信回写号码——这条由他们排期，问得越晚越贵</td>
</tr>
<tr>
<td><strong>存量线索补加密</strong></td>
<td>新老线索互不相认会导致重复建单，列为阶段 2 硬性交付（R3）</td>
<td>排期内</td>
<td><strong>我方数据团队</strong>执行（批量补算密文）；<strong>业务运营</strong>确认存量线索范围（哪些渠道、哪些年份要纳入）</td>
</tr>
<tr>
<td><strong>密钥轮换双向流程</strong></td>
<td>单侧轮换不报错、不告警，只表现为撞重率归零，极难倒查（R3a）</td>
<td>已写入设计约束</td>
<td><strong>我方数据团队</strong>发起并落实为流程（换密钥两侧同批、切前 100 条样本比对、命中率告警）；<strong>联友等接入方</strong>签署遵守——只要一方单独换钥，全系统判重即失效</td>
</tr>
<tr>
<td><strong>短信能力</strong></td>
<td>抖音线索掩码号收不到短信、平台不代发——六处短信触发点全部降级</td>
<td>已闭环（2026-10-17），此处仅同步</td>
<td>无需确认。<strong>同步对象：业务运营</strong>——管理预期：拿到明文前短信触达不可用，外呼是唯一手段</td>
</tr>
<tr>
<td><strong>真实被叫号</strong></td>
<td>话单回传的是顾问号码，平台不回传客户真号——「话单反查真号」不可行</td>
<td>已闭环（2026-10-20），请业务侧管理预期</td>
<td>无需确认。<strong>同步对象：质检 / 业务侧</strong>——话单只能用于通话质检，不能反查客户号码</td>
</tr>
</tbody>
</table></div>
<hr />
</div><div class=&quot;section&quot;><h2 id=&quot;sec-3&quot;>三、我方已定、不再等答复的事项（同步性质）</h2>
<p><strong>撞重补全的用途边界（N14）</strong>：平台对此不予书面回应、不承担责任，属我方自主行为、风险自留。我方自限三条：① 默认只写候选明文，不写主字段；② 候选是否可用于外呼做成按品牌 / 门店的策略开关，默认关闭；③ 全程审计留痕。</p>
<p><strong>落实分工</strong>：</p>
<div class=&quot;tbl&quot;><table>
<thead>
<tr>
<th>事项</th>
<th>由谁</th>
</tr>
</thead>
<tbody>
<tr>
<td>自限三条落入系统设计（候选不写主字段、策略开关默认关、审计留痕）</td>
<td>我方开发（已写入总方案 3.3 / 4.3，随开发交付）</td>
</tr>
<tr>
<td>核查协议有无「撞重取明文」的禁止性条款</td>
<td><strong>法务</strong>（评审前完成，结论回填本清单）</td>
</tr>
<tr>
<td>群内发一条告知性留言留痕（只告知、不请示）</td>
<td><strong>产品</strong>（开工前完成，留聊天记录）</td>
</tr>
</tbody>
</table></div>
<hr />
</div><div class=&quot;section&quot;><h2 id=&quot;sec-4&quot;>四、时间依赖链</h2>
<p><pre><code>10月下旬 立项 ──→ 11月初 启动 ──→ 11/05、11/10 字节答复节点
      ──→ 12月 开发与联调 ──→ 2027-01-04 政策生效
</code></pre></p>
<ul>
<li>11 月初不启动，后续全部顺延（R7，高风险）；</li>
<li>12 月窗口内还要并行完成存量线索加密（阶段 2）；</li>
<li>政策生效前需完成切换演练（命中率 / 撞重率对账指标就位，见总方案 6.2）。</li>
</ul>
<hr />
</div><div class=&quot;section&quot;><h2 id=&quot;sec-5&quot;>五、给下周业务验收的提示</h2>
<ol>
<li>抖音线索在拿到明文之前，<strong>触达手段只剩外呼一种，且没有短信兜底</strong>——接通率与二次触达率会受影响，报表已按线索来源拆分，不是系统故障；</li>
<li>取真号靠两条路：撞重补全（系统推断，只写候选）+ 客户确认（再次留资 / 到店 / 短信验证，验证通过才转正）；</li>
<li>判重只认加密标识，掩码号固定不变但中间号每次外呼会变——验收时不要用掩码号对线索。</li>
</ol></div>
