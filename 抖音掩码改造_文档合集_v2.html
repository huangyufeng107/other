&lt;div class=&quot;wrap&quot;&gt;

  &lt;div class=&quot;hero&quot;&gt;
    &lt;div class=&quot;kicker&quot;&gt;LEADERSHIP EXECUTIVE SUMMARY&lt;/div&gt;
    &lt;h1&gt;抖音掩码改造 · 5分钟高层汇报提纲&lt;/h1&gt;
    &lt;p class=&quot;desc&quot;&gt;
      &lt;strong&gt;核心汇报主旨&lt;/strong&gt;：抖音新政将于 &lt;strong&gt;2027年1月4日&lt;/strong&gt; 正式生效（不再提供客户明文手机号）。本方案通过建设&lt;strong&gt;“密文比对判重 + 抖音虚拟隐私号外呼 + 坐席电话核身转明”&lt;/strong&gt;三位一体闭环，确保业务线索不流失、外呼作业不停摆、数据资产绝对合规。
    &lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid-4&quot;&gt;
    &lt;div class=&quot;stat-card&quot;&gt;
      &lt;div class=&quot;label&quot;&gt;政策生效倒计时&lt;/div&gt;

      &lt;div class=&quot;sub&quot;&gt;硬性截止日，无延期余地&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stat-card&quot;&gt;
      &lt;div class=&quot;label&quot;&gt;业务影响范围&lt;/div&gt;
      &lt;div class=&quot;val&quot;&gt;100% 覆盖&lt;/div&gt;

    &lt;/div&gt;

    &lt;/div&gt;
    &lt;div class=&quot;stat-card&quot;&gt;
      &lt;div class=&quot;label&quot;&gt;外部协同边界&lt;/div&gt;
      &lt;div class=&quot;val&quot; style=&quot;color:#2563eb;&quot;&gt;极简解耦&lt;/div&gt;
      &lt;div class=&quot;sub&quot;&gt;联友负责店端，我方免责闭环&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;h2&gt;1. 改造方案全景：一句话讲透“号怎么流转” &lt;span class=&quot;tag&quot;&gt;业务主线&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;flow-box&quot;&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;div class=&quot;step-title&quot;&gt;① 留资入库&lt;/div&gt;
        &lt;div class=&quot;step-desc&quot;&gt;抖音下发掩码号（如 &lt;code&gt;***3090&lt;/code&gt;）+ &lt;strong&gt;加密哈希标识&lt;/strong&gt;；我方通过密文比对，精准识别老客撞重。&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;div class=&quot;step-title&quot;&gt;② 正常外呼&lt;/div&gt;
        &lt;div class=&quot;step-desc&quot;&gt;无需等待明文！坐席外呼时，系统&lt;strong&gt;实时向抖音申请临时虚拟隐私号&lt;/strong&gt;发起呼叫，坐席端脱敏操作。&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;div class=&quot;step-title&quot;&gt;③ 电话核身&lt;/div&gt;
        &lt;div class=&quot;step-desc&quot;&gt;通话接通后，坐席通过&lt;strong&gt;电话口述发送 6 位验证码&lt;/strong&gt;，客户核身通过当场转正为真实明文号码。&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;flow-step&quot;&gt;
        &lt;div class=&quot;step-title&quot;&gt;④ 下发与沉淀&lt;/div&gt;
        &lt;div class=&quot;step-desc&quot;&gt;转正后同步联友店端系统（一处更新全局生效），且&lt;strong&gt;绝对不回传抖音&lt;/strong&gt;，防止平台封禁处罚。&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;h2&gt;2. 四大关键红线决策（已全面定稿） &lt;span class=&quot;tag&quot;&gt;高层关注点&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;tbl&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th style=&quot;width:20%;&quot;&gt;核心课题&lt;/th&gt;
            &lt;th style=&quot;width:30%;&quot;&gt;我方最终决议&lt;/th&gt;
            &lt;th&gt;为业务带来的核心价值 / 风险防范&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;① 撞重命中处理&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;highlight-pill pill-green&quot;&gt;直接转正写入主字段&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;线索若密文比对命中已有真实客户，直接转正为明文直拨，无需再向客户重复索要验证码，培育效率最大化。&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;② 转明数据回传&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;highlight-pill pill-green&quot;&gt;彻底不回传抖音&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;严守抖音反规避红线。转明数据仅沉淀在主机厂内部私域，绝不逆向推送字节，彻底规避封店停流风险。&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;③ 门店系统免责&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;highlight-pill pill-blue&quot;&gt;边界清晰，由联友托底&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;门店端（销售顾问APP、PC端）由联友全权负责；若店端因未改造导致无法看号，责任在店端，我方接入平台免责。&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;④ 坐席转明核身&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;highlight-pill pill-blue&quot;&gt;坐席口述 6 位验证码&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;电话接通中直接发码，坐席口述核验，杜绝“代客刷码”合规漏洞，一次通话闭环留存真实明文。&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;h2&gt;3. 跨系统分工与协同矩阵 &lt;span class=&quot;tag&quot;&gt;组织与边界&lt;/span&gt;&lt;/h2&gt;
    &lt;div class=&quot;tbl&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;参与主体&lt;/th&gt;
            &lt;th&gt;核心职责范围&lt;/th&gt;
            &lt;th&gt;交付成果与现状&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;我方接入平台 (DNDC)&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;报文接入、密文计算存储、密文比对判重、下发主机厂 COC/NEV 中台&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;highlight-pill pill-green&quot;&gt;方案就绪&lt;/span&gt; 3个服务改造接口全部锁定&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;智能 DCC (呼叫中心)&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;坐席工作台掩码展示、对接抖音接口动态换取虚拟隐私号、6位验证码发码核身&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;highlight-pill pill-green&quot;&gt;方案就绪&lt;/span&gt; 11个接口改造点明确对齐&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;联友科技 (店端及下游)&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;店端系统（销售APP/PC）掩码展示改造、店端核身后回传接入平台&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;highlight-pill pill-blue&quot;&gt;协议锁定&lt;/span&gt; 双方字段格式对齐，责任边界划分完毕&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;&lt;strong&gt;字节跳动 (抖音平台)&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;推送脱敏报文、提供取临时虚拟隐私号 API&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;highlight-pill pill-amber&quot;&gt;推进中&lt;/span&gt; 等待字节侧最终确认报文字段命名（N1课题）&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot;&gt;
    &lt;h2&gt;4. 项目关键推进里程碑 &lt;span class=&quot;tag&quot;&gt;落地排期&lt;/span&gt;&lt;/h2&gt;
    &lt;p&gt;&lt;strong&gt;项目关键推进里程碑：&lt;/strong&gt;&lt;/p&gt;
    &lt;ul&gt;

&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-1&quot;&gt;一、4 个决定&lt;/h2&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;要你定的事&lt;/th&gt;
&lt;th&gt;最终裁决结论&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;1&lt;/td&gt;
&lt;td&gt;系统比对到这条线索的客户在别处留过资，&lt;strong&gt;能不能直接把真号转正、坐席直接用&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;能，全公司一套规则&lt;/strong&gt;：系统密文比对匹配成功即直接转正写入主字段，坐席直接外呼真实号码。&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2&lt;/td&gt;
&lt;td&gt;客服在电话里拿到客户口述号码，&lt;strong&gt;怎么确认是本人&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;电话中口述 6 位验证码，坐席在系统弹窗填码转正&lt;/strong&gt;：坐席发起发码，电话中引导客户念出 6 位验证码，坐席在弹窗输入提交；5 分钟有效、错 3 次作废；核身通过立即转正，挂机或未通过退回待核实。&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;3&lt;/td&gt;
&lt;td&gt;客户交车时 DMS 里有真号，&lt;strong&gt;怎么用它转明&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;我们自己比对、自己转正，由我方系统本地自治闭环，无需依赖且不触发抖音侧接口&lt;/strong&gt;：DMS 里本来就有真号，跟线索加密标识对上就直接转正；比对不上的不做强制转明，转由客服人工核验兜底。&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;4&lt;/td&gt;
&lt;td&gt;转明后是否回传抖音（含跟进状态与成交）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;转明即彻底停传&lt;/strong&gt;：这条线索只要拿到明文号，就彻底不再回传抖音——跟进状态、到店、成交全部不再回传。&lt;/td&gt;
&lt;/tr&gt;

&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-2&quot;&gt;二、三句话说清背景&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;① 密文匹配成功即效率最大化&lt;/strong&gt;：根据业务方拍板，只要跨渠道比对密文一致，直接将明文转正供坐席拨打，不再进行繁琐的二次短信核身，最大限度提升转化效率。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;② 转明后彻底断绝与抖音关系&lt;/strong&gt;：不向抖音换明文，也不再回传成交。交车转明完全靠我们自己 DMS 数据与本地密文比对，全程不经过抖音系统。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;③ 短信核身场景纯粹化&lt;/strong&gt;：密文匹配成功不发短信。短信核身仅用于“坐席在电话里拿到客户口述新号码”这一唯一场景，走我方自建短信通道，坐席当场填码闭环。&lt;/p&gt;

&lt;tr&gt;
&lt;td&gt;第 1 题&lt;/td&gt;
&lt;td&gt;张先生在官网留过明文，抖音又留资产生掩码线索。系统比对密文一致，直接转正为正式号码，坐席在工作台可直接直拨张先生真实电话。&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;第 2 题&lt;/td&gt;
&lt;td&gt;李女士在电话中告知坐席平时用 138xxxx3090，坐席点击发码并在通话中询问：“李女士请看下手机短信，把收到的 6 位服务验证码念给我核对一下”，李女士念出后坐席填入弹窗，线索当场转正。&lt;/td&gt;
&lt;/tr&gt;

&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;dot&quot;&gt;1&lt;/span&gt;&lt;span&gt;这张图怎么读：&lt;b&gt;绿色＝原有通道不动&lt;/b&gt;（自有 DCC 外呼、结果回流），&lt;b&gt;橙色＝本次新建&lt;/b&gt;（各垂媒智能 DCC 可插拔接入），红字是每一段的改动点。&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;dot&quot;&gt;2&lt;/span&gt;&lt;span&gt;两条分界：明码线索复用自有外呼；各垂媒掩码线索按垂媒接入智能 DCC，延长转化窗口。油车线索由线索中心直发门店；电车线索可直发，也可先经总部培育、回流线索中心后委派到店。&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;dot&quot;&gt;3&lt;/span&gt;&lt;span&gt;掩码线索全链路需重点攻克五个关键难点：①入口报文接入 ②身份标识穿透 ③隐私号外呼路由 ④短信策略降级 ⑤转化结果回流——后面一页讲一个。&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;text x=&quot;740&quot; y=&quot;160&quot; font-size=&quot;11&quot; fill=&quot;#166534&quot;&gt;换通道 —— ⑥ 到店提醒改电话确认 / 企微&lt;/text&gt;
&lt;text x=&quot;740&quot; y=&quot;192&quot; font-size=&quot;10.5&quot; fill=&quot;#94a3b8&quot;&gt;原则：避免坐席产生无效交互，也不让客户白等&lt;/text&gt;
&lt;text x=&quot;740&quot; y=&quot;214&quot; font-size=&quot;10.5&quot; fill=&quot;#94a3b8&quot;&gt;预期要提前讲：拿到明文前，外呼是唯一触达&lt;/text&gt;
&lt;rect x=&quot;16&quot; y=&quot;264&quot; width=&quot;1028&quot; height=&quot;44&quot; rx=&quot;9&quot; fill=&quot;#f8fafc&quot; stroke=&quot;#e2e8f0&quot;/&gt;
&lt;text x=&quot;530&quot; y=&quot;291&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#334155&quot;&gt;好消息：历史批次 10,000 条、短信成功 9,911 条，任务照样生成 10,000 个——短信不是任务生成的前置条件，抖音线索不会卡在这一步&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;notes&quot;&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;dot&quot;&gt;1&lt;/span&gt;&lt;span&gt;这一块是&lt;b&gt;体验损失而不是系统故障&lt;/b&gt;：接通率、二次触达率会掉，报表已按来源拆分，别当成 bug 查。&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;dot&quot;&gt;2&lt;/span&gt;&lt;span&gt;三次未接那条最值得讲：原来它是「打不通」时唯一的自动补救，现在改成挂起等明文——业务侧要有预期。&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 图 7 --&gt;
&lt;section&gt;
&lt;h2&gt;&lt;span class=&quot;no&quot;&gt;⑦&lt;/span&gt;关键难点⑤ 转化结果闭环：跨系统跟进状态键值归一&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;客户到店、成交、跟进有进展，先回流主机厂；未转明线索还要回传抖音。原来回的是明文号码，现在得换成一个双方都认的键。&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 1060 300&quot; font-family=&quot;inherit&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;a6&quot; markerWidth=&quot;9&quot; markerHeight=&quot;8&quot; refX=&quot;8&quot; refY=&quot;4&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L9,4 L0,8 z&quot; fill=&quot;#94a3b8&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;16&quot; y=&quot;30&quot; width=&quot;200&quot; height=&quot;62&quot; rx=&quot;9&quot; fill=&quot;#fff&quot; stroke=&quot;#cbd5e1&quot;/&gt;
&lt;text x=&quot;116&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;#0f172a&quot;&gt;客户到店&lt;/text&gt;
&lt;text x=&quot;116&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#64748b&quot;&gt;DMS 登记手机号&lt;/text&gt;
&lt;rect x=&quot;16&quot; y=&quot;116&quot; width=&quot;200&quot; height=&quot;62&quot; rx=&quot;9&quot; fill=&quot;#fff&quot; stroke=&quot;#cbd5e1&quot;/&gt;
&lt;text x=&quot;116&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;#0f172a&quot;&gt;通话与跟进&lt;/text&gt;
&lt;text x=&quot;116&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#64748b&quot;&gt;接通 / 未接 / 意向等级&lt;/text&gt;
&lt;rect x=&quot;16&quot; y=&quot;202&quot; width=&quot;200&quot; height=&quot;62&quot; rx=&quot;9&quot; fill=&quot;#fff&quot; stroke=&quot;#cbd5e1&quot;/&gt;
&lt;text x=&quot;116&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;#0f172a&quot;&gt;投放进展&lt;/text&gt;
&lt;text x=&quot;116&quot; y=&quot;246&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#64748b&quot;&gt;已联系 / 已到店 / 已购车&lt;/text&gt;
&lt;line x1=&quot;216&quot; y1=&quot;61&quot; x2=&quot;300&quot; y2=&quot;61&quot; stroke=&quot;#94a3b8&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a6)&quot;/&gt;
&lt;line x1=&quot;216&quot; y1=&quot;147&quot; x2=&quot;300&quot; y2=&quot;147&quot; stroke=&quot;#94a3b8&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a6)&quot;/&gt;
&lt;line x1=&quot;216&quot; y1=&quot;233&quot; x2=&quot;300&quot; y2=&quot;233&quot; stroke=&quot;#94a3b8&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a6)&quot;/&gt;
&lt;rect x=&quot;304&quot; y=&quot;30&quot; width=&quot;330&quot; height=&quot;62&quot; rx=&quot;9&quot; fill=&quot;#ecfdf3&quot; stroke=&quot;#12b76a&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;54&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;#067647&quot;&gt;密文比对命中 → 自动验证转正&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;76&quot; font-size=&quot;10.5&quot; fill=&quot;#166534&quot;&gt;候选号变成正式号，主字段写入&lt;/text&gt;
&lt;rect x=&quot;304&quot; y=&quot;116&quot; width=&quot;330&quot; height=&quot;62&quot; rx=&quot;9&quot; fill=&quot;#eff4ff&quot; stroke=&quot;#155eef&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;140&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;#123a86&quot;&gt;回流主机厂：进展与成交照常入档&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;162&quot; font-size=&quot;10.5&quot; fill=&quot;#334155&quot;&gt;按加密标识 / 抖音线索编号匹配&lt;/text&gt;
&lt;rect x=&quot;304&quot; y=&quot;202&quot; width=&quot;330&quot; height=&quot;62&quot; rx=&quot;9&quot; fill=&quot;#fff7ed&quot; stroke=&quot;#f59e0b&quot;/&gt;
&lt;text x=&quot;320&quot; y=&quot;226&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;#7c3a06&quot;&gt;回传抖音：未转明照常，已转明即停&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;248&quot; font-size=&quot;10.5&quot; fill=&quot;#9a3412&quot;&gt;仅未转明线索回传，号码字段改传标识&lt;/text&gt;
&lt;rect x=&quot;660&quot; y=&quot;30&quot; width=&quot;384&quot; height=&quot;234&quot; rx=&quot;11&quot; fill=&quot;#f8fafc&quot; stroke=&quot;#e2e8f0&quot;/&gt;
&lt;text x=&quot;676&quot; y=&quot;56&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;#0f172a&quot;&gt;要抖音确认的两件（都在总方案第 6 章清单里）&lt;/text&gt;
&lt;text x=&quot;676&quot; y=&quot;84&quot; font-size=&quot;11&quot; fill=&quot;#334155&quot;&gt;· 未转明线索的进展回传，承认什么键：线索编号 or 加密标识（N7）&lt;/text&gt;

&lt;text x=&quot;676&quot; y=&quot;164&quot; font-size=&quot;11&quot; fill=&quot;#94a3b8&quot;&gt;不定会怎样：号码列空、转化回传不上、评级静默变空&lt;/text&gt;
&lt;text x=&quot;676&quot; y=&quot;196&quot; font-size=&quot;11&quot; fill=&quot;#94a3b8&quot;&gt;——不报错、不告警，最容易拖到上线后才发现&lt;/text&gt;
&lt;text x=&quot;676&quot; y=&quot;228&quot; font-size=&quot;11&quot; fill=&quot;#067647&quot;&gt;所以这两条要跟 N1 一起，书面问、书面答&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;notes&quot;&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;dot&quot;&gt;1&lt;/span&gt;&lt;span&gt;一句话：&lt;b&gt;回流不再靠&quot;号码&quot;，靠&quot;标识&quot;&lt;/b&gt;。谁跟谁的线索对上，靠这一串，不靠那个号。&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;dot&quot;&gt;2&lt;/span&gt;&lt;span&gt;这两条最容易被忽略，因为失败时不报错——评级空值、回传匹配不上，都是上线后才发现。&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 收尾 --&gt;
&lt;section&gt;
&lt;h2&gt;&lt;span class=&quot;no&quot;&gt;⑧&lt;/span&gt;需要抖音配合的，就两条关键项（其余已闭环）&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;这两条属于上游报文协议输入，答复后接口方案与联调即可全面锁定。&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 1060 220&quot; font-family=&quot;inherit&quot;&gt;
&lt;rect x=&quot;24&quot; y=&quot;24&quot; width=&quot;490&quot; height=&quot;160&quot; rx=&quot;12&quot; fill=&quot;#fef3f2&quot; stroke=&quot;#f04438&quot; stroke-width=&quot;1.5&quot;/&gt;
&lt;text x=&quot;48&quot; y=&quot;56&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#b42318&quot;&gt;N1 · 报文里号码怎么传（上游格式）&lt;/text&gt;
&lt;text x=&quot;48&quot; y=&quot;86&quot; font-size=&quot;12&quot; fill=&quot;#b42318&quot;&gt;三选一：填原电话字段 / 电话留空另加字段 / 仍给明文&lt;/text&gt;
&lt;text x=&quot;48&quot; y=&quot;112&quot; font-size=&quot;12&quot; fill=&quot;#b42318&quot;&gt;顺带确认车巴巴 11 位强校验放行规则&lt;/text&gt;
&lt;text x=&quot;48&quot; y=&quot;148&quot; font-size=&quot;11.5&quot; font-weight=&quot;600&quot; fill=&quot;#b42318&quot;&gt;期限：11/05&lt;/text&gt;
&lt;text x=&quot;48&quot; y=&quot;170&quot; font-size=&quot;11&quot; fill=&quot;#b42318&quot;&gt;敲定后，下游三种接入解析逻辑即可开工&lt;/text&gt;

&lt;rect x=&quot;546&quot; y=&quot;24&quot; width=&quot;490&quot; height=&quot;160&quot; rx=&quot;12&quot; fill=&quot;#fef3f2&quot; stroke=&quot;#f04438&quot; stroke-width=&quot;1.5&quot;/&gt;
&lt;text x=&quot;570&quot; y=&quot;56&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#b42318&quot;&gt;N9 · 字节头条 MAPI 号码取数规范&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;86&quot; font-size=&quot;12&quot; fill=&quot;#b42318&quot;&gt;现有报文示例里未直接暴露电话字段&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;112&quot; font-size=&quot;12&quot; fill=&quot;#b42318&quot;&gt;明确取号取标识具体 JSON 节点，确保这一路解析对齐&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;148&quot; font-size=&quot;11.5&quot; font-weight=&quot;600&quot; fill=&quot;#b42318&quot;&gt;期限：11/05&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;170&quot; font-size=&quot;11&quot; fill=&quot;#b42318&quot;&gt;可与 N1 同一封技术函件向字节发出&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;notes&quot;&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;dot&quot;&gt;1&lt;/span&gt;&lt;span&gt;另有 6 条重要级（省市字段、标识透传、到店回传口径、有效期、空号检测等），不影响开工，会后书面给。&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;
&lt;h2&gt;&lt;span class=&quot;no&quot;&gt;⑨&lt;/span&gt;联友配合开发：技术契约归一（全面对齐实际工程落地）&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;杜绝虚构新接口与冗余排期：全面对齐实际工程实施——老接口透传字段 + 现成回写中台通道补字段 + 联友全量库反查单接口兜底，双方契约清晰闭环。&lt;/p&gt;

  &lt;table style=&quot;width:100%;border-collapse:collapse;font-size:13px;&quot;&gt;

        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;&quot;&gt;老接口加字段接收（排期确认）&lt;/td&gt;
        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;&quot;&gt;报文新增 &lt;code&gt;mask_phone&lt;/code&gt;、&lt;code&gt;encrypt_id&lt;/code&gt;，主字段 &lt;code&gt;phone&lt;/code&gt; 允许接收空值，放行掩码线索入库&lt;/td&gt;

        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;&quot;&gt;提供全量密文反查明文只读接口&lt;/td&gt;
        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;&quot;&gt;传：&lt;code&gt;encrypt_id + 车系标识&lt;/code&gt; → 返回：明文手机号（仅首轮实时库未命中时调用）&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;font-weight:700;color:#155eef;&quot;&gt;LC-B12&lt;/td&gt;
        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;&quot;&gt;跟进记录回写中台&lt;/td&gt;
        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;&quot;&gt;DCC 培育 → NEV 线索中台&lt;/td&gt;
        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;&quot;&gt;现成回写通道补充字段接收&lt;/td&gt;
        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;&quot;&gt;回写报文补充 &lt;code&gt;encrypt_id&lt;/code&gt;、验证状态、转正明文号，用于中台同步关联更新&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td style=&quot;border:1px solid #e6ebf3;padding:10px;font-weight:700;color:#155eef;&quot;&gt;NEV 绑定校验&lt;/td&gt;

&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-4&quot;&gt;0.3 什么时候&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;时间&lt;/th&gt;
&lt;th&gt;事项&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;2026-10 下旬&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;立项评审通过（&lt;strong&gt;卡点&lt;/strong&gt;：晚一周，后面全部顺延）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2026-11 上中旬&lt;/td&gt;
&lt;td&gt;接入智能 DCC、双轨外呼打通&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2026-11 下旬～12 上旬&lt;/td&gt;
&lt;td&gt;换键：字段、判重、名单、归属地 + 存量加密&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2026-12 中下旬&lt;/td&gt;
&lt;td&gt;补能力：短信降级、录音、补录转明、权限合规&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2026-12 下旬～2027-01-03&lt;/td&gt;
&lt;td&gt;灰度、切换演练、回滚预案&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;2027-01-04&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;全量承接掩码线索&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2027-01-14&lt;/td&gt;
&lt;td&gt;豁免期结束，存量明文口径确认&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-5&quot;&gt;0.4 现在还差什么（不给就开不了工）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;事项&lt;/th&gt;
&lt;th&gt;影响&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;N1&lt;/td&gt;
&lt;td&gt;11 个入口&lt;strong&gt;推 / 拉过来的报文&lt;/strong&gt;里号码怎么传（掩码号填原字段 / 字段留空另加 / 仍给明文）&lt;/td&gt;
&lt;td&gt;定不了，就不知道车巴巴按哪种方式分流校验&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N9&lt;/td&gt;
&lt;td&gt;字节头条 MAPI 的号码从哪个字段取&lt;/td&gt;
&lt;td&gt;窗口① 无法改造&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;完整清单见第 5 章（编号 N1–N19，含已闭环与已定性）。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-6&quot;&gt;1. 核心术语与关键概念规范&lt;/h2&gt;
&lt;p&gt;为保障研发架构与业务运营口径完全一致，首先统一以下四项核心数据定义：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;词&lt;/th&gt;
&lt;th&gt;数据形态示例&lt;/th&gt;
&lt;th&gt;时效性/稳定性&lt;/th&gt;
&lt;th&gt;业务与技术用途&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;掩码号&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt;，11 位、前 7 位是星号&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;固定不变&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;给人看的（坐席、门店）、兜底外呼的展示号。&lt;strong&gt;不能当判重键&lt;/strong&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;加密标识&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;一串 64 位不可逆加密哈希串（建议预留 128 位）&lt;/td&gt;
&lt;td&gt;一个手机号只对应一个，永不变&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;认人的唯一凭据&lt;/strong&gt;：判重、黑名单命中、跨渠道数据碰配全靠它&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;抖音原线索 ID&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;抖音自己的线索编号&lt;/td&gt;
&lt;td&gt;不变&lt;/td&gt;
&lt;td&gt;换可外呼号码的入参；现网查重键本来就是它，直接复用&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;中间号&lt;/strong&gt;（外呼临时号）&lt;/td&gt;
&lt;td&gt;每次外呼时系统临时分配的号码&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;每次外呼都会变&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;只是拨号通道，不能用来认人&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;核心原则：掩码号仅作脱敏展示，中间号每次呼叫动态分配，跨系统客户唯一身份穿透全权依赖加密标识。&lt;/strong&gt;&lt;/p&gt;
&lt;blockquote&gt;
&lt;p&gt;我方本地算出的加密标识与平台下发的&lt;strong&gt;是同一套算法、同一把盐，一个手机号只对应一个加密标识&lt;/strong&gt;。所以本地密文可以和平台下发的直接比对——这是后面&quot;密文比对匹配&quot;能成立的前提。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-7&quot;&gt;2. 改造范围：11 个入口，其实只有 4 个窗口&lt;/h2&gt;
&lt;h3 id=&quot;sec-8&quot;&gt;2.1 四窗口（按窗口改，不按页面改）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;窗口&lt;/th&gt;
&lt;th&gt;覆盖入口&lt;/th&gt;
&lt;th&gt;现网号码校验&lt;/th&gt;
&lt;th&gt;接入方向&lt;/th&gt;
&lt;th&gt;改造要点&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;① 字节头条 MAPI&lt;/td&gt;
&lt;td&gt;E1（下发 + 更新两页）&lt;/td&gt;
&lt;td&gt;无强校验，两页原型都&lt;strong&gt;没有电话字段&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;我方轮询拉取&lt;/td&gt;
&lt;td&gt;得先确认号码到底从哪个字段取（N9）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;② 懂车云店线索接口&lt;/td&gt;
&lt;td&gt;E2–E5（广告投放 / 日产总部 / 日产店端 / 启辰店端）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;电话必填 + 13~19 位&lt;/strong&gt;（四页一字不差）&lt;/td&gt;
&lt;td&gt;对方推送&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;阻断级&lt;/strong&gt;：掩码号必然被拦，要按&quot;是不是字节线索&quot;分流校验&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;③ 车云店线索接口&lt;/td&gt;
&lt;td&gt;E8–E10（日产店端 / 活动对赌 / 启辰车云店）&lt;/td&gt;
&lt;td&gt;手机号码必填；E8 同款 13~19 强校验&lt;/td&gt;
&lt;td&gt;对方推送&lt;/td&gt;
&lt;td&gt;同 ②，强校验同款共 5 处&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;④ 车云店 MAPI&lt;/td&gt;
&lt;td&gt;E11 启辰本地通车云店&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;没有任何入站强校验&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;我方每 10 分钟拉取&lt;/td&gt;
&lt;td&gt;反向风险：星号会被当合法号直接入库，只能靠线索中心那层拦；另外这接口可能已下线（N13）&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-9&quot;&gt;2.2 两个结论（直接影响改造顺序）&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;掩码号在车巴巴这一层就进不来&lt;/strong&gt;——13~19 位强校验比线索中心的正则更靠前。所以第一批改动必须是 CB9（校验分流），它不改，后面全部无从验证。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;查重键本来就是线索 ID&lt;/strong&gt;（&lt;code&gt;extsystem_clue_id&lt;/code&gt; / &lt;code&gt;outSystemCluekey&lt;/code&gt;），不是手机号。抖音原线索 ID 直接落到这个字段，&lt;strong&gt;不用新建一套判重逻辑&lt;/strong&gt;——这是个利好。&lt;/li&gt;
&lt;/ul&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-10&quot;&gt;3. 核心设计（架构设计评审核心章节）&lt;/h2&gt;
&lt;div class=&quot;alert alert-tip&quot; style=&quot;border-left:4px solid #12b76a;background:#ecfdf3;color:#067647;padding:12px 16px;border-radius:8px;margin:16px 0;font-size:13.5px;line-height:1.7;&quot;&gt;&lt;strong style=&quot;display:block;margin-bottom:4px;font-size:13px;letter-spacing:0.02em;&quot;&gt;📌 业务建议与效率&lt;/strong&gt;&lt;strong&gt;【线索流转技术核心设计四大阶段】&lt;/strong&gt; ➔  ➔  ➔&lt;/div&gt;
&lt;h3 id=&quot;sec-11&quot;&gt;3.1 收线索：三个字段怎么传、怎么分流&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;字段（两个接口命名风格不同，各跟各的）&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;字段&lt;/th&gt;
&lt;th&gt;接口 A（下划线）&lt;/th&gt;
&lt;th&gt;接口 B（驼峰）&lt;/th&gt;
&lt;th&gt;类型&lt;/th&gt;
&lt;th&gt;说明&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;号码形态&lt;/td&gt;
&lt;td&gt;&lt;code&gt;phone_type&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;&lt;code&gt;phoneType&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;tinyint&lt;/td&gt;
&lt;td&gt;1 明文 / 2 掩码。&lt;strong&gt;显式声明，不靠号码长相猜&lt;/strong&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;掩码号&lt;/td&gt;
&lt;td&gt;&lt;code&gt;mask_phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;&lt;code&gt;maskPhone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;varchar(32)&lt;/td&gt;
&lt;td&gt;平台下发的 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;加密标识&lt;/td&gt;
&lt;td&gt;&lt;code&gt;encrypt_id&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;&lt;code&gt;encryptId&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;varchar(512)&lt;/td&gt;
&lt;td&gt;不可逆密文&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;原线索 ID&lt;/td&gt;
&lt;td&gt;复用 &lt;code&gt;extsystem_clue_id&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;复用 &lt;code&gt;outSystemCluekey&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;已有必填&lt;/td&gt;
&lt;td&gt;兼作幂等键&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;分场景必填（不是二选一）&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;场景&lt;/th&gt;
&lt;th&gt;明文手机号&lt;/th&gt;
&lt;th&gt;掩码号&lt;/th&gt;
&lt;th&gt;加密标识&lt;/th&gt;
&lt;th&gt;号码形态&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;非字节渠道&lt;/td&gt;
&lt;td&gt;必填，11 位校验不变&lt;/td&gt;
&lt;td&gt;不传&lt;/td&gt;
&lt;td&gt;不传（入库后本地加密生成）&lt;/td&gt;
&lt;td&gt;不传或 1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;字节系掩码线索&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;可空&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;必填&lt;/td&gt;
&lt;td&gt;必填&lt;/td&gt;
&lt;td&gt;2&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;字节系明文线索（过渡期）&lt;/td&gt;
&lt;td&gt;必填&lt;/td&gt;
&lt;td&gt;不传&lt;/td&gt;
&lt;td&gt;必填&lt;/td&gt;
&lt;td&gt;1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;掩码线索却带了 11 位明文&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;不收进主字段&lt;/strong&gt;；转存候选明文（来源=1、状态=0），不参与判重、外呼、展示&lt;/td&gt;
&lt;td&gt;必填&lt;/td&gt;
&lt;td&gt;必填&lt;/td&gt;
&lt;td&gt;2&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;分流逻辑（老调用方零改造）&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;不传形态 + 合法 11 位 → 按明文受理，行为不变&lt;/li&gt;&lt;li&gt;不传形态 + 号码不合法 → 维持现状拒绝&lt;/li&gt;&lt;li&gt;形态=2 → 掩码号 + 加密标识 + 原线索 ID &lt;strong&gt;三样齐全&lt;/strong&gt;，缺一即拒&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;错误码&lt;/th&gt;
&lt;th&gt;触发&lt;/th&gt;
&lt;th&gt;提示&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;1001&lt;/td&gt;
&lt;td&gt;手机号空且形态≠2&lt;/td&gt;
&lt;td&gt;掩码线索请传形态=2 并带齐三字段&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;1002&lt;/td&gt;
&lt;td&gt;形态=2 但掩码号格式不对&lt;/td&gt;
&lt;td&gt;掩码号格式不正确&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;1003&lt;/td&gt;
&lt;td&gt;形态=2 但缺加密标识&lt;/td&gt;
&lt;td&gt;加密标识不能为空&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-12&quot;&gt;3.2 认人：把所有&quot;拿号码当键&quot;的地方换成加密标识&lt;/h3&gt;
&lt;p&gt;这是改造面最大的一块。逐项清单：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;功能&lt;/th&gt;
&lt;th&gt;原来原识别键&lt;/th&gt;
&lt;th&gt;改造后识别键&lt;/th&gt;
&lt;th&gt;未改造的业务风险&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;重复跟进判断（LC-B3）&lt;/td&gt;
&lt;td&gt;手机号查店端跟进中 / 总部处理中&lt;/td&gt;
&lt;td&gt;加密标识&lt;/td&gt;
&lt;td&gt;同一客户被重复建单、重复外呼&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;留资未满唯一 ID（LC-B4）&lt;/td&gt;
&lt;td&gt;「同一个手机号码自动生成唯一 ID」&lt;/td&gt;
&lt;td&gt;加密标识&lt;/td&gt;
&lt;td&gt;人群包口径错乱&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;用户黑名单（LC-B10）&lt;/td&gt;
&lt;td&gt;手机号黑名单&lt;/td&gt;
&lt;td&gt;加密标识；导入明文先本地加密&lt;/td&gt;
&lt;td&gt;黑名单形同失效（最容易漏的一处）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;坐席搜索（LC-B6）&lt;/td&gt;
&lt;td&gt;精准匹配手机号&lt;/td&gt;
&lt;td&gt;加密标识 / 掩码后四位&lt;/td&gt;
&lt;td&gt;坐席搜不到人&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;试驾回访工单（LC-B14）&lt;/td&gt;
&lt;td&gt;手机号取 180 天记录&lt;/td&gt;
&lt;td&gt;加密标识&lt;/td&gt;
&lt;td&gt;历史记录查不出来&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;一对多拆单（CB2）&lt;/td&gt;
&lt;td&gt;一条线索拆给 3 家店 = 3 条独立线索&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;3 条带同一个加密标识&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;3 家店把同一人当 3 个新客&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;首触归因&lt;/td&gt;
&lt;td&gt;手机号&lt;/td&gt;
&lt;td&gt;加密标识 + 首触打标&lt;/td&gt;
&lt;td&gt;渠道归因、投放评估、供应商结算全错&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;关键行为提醒（同店再次留资 T/N）&lt;/td&gt;
&lt;td&gt;手机号&lt;/td&gt;
&lt;td&gt;加密标识（时间窗与频次不变）&lt;/td&gt;
&lt;td&gt;提醒不触发&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-13&quot;&gt;3.3 取真号：只有两条路&lt;/h3&gt;
&lt;div class=&quot;alert alert-tip&quot; style=&quot;border-left:4px solid #12b76a;background:#ecfdf3;color:#067647;padding:12px 16px;border-radius:8px;margin:16px 0;font-size:13.5px;line-height:1.7;&quot;&gt;&lt;strong style=&quot;display:block;margin-bottom:4px;font-size:13px;letter-spacing:0.02em;&quot;&gt;📌 业务建议与效率&lt;/strong&gt;&lt;strong&gt;【业务定调：效率优先直接转正】&lt;/strong&gt;：基于业务效率优先原则，密文同源比对命中即直接转正写入主字段（，已验证，来源记 3），坐席在工作台可直接直拨真实物理号码，无需二次验证码拦截，保障一线电销流转效率。&lt;/div&gt;
&lt;p&gt;在平台不再下发物理明文的前提下，系统获取真实手机号必须具备明确的数据依据与合规路径：&lt;/p&gt;
&lt;h4&gt;路 A：历史数据密文比对匹配（成本最低，但要平台书面认可用途）&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;原理&lt;/strong&gt;：不去抖音问&quot;这位客户是谁&quot;，而是&lt;strong&gt;拿密文去比对库里已有的明文&lt;/strong&gt;。比对分两轮，范围由近及远：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;轮次&lt;/th&gt;
&lt;th&gt;在哪比&lt;/th&gt;
&lt;th&gt;怎么比&lt;/th&gt;
&lt;th&gt;结果&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;首轮&lt;/td&gt;
&lt;td&gt;数据公司当日实时库&lt;/td&gt;
&lt;td&gt;对方线索的明文在本地加密一遍，拿密文比对匹配&lt;/td&gt;
&lt;td&gt;命中即取得完整明文手机号&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;二轮&lt;/td&gt;
&lt;td&gt;联友全量库（线索中心）&lt;/td&gt;
&lt;td&gt;首轮未命中 → 调联友查询接口：传加密标识 + 车系标识，匹配全量库&lt;/td&gt;
&lt;td&gt;命中返回明文；仍未命中保持掩码，等下次明文入库再比&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;线索来源&lt;/th&gt;
&lt;th&gt;加密标识丢了能不能补&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;自有渠道（展会、门店、DMS、垂媒、手工导入）&lt;/td&gt;
&lt;td&gt;有明文，本地重算即可补回，可批量跑&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;字节渠道&lt;/td&gt;
&lt;td&gt;手上只有星号和密文，&lt;strong&gt;补不出来&lt;/strong&gt;，只能按原线索 ID 回头找字节要，或等正式链路转明&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;两道闸门，全过才补：&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;闸门&lt;/th&gt;
&lt;th&gt;条件&lt;/th&gt;
&lt;th&gt;不满足时&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;密文同源&lt;/td&gt;
&lt;td&gt;已确认（2026-10-17），不再是风险项&lt;/td&gt;
&lt;td&gt;运行期监控&quot;加密标识命中率（密文匹配率）&quot;，异常下降=加密节点配置漂移&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;明文可信&lt;/td&gt;
&lt;td&gt;对方明文非空、过 11 位校验、非掩码形态、不是空号&lt;/td&gt;
&lt;td&gt;不补&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;补的规则——补空，不覆盖，且只写候选：&lt;/strong&gt;&lt;/p&gt;
&lt;blockquote&gt;
&lt;p&gt;先说清楚一条线索数据形态示例：一条线索就是一行记录，里面有一排格子——&lt;strong&gt;手机号&lt;/strong&gt;（正式栏）、&lt;strong&gt;掩码号&lt;/strong&gt;、&lt;strong&gt;加密标识&lt;/strong&gt;、&lt;strong&gt;候选明文&lt;/strong&gt;、&lt;strong&gt;验证状态&lt;/strong&gt;。下面说的&quot;补&quot;，就是往其中某一格写数。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;情形&lt;/th&gt;
&lt;th&gt;怎么做&lt;/th&gt;
&lt;th&gt;举个例子&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;抖音线索的&quot;手机号&quot;栏还空着&lt;/td&gt;
&lt;td&gt;才把撞出来的号写进去；栏里已经有号的，一个字都不碰&lt;/td&gt;
&lt;td&gt;坐席昨天已经手动录过一个号 → 这次不覆盖，避免多源数据产生覆盖冲突&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;补进来的号放在哪&lt;/td&gt;
&lt;td&gt;直接写入&quot;正式主字段（phone）&quot;——状态置为已验证（phone_status=1，来源记 3），坐席在工作台可直接直拨真实号码&lt;/td&gt;
&lt;td&gt;业务裁决（2026-10-28）：效率优先，只要密文同源比对命中即直接转正生效，坐席直接外呼，不再进行多余的短信核身&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;写入的同时打三个标记&lt;/td&gt;
&lt;td&gt;来源=3（密文比对匹配）、状态=0（待验证）、记下是从哪条线索撞来的&lt;/td&gt;
&lt;td&gt;以后报表能把&quot;撞来的号&quot;和&quot;客户自己给的号&quot;分开统计；出了争议也查得到来历&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;线索条数变不变&lt;/td&gt;
&lt;td&gt;不变。只补号码，不合并线索&lt;/td&gt;
&lt;td&gt;拆给广州风日、东莞南菱两家就是两条，各补各的；要不要并成一条，是&quot;重复跟进判断（LC-B3）&quot;的事&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;转明后与抖音彻底断绝关系&lt;/td&gt;
&lt;td&gt;转明即彻底停传：一旦拿到真实号码转明，后续任何跟进状态、到店、交车成交均彻底不再回传抖音&lt;/td&gt;
&lt;td&gt;官方不再回传明文，交车转明完全靠我们自己 DMS 数据本地密文比对，全程不经过抖音系统&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;什么时候补&lt;/td&gt;
&lt;td&gt;两个时机都做：① 实时——自有渠道线索一进来，马上撞一次；② 日终——每天凌晨把&quot;有乱码但没号&quot;的抖音线索全扫一遍&lt;/td&gt;
&lt;td&gt;客户周一在门店留资，抖音线索周二才进来——周一实时那次它还不存在，只能靠周二凌晨那轮补上。少一轮就漏一批&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;NEV 培育线索唯一性铁律（核心天条）&lt;/td&gt;
&lt;td&gt;严格遵循【一号一培育线索 ID】：转正前强校验未绑定关系，已绑定坚决拒绝本次转正&lt;/td&gt;
&lt;td&gt;该客户若在总部培育池中已有活跃线索，直接阻断转正（报错 2001），防止数据交叉与重复跟进&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;一条抖音线索对多个历史号码&lt;/td&gt;
&lt;td&gt;取&lt;strong&gt;最近一次有效留资&lt;/strong&gt;的号，不取最早的&lt;/td&gt;
&lt;td&gt;客户 6 月、9 月、10 月各留过一次 → 用 10 月的；6 月那个号可能已经被运营商回收给别人了。旧号不删，进审计表备查&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;转正不另开一套流程，走下面&quot;路 B&quot;的验证与转正，与坐席录入共用同一套状态机。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;h4&gt;路 B：坐席录入 → 验证 → 转正（不依赖任何外部答复，P0 可先做）&lt;/h4&gt;
&lt;p&gt;现网《任务跟进》已经允许坐席改号，改完直接盖在号码字段上——不校验、不留痕。掩码上线后这个动作就是&quot;坐席录入真号&quot;的唯一入口，要做的是&lt;strong&gt;改它的行为&lt;/strong&gt;：改号仍可当场拨（那是本次呼叫的会话参数），但&lt;strong&gt;不再直接写主字段，改写候选&lt;/strong&gt;。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;号码相关字段（摘要；完整 11 列含类型与索引，见辅材 2.5 ①）&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;列名&lt;/th&gt;
&lt;th&gt;含义&lt;/th&gt;
&lt;th&gt;写入来源/事务&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;已验证明文。&lt;strong&gt;只有验证通过才有值&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;转正事务&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;mask_phone&lt;/code&gt; / &lt;code&gt;encrypt_id&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;掩码号 / 加密标识&lt;/td&gt;
&lt;td&gt;接口入参 / 加密节点&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;candidate_phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;候选明文（未验证）&lt;/td&gt;
&lt;td&gt;坐席录入 / 密文比对匹配&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_source&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;1 报文明文 / 2 正式链路 / 3 密文比对匹配 / 4 坐席采集&lt;/td&gt;
&lt;td&gt;写入时打标&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_status&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;0 待验证 / 1 已验证 / 2 已失效&lt;/td&gt;
&lt;td&gt;状态机&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_verified_by&lt;/code&gt; / &lt;code&gt;_at&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;验证方式（1 短信核身·总部录入 / 2 店端核身回传·跟随转正；正式链路回传记来源 2，不算验证方式）与时间&lt;/td&gt;
&lt;td&gt;验证动作&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;索引就三条：&lt;code&gt;idx_encrypt_id&lt;/code&gt;、&lt;code&gt;idx_phone&lt;/code&gt;、&lt;code&gt;idx_phone_status&lt;/code&gt;。要点只有一条——&lt;strong&gt;候选明文不建索引，占用检查用密文查、不拿明文当查询条件&lt;/strong&gt;（完整定义见辅材 2.5 ①）。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;状态机：只有&quot;已验证&quot;才写主字段&lt;/strong&gt;&lt;/p&gt;
&lt;blockquote&gt;
&lt;p&gt;用张先生一条线索串完整张表：抖音来的，只有星号 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt;，正式手机号栏空着。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;当前&lt;/th&gt;
&lt;th&gt;事件&lt;/th&gt;
&lt;th&gt;变成&lt;/th&gt;
&lt;th&gt;主字段&lt;/th&gt;
&lt;th&gt;举个张先生的例子&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;掩码线索（无候选）&lt;/td&gt;
&lt;td&gt;坐席录入号码&lt;/td&gt;
&lt;td&gt;待验证（来源 4）&lt;/td&gt;
&lt;td&gt;仍为空&lt;/td&gt;
&lt;td&gt;坐席打通电话，张先生说&quot;我号码是 138 尾 3090&quot; → 尾号与掩码对上，录进候选格，正式栏仍空，先能当场拨这一次&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;待验证&lt;/td&gt;
&lt;td&gt;正式链路回传明文，与候选&lt;strong&gt;不一致&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;以正式为准（来源 2）&lt;/td&gt;
&lt;td&gt;写入正式号，旧候选进历史表&lt;/td&gt;
&lt;td&gt;候选格躺着撞出来的 138 尾 3090，张先生本人到店登记 139 尾 1234 → 以 1234 写进正式栏（来源 2），3090 候选进历史表备查，并告警：撞重可能认错或客户换号，要回查历史触达&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;待验证&lt;/td&gt;
&lt;td&gt;短信核身通过（坐席录入的号都走这一条）&lt;/td&gt;
&lt;td&gt;已验证&lt;/td&gt;
&lt;td&gt;写入&lt;/td&gt;
&lt;td&gt;坐席点击发码并在通话中引导：“张先生请看下手机短信，把收到的 6 位服务验证码念给我核对一下”，张先生念出后坐席在系统弹窗录入提交（5分钟有效，错3次作废） → 验证通过当场转正，3090 进正式栏&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;掩码线索（无候选）或待验证&lt;/td&gt;
&lt;td&gt;店端回传号码（&lt;strong&gt;店端已完成核身&lt;/strong&gt;）&lt;/td&gt;
&lt;td&gt;已验证（跟随写转正）&lt;/td&gt;
&lt;td&gt;写入&lt;/td&gt;
&lt;td&gt;张先生到店，销售顾问登记 138 尾 3090 并当面核身 → 门店回传接入平台 → 平台跟随写转正，3090 进正式栏，总部侧不再发验证码&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;待验证&lt;/td&gt;
&lt;td&gt;坐席改录另一个号&lt;/td&gt;
&lt;td&gt;替换，旧的进候选变更历史表（&lt;code&gt;lead_phone_history&lt;/code&gt;，结构见辅材 2.5 ①）&lt;/td&gt;
&lt;td&gt;仍为空&lt;/td&gt;
&lt;td&gt;坐席把 138 尾 3090 手滑录成 139 尾 3090（尾号一致才录得进来），客户纠正后改录 → 旧号进历史表留档，正式栏仍空，等新号被验证&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;待验证&lt;/td&gt;
&lt;td&gt;30 天未验证且线索已关闭&lt;/td&gt;
&lt;td&gt;已失效&lt;/td&gt;
&lt;td&gt;仍为空&lt;/td&gt;
&lt;td&gt;线索关单 30 天，3090 一直没人核实 → 标失效，不再占用号码、不再进待验证队列&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;已验证&lt;/td&gt;
&lt;td&gt;DMS 交车比对命中&lt;/td&gt;
&lt;td&gt;以 DMS 本地密文比对为准&lt;/td&gt;
&lt;td&gt;覆盖&lt;/td&gt;
&lt;td&gt;张先生已验证为 138 尾 3090，交车时 DMS 登记号码密文一致则确认；若为客户主动换号交车，以最新有效交车登记更新，记录差异日志并审计留痕&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;已验证的来路：① &lt;strong&gt;密文比对匹配&lt;/strong&gt;（来源 3，密文同源比对命中直接转正写入主字段，业务定调效率优先）；② &lt;strong&gt;短信核身&lt;/strong&gt;（来源 4，坐席电话口述录入经 6 位验证码核身转正）；③ &lt;strong&gt;店端核身回传&lt;/strong&gt;（来源 2，店端完成当面核身回传接入平台跟随转正）。转明后彻底对抖音停传，交车转明完全靠自己 DMS 密文比对，全程不依赖官方回传明文。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;&lt;strong&gt;录入四道校验（顺序执行，任一不过就拦）&lt;/strong&gt;：① 11 位正则（掩码形态含星号，天然过不了这道）→ ② &lt;strong&gt;后四位与掩码尾号一致&lt;/strong&gt;——掩码保留尾号，客户报的号尾数对不上，必然不是这条线索的号，直接拦（掩码 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;&lt;strong&gt;3090&lt;/code&gt;，客户报尾号 8888 的号 → 录入即拦，大概率报错号或不是同一人）→ ③ 号码占用检查（&lt;/strong&gt;用密文查&lt;strong&gt;，命中其他线索&lt;/strong&gt;直接拦下、不让通过**——真是同一客户的，密文比对匹配会自动把号关联过来，不需要坐席手工归并）→ ④ 坐席对该线索有跟进权限。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;转正同步四条规则（2026-10-28 业务确认口径）&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;规则&lt;/th&gt;
&lt;th&gt;怎么做&lt;/th&gt;
&lt;th&gt;举个例子&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;后四位校验（已前移为录入第一道）&lt;/td&gt;
&lt;td&gt;客户报的号&lt;strong&gt;尾号必须与掩码尾号一致&lt;/strong&gt;——落在录入四道校验②，录入时对不上直接拦，进不了候选、也走不到发码&lt;/td&gt;
&lt;td&gt;掩码是 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt;，客户报 138 尾 3090 → 对上，录进候选；报尾号 8888 的号 → 录入时直接拦下，大概率报错号或不是同一人&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;店端明文回传&lt;/td&gt;
&lt;td&gt;店端跟进拿到真实手机号并&lt;strong&gt;已完成核身&lt;/strong&gt;，回传&lt;strong&gt;线索接入平台&lt;/strong&gt;后&lt;strong&gt;跟随更新写转正&lt;/strong&gt;（不再重复发短信），全链路数据一处更新&lt;/td&gt;
&lt;td&gt;客户到店，销售顾问登记 138 尾 3090 并当面核身 → 门店回传接入平台 → 平台跟随写转正，3090 进正式栏，总部侧不用再发验证码&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;转正后同步联友&lt;/td&gt;
&lt;td&gt;转正后的明文手机号 + 用明文重算出的加密标识，同步至&lt;strong&gt;联友侧各业务系统&lt;/strong&gt;，完成关联线索的信息更新&lt;/td&gt;
&lt;td&gt;转正成 138 尾 3090 后，系统用该明文算出加密标识，连同明文推给联友 COC / NEV 各系统 → 该客户名下关联线索批量更新&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;占用拒绝转正&lt;/td&gt;
&lt;td&gt;用户提供的手机号已绑定其他&lt;strong&gt;有效线索&lt;/strong&gt;的，直接拒绝本次转正申请，不影响原线索正常流转&lt;/td&gt;
&lt;td&gt;客户对线索 A 报号，短信核身通过，但这个号已绑定另一条有效线索 B → A 的转正申请被拒，B 照常流转；A 保持掩码，等正式链路回传或换号再发起&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;号码占用分两层拦：&lt;strong&gt;录入时&lt;/strong&gt;的四道校验拦「录」（见上③）；&lt;strong&gt;转正时&lt;/strong&gt;这条规则拦「转」——只对已绑定其他有效线索的号码拒绝。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;hr&gt;
&lt;h3 id=&quot;sec-14&quot;&gt;3.4 掩码线索外呼怎么干（作业要点）&lt;/h3&gt;
&lt;blockquote&gt;
&lt;p&gt;前三节解决「号怎么收、怎么认、怎么取」，这一节解决&lt;strong&gt;活怎么干&lt;/strong&gt;：掩码线索进总部培育后，任务怎么生成、人怎么呼、呼不通怎么办、接通后怎么开口。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;&lt;strong&gt;① 任务生成：什么线索能进外呼任务&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;线索形态&lt;/th&gt;
&lt;th&gt;能否生成外呼任务&lt;/th&gt;
&lt;th&gt;说明&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;纯掩码线索（无候选明文）&lt;/td&gt;
&lt;td&gt;✅ 能，照常生成&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;外呼走抖音虚拟隐私号&lt;/strong&gt;：外呼时系统携带抖音 &lt;code&gt;lead_id&lt;/code&gt; 经智能 DCC 向抖音实时申请临时虚拟隐私号（中间号）由呼叫中心发起接续；坐席界面脱敏显示 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt; + 「掩码」标记，坐席无需知晓真实号码&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;掩码线索 + 口述待验证候选&lt;/td&gt;
&lt;td&gt;✅ 能，照常生成&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;外呼仍走抖音虚拟隐私号&lt;/strong&gt;：口述号码在未通过电话核身前仅作为「待验证候选记录」，&lt;strong&gt;严禁直拨&lt;/strong&gt;；外呼仍由系统申请抖音临时隐私号接续，接通后由坐席在通话中核身（核验6位验证码），核身通过当场转正，后续外呼才切为直拨真实号码；密文比对命中的线索直接进入已验证状态直拨&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;掩码线索 + 已验证明文&lt;/td&gt;
&lt;td&gt;✅ 能，直拨真号&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;直拨客户真实手机号&lt;/strong&gt;：与普通线索无异，直接调用现有呼叫中心线路拨打，不再依赖抖音接口&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;不存在「号码不可拨」的形态：未转明线索实时调抖音接口换取临时虚拟隐私号（由抖音负责话路接续），已验证明文的直接直拨——两类形态均有可用外呼路径，不存在拦下转「待补充触达」的分支。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;举个例子：张先生从抖音留资，进来只有 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt;；当天 10:00 照常生成外呼任务，坐席任务池里看到的是掩码号 + 「抖音」来源标签，正常分配。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;② 外呼模式：人工可用，预测外呼待定&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;模式&lt;/th&gt;
&lt;th&gt;掩码线索&lt;/th&gt;
&lt;th&gt;卡点&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;人工预览（PHONEBAR 点击拨号）&lt;/td&gt;
&lt;td&gt;✅ 主用&lt;/td&gt;
&lt;td&gt;LC-B7 改造：拨号经智能 DCC 取本次中间号&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;预测外呼（批量自动拨）&lt;/td&gt;
&lt;td&gt;⏳ 待定（N21）&lt;/td&gt;
&lt;td&gt;中间号每次外呼会变，批量取号的并发与失败重试需平台说明&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;AI 外呼（试驾排程等）&lt;/td&gt;
&lt;td&gt;⏳ 待定（N21）&lt;/td&gt;
&lt;td&gt;同上前提；且 AI 话术无法临场引导客户留真号，收益偏低&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;先记一条总口径：&lt;strong&gt;中间号只服务未转明的掩码线索&lt;/strong&gt;。验证通过、已转正拿到正式手机号的线索，直接走现有外呼能力直拨，不经智能 DCC 取号、不依赖抖音；只有还没拿到号的掩码线索，才在呼叫时经智能 DCC 向抖音申请客户隐私号，再用现有外呼能力拨打该隐私号——外呼通道本身始终是我们自己的，抖音侧只提供取号，不提供呼叫能力。&lt;/p&gt;
&lt;p&gt;判断口径：&lt;strong&gt;预测外呼的事和天润切换评估一起定&lt;/strong&gt;——两件都落在「批量外呼任务池」这一层，分开定必返工。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;③ 呼不通怎么办：重拨与兜底&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;结果&lt;/th&gt;
&lt;th&gt;动作&lt;/th&gt;
&lt;th&gt;举个张先生的例子&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;未接&lt;/td&gt;
&lt;td&gt;按原重拨规则：间隔 2 小时、上限 3 次&lt;/td&gt;
&lt;td&gt;10:00 未接 → 12:00、15:00 各再呼一次&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;三次未接&lt;/td&gt;
&lt;td&gt;原「自动转短信辅助建联」&lt;strong&gt;失效&lt;/strong&gt;（短信发不到掩码号）→ 改转「待短信池」，拿到明文后补发&lt;/td&gt;
&lt;td&gt;三次未接 → 进待短信池挂「待补充触达」，不静默丢弃&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;接通即挂&lt;/td&gt;
&lt;td&gt;计入接通，正常跟进&lt;/td&gt;
&lt;td&gt;记「接通 8 秒」，仍算一次有效触达&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;空号 / 停机音&lt;/td&gt;
&lt;td&gt;掩码线索不查在网状态（N5），只能靠触达结果反推&lt;/td&gt;
&lt;td&gt;连续三次空号音 → 打「疑似空号」标签，人工复核&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;关键变化&lt;/strong&gt;：掩码号&lt;strong&gt;不能回拨&lt;/strong&gt;（客户回拨走平台线路，不回我们线路），二次触达只剩「我方再呼」一条路——&lt;strong&gt;首呼时效比以往更重要&lt;/strong&gt;，任务生成到首呼建议压到 4 小时内。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;④ 接通之后：三步&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;三步（话术见运营附件，不进本文档）：&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;strong&gt;确认身份&lt;/strong&gt;：不念掩码号、不透「抖音」来源细节，按姓名 + 意向车型核对&lt;/li&gt;&lt;li&gt;&lt;strong&gt;要真号 / 加微&lt;/strong&gt;：客户同意后坐席录入，当场可拨（作会话参数），验证通过才转正（3.3 路 B）&lt;/li&gt;&lt;li&gt;&lt;strong&gt;约到店&lt;/strong&gt;：到店登记核身后门店回传接入平台，跟随写转正、不再重复发码（3.3 状态机）&lt;/li&gt;
&lt;/ol&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-15&quot;&gt;4. 改造清单（研发实施与工时拆解）&lt;/h2&gt;
&lt;h3 id=&quot;sec-16&quot;&gt;4.1 车巴巴（CB1–CB12，18 人日）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;功能&lt;/th&gt;
&lt;th&gt;要改什么&lt;/th&gt;
&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;CB9&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;懂车云店/车云店号码强校验&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;最前&lt;/strong&gt;：按&quot;是否字节线索&quot;分流；掩码线索改校验「掩码号非空 + 后 4 位纯数字 + 加密标识非空 + 原线索 ID 非空」&lt;/td&gt;
&lt;td&gt;P0（第一批）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB1&lt;/td&gt;
&lt;td&gt;接口 A/B 号码字段&lt;/td&gt;
&lt;td&gt;新增三个字段，主字段由必填改条件必填（见 3.1）&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB2&lt;/td&gt;
&lt;td&gt;一对多拆单&lt;/td&gt;
&lt;td&gt;拆出的每条都带同一个加密标识&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB3&lt;/td&gt;
&lt;td&gt;转发下游（线索中心 / COC / 效果通）&lt;/td&gt;
&lt;td&gt;报文加掩码字段，确认下游能接空主字段&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB6&lt;/td&gt;
&lt;td&gt;专营店编码 → 城市&lt;/td&gt;
&lt;td&gt;升级为掩码线索&lt;strong&gt;归属城市主来源&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB12&lt;/td&gt;
&lt;td&gt;号码归属地字段&lt;/td&gt;
&lt;td&gt;失效，改作第二顺位；主用「意向城市/意向省份」&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB5&lt;/td&gt;
&lt;td&gt;状态回传媒体（汽车之家等）&lt;/td&gt;
&lt;td&gt;&lt;code&gt;customerPhone&lt;/code&gt; 改隐私号或线索 ID 映射&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB10&lt;/td&gt;
&lt;td&gt;异常数据监控&lt;/td&gt;
&lt;td&gt;每天会误报，异常原因拆「格式不合法」与「掩码线索待补全」&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB11&lt;/td&gt;
&lt;td&gt;启辰抖店卡券领取&lt;/td&gt;
&lt;td&gt;核销靠号码 → 改按加密标识或线索 ID&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB7 / CB8&lt;/td&gt;
&lt;td&gt;拦截过滤 / 媒体线索记录&lt;/td&gt;
&lt;td&gt;仅核对与检索导出适配&lt;/td&gt;
&lt;td&gt;核对 / P2&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-17&quot;&gt;4.2 线索中心接入层（LC-A1–A4，6 人日）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;功能&lt;/th&gt;
&lt;th&gt;要改什么&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;LC-A1&lt;/td&gt;
&lt;td&gt;&lt;code&gt;^1[3-9]\d{9}$&lt;/code&gt; 正则强校验&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;第二道拦截点&lt;/strong&gt;：有加密标识就放行&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;LC-A2&lt;/td&gt;
&lt;td&gt;手机号在网状态查询&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【已闭环定性】&lt;/strong&gt;抖音侧不提供在网和空号检测能力；掩码线索一律&lt;strong&gt;直接跳过在网查询并打标&lt;/strong&gt;，不进行前置拦截，通过后续外呼触达结果反推&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;LC-A3&lt;/td&gt;
&lt;td&gt;下发厂商系统&lt;/td&gt;
&lt;td&gt;报文加掩码字段；失败原因区分「号码不可用」与「厂商拒收」&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;LC-A4&lt;/td&gt;
&lt;td&gt;接收入库字段&lt;/td&gt;
&lt;td&gt;新增掩码字段；&lt;code&gt;备用电话&lt;/code&gt; 与 &lt;code&gt;联系电话&lt;/code&gt; 分别标注明文状态&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-18&quot;&gt;4.3 DCC 培育主线（LC-B 共 16 条，48 人日，分 5 组）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;组&lt;/th&gt;
&lt;th&gt;条目&lt;/th&gt;
&lt;th&gt;内容&lt;/th&gt;
&lt;th&gt;人日&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;收线索&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;LC-B1、B2、B3、B4&lt;/td&gt;
&lt;td&gt;接收三字段且手机号可空、空号检测跳过掩码、重复跟进判断换键、留资未满唯一 ID 换键&lt;/td&gt;
&lt;td&gt;10&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;派线索&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;LC-B5、B9&lt;/td&gt;
&lt;td&gt;归属地改「专营店城市 &amp;gt; 媒体推送省市 &amp;gt; IP &amp;gt; 省份兜底」；天网门店分派降为城市/省份单维度&lt;/td&gt;
&lt;td&gt;5&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;坐席外呼作业&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;LC-B6、B7、B8、B11&lt;/td&gt;
&lt;td&gt;搜索加标识/后四位、拨号改经智能 DCC 取号、坐席改号写入候选（3.3 路 B）、线路评分改走指定线路、推送预外呼与话单接收改走智能 DCC&lt;/td&gt;
&lt;td&gt;9&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;名单与回写&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;LC-B10、B12、B14、B15&lt;/td&gt;
&lt;td&gt;黑名单换键、回写中台号码口径、试驾工单换关联键、Excel 导入自动加密&lt;/td&gt;
&lt;td&gt;9&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;号码转明&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;3.3 路 A + 路 B&lt;/td&gt;
&lt;td&gt;密文比对匹配（实时 + 日终 + 两道闸门）与录入转正（状态机 + 四校验 + 转正事务）&lt;/td&gt;
&lt;td&gt;15&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;LC-B15 导入说明：加密由程序自动做，员工不填。明文行走原流程（无感）；掩码行模板增加三列&lt;strong&gt;可选&lt;/strong&gt;列（掩码号 / 加密标识 / 原线索 ID），加密标识与原线索 ID 缺一个就整行拒收并标出行号。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;h3 id=&quot;sec-19&quot;&gt;4.4 非线索模块（20 人日）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;板块&lt;/th&gt;
&lt;th&gt;条目&lt;/th&gt;
&lt;th&gt;关键改造&lt;/th&gt;
&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;报表&lt;/td&gt;
&lt;td&gt;RP1–RP4&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;硬伤&lt;/strong&gt;：《外呼任务明细》导出按手机号反查线索回填「NEV 线索中台编码」，掩码后整列空、与中台对不上账；另加无效号码口径、号码列脱敏&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;质检 / 录音&lt;/td&gt;
&lt;td&gt;QA1–QA3&lt;/td&gt;
&lt;td&gt;录音与线索靠手机号关联 → 改按任务 ID / 加密标识；看板号码维度改按任务、坐席、线索&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;试驾 / 排程&lt;/td&gt;
&lt;td&gt;TD1–TD3&lt;/td&gt;
&lt;td&gt;试驾回访工单按号码取 180 天记录 → 换键；评分与状态回传核关联键&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;配置器群&lt;/td&gt;
&lt;td&gt;CF1–CF5&lt;/td&gt;
&lt;td&gt;回访预外呼重推配置按号码查店端跟进中 → 换键；智能体填单审核同款查询&lt;/td&gt;
&lt;td&gt;P0（CF5）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;散页&lt;/td&gt;
&lt;td&gt;OT1、OT2、OT4&lt;/td&gt;
&lt;td&gt;智能体填单审核判重、私域留资未满同步唯一 ID 换键&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;依据不是抽样：480 页原型全量扫描，84 页命中「手机号」相关字样，按板块归类的台账见影响面方案附录二。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;h3 id=&quot;sec-20&quot;&gt;4.5 短信：六处全部要降级（11 人日）&lt;/h3&gt;
&lt;p&gt;前提：&lt;strong&gt;掩码号收不了短信，平台也不代发&lt;/strong&gt;（2026-10-17 已确认）。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;先说好消息&lt;/strong&gt;：短信&lt;strong&gt;不是&lt;/strong&gt;任务生成的前置条件。原型批次记录里 2026-06-15 去重后 10,000 条、短信成功 9,911 条，照样生成 10,000 个任务。所以抖音线索不会卡在&quot;短信成功&quot;这一步进不来。&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;落点&lt;/th&gt;
&lt;th&gt;掩码线索会怎样&lt;/th&gt;
&lt;th&gt;改法&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;1&lt;/td&gt;
&lt;td&gt;三无忧「短信预触达」&lt;/td&gt;
&lt;td&gt;整段跳过，外呼前没预热&lt;/td&gt;
&lt;td&gt;跳过直进任务池；报表「短信成功」显示&quot;不适用&quot;，成功率分母剔除&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2&lt;/td&gt;
&lt;td&gt;AI 外呼后 5 条短信规则&lt;/td&gt;
&lt;td&gt;5 条全部不触发&lt;/td&gt;
&lt;td&gt;执行前判来源，掩码线索跳过并记「未触达-无可用号码」&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;3&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;三次未接自动兜底&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;失去唯一自动兜底&lt;/strong&gt;，只能继续重拨或放弃&lt;/td&gt;
&lt;td&gt;改「转待短信池」，拿到明文后补发；不计入原口径&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;4&lt;/td&gt;
&lt;td&gt;坐席「未接通」下的「短信跟进」&lt;/td&gt;
&lt;td&gt;掩码线索无法接收短信，避免冗余点击&lt;/td&gt;
&lt;td&gt;掩码线索隐藏，只留「稍后回拨」；客户要求短信则落&quot;待补发&quot;待办&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;5&lt;/td&gt;
&lt;td&gt;任务卡「下发短信」按钮&lt;/td&gt;
&lt;td&gt;点了报错&lt;/td&gt;
&lt;td&gt;置灰，悬浮说明原因&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;6&lt;/td&gt;
&lt;td&gt;任务排班 4 类模板&lt;/td&gt;
&lt;td&gt;到店提醒发不出，试驾最易爽约&lt;/td&gt;
&lt;td&gt;标注不可用；到店提醒改电话或企微&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;连带一条&lt;/strong&gt;：3.3 路 B 的&quot;短信验证&quot;只对已录入的候选明文有效，对掩码号无效。这条必须写进坐席操作说明，否则坐席以为验证码发出去了。&lt;/p&gt;
&lt;h3 id=&quot;sec-21&quot;&gt;4.6 底座（27 人日）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;条目&lt;/th&gt;
&lt;th&gt;内容&lt;/th&gt;
&lt;th&gt;人日&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;加密节点 + 密钥管理&lt;/td&gt;
&lt;td&gt;自有机房部署 VOPRF 服务；私钥业务侧不可见、可轮换、挂了有降级（失败进临时池 + 巡检补全）。&lt;strong&gt;全系统只此一套&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;12&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;存量线索一次性加密&lt;/td&gt;
&lt;td&gt;历史线索批量补标识。不补则新老线索互不相认，等于白改&lt;/td&gt;
&lt;td&gt;5&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;权限、脱敏、审计&lt;/td&gt;
&lt;td&gt;谁能看真号、导出要审批、谁在何时看了哪个号要留痕&lt;/td&gt;
&lt;td&gt;4&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;测试、灰度、回滚&lt;/td&gt;
&lt;td&gt;测试数据不用真号；按入口灰度；开关关着退回旧行为&lt;/td&gt;
&lt;td&gt;6&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;依赖顺序（排期时按这个卡）&lt;/strong&gt;：加密节点（底座）→ 判重换键（收线索组）→ 报表反查回填；车巴巴 CB9 → 其余全部。真正能并行的是车巴巴、线索中心、非线索模块三块。&lt;/p&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-22&quot;&gt;5. 待确认事项清单（N制，全项目唯一）&lt;/h2&gt;
&lt;h3 id=&quot;sec-23&quot;&gt;5.1 阻断级&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;事项（含现状证据）&lt;/th&gt;
&lt;th&gt;不给会怎样&lt;/th&gt;
&lt;th&gt;期限&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N1&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;掩码线索的报文形态&lt;/strong&gt;：11 个入口推 / 拉过来的报文里号码怎么传——① 掩码号填进原「电话」字段；② 电话字段留空、另加掩码号与加密标识；③ 仍给明文。E2–E10 为对方推送，按 ①② 问；E1 / E11 为我方拉取，按接口文档问。现网证据：接口 A 的 &lt;code&gt;phone&lt;/code&gt;、接口 B 的 &lt;code&gt;contactTel&lt;/code&gt; 均必填，懂车云店与车云店另有 13~19 位强校验（5 处），需一并确认是否放开&lt;/td&gt;
&lt;td&gt;三种形态对应三种改法，定不了则车巴巴分流方案与工作量都估不出&lt;/td&gt;
&lt;td&gt;11/05&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N9&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;字节头条 MAPI 的号码从哪个字段取。现网证据：下发与更新两页原型示例都只有姓名 / 省 / 市 / 经销商 / 车型，均无电话字段；更新接口按 &lt;code&gt;clue_id&lt;/code&gt; 去重，说明线索 ID 现网已有，缺的只是号码这一环&lt;/td&gt;
&lt;td&gt;窗口① 无法改造&lt;/td&gt;
&lt;td&gt;11/05&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;N1 问的是&lt;strong&gt;上游报文数据形态示例&lt;/strong&gt;（三种形态决定三种改法）；我方「接不接得住」属内部改造，落在 4.1 CB9 校验分流，&lt;strong&gt;不占 N 编号&lt;/strong&gt;。N9 是 N1 在窗口 ① 的特例：那一路连电话字段都没有，先得确认号码藏在哪个 key。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;h3 id=&quot;sec-24&quot;&gt;5.2 重要级&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;事项（含现状证据）&lt;/th&gt;
&lt;th&gt;影响&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;N2&lt;/td&gt;
&lt;td&gt;掩码线索是否仍带省 / 市 / 经销商编码。现网证据：E2–E5 请求参数已知带「意向城市 / 意向省份 / 分发经销商ID」，待书面确认掩码线索上是否保留&lt;/td&gt;
&lt;td&gt;决定归属城市与一对多下发能否沿用&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N3&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【已闭环确认】&lt;/strong&gt;联友（下游接收方）已确认完成系统适配，增加加密标识字段并在中台用于线索去重&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;已解决&lt;/strong&gt;（联友排期承接落地）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N17&lt;/td&gt;
&lt;td&gt;豁免期（2027-01-14）结束后，此前以明文下发的存量线索怎么处理&lt;/td&gt;
&lt;td&gt;是否需二次改造&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N18&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【已闭环确认】&lt;/strong&gt;抖音侧已明确答复「不限期」机制：&lt;strong&gt;由我方调用方按需重复调用取号接口即可持续外呼，与线索状态无关，已成交/已关单均可继续外呼&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;已解决&lt;/strong&gt;（我方按每次外呼动态取号实现，无需复杂回收调度）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N5&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【已闭环确认】&lt;/strong&gt;抖音侧已明确答复：&lt;strong&gt;不提供在网和空号检测服务&lt;/strong&gt;；掩码线索入站时一律跳过在网查询与空号拦截，交由外呼触达结果反推&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;已解决&lt;/strong&gt;（开发定调为直接跳过检测并标记）&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-25&quot;&gt;5.3 一般级与待核&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;事项与现状卡点&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;N7&lt;/td&gt;
&lt;td&gt;状态回传媒体能否用隐私号替代 &lt;code&gt;customerPhone&lt;/code&gt;——该字段现为明文号码&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N8&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【联友侧改造承接】&lt;/strong&gt;下游主机厂中台（COC / NEV）由联友侧负责改造，支持接收掩码号与加密标识字段，放行 phone 空值场景，保障下发不被拒收&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N10&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【联友侧改造承接】&lt;/strong&gt;已商定 NEV 培育线索：坐席核身更正真实号码后，&lt;strong&gt;必须回传 NEV 中台&lt;/strong&gt;；联友中台同步改造接收接口，支持该场景的数据更新与采信&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N13&lt;/td&gt;
&lt;td&gt;启辰本地通车云店（车云店 MAPI）是否仍在运行——页内备注「下线接口服务」（2024-01-04）。若停用，该入口与对应改造量剔除（11 → 10）；若仍在跑，口径同其他 MAPI 拉取&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N19&lt;/td&gt;
&lt;td&gt;私信留资脱敏后的字段形态——脱敏后最终产品形态能否同步接口字段定义&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N21&lt;/td&gt;
&lt;td&gt;预测外呼 / AI 外呼对掩码线索是否适用——中间号每次外呼会变，批量自动拨号的取号、并发与失败重试机制需平台说明；与天润切换评估同批定，避免返工&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N22&lt;/td&gt;
&lt;td&gt;坐席呼掩码号时客户侧&lt;strong&gt;外显号码&lt;/strong&gt;是什么（坐席号 / 门店号 / 平台号），以及取号通道的&lt;strong&gt;并发上限&lt;/strong&gt;——影响接听率与容量规划。~~计费~~已确认（2026-10-28）：抖音明确接入 DCC 外呼系统不收取费用&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-26&quot;&gt;5.4 已闭环（不用再问）&lt;/h3&gt;
&lt;blockquote&gt;
&lt;p&gt;下列 6 条早期按 N4、N11、N12 等编号跟踪，闭环后编号不再引用——按号检索查不到的即在此表。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;事项&lt;/th&gt;
&lt;th&gt;答复&lt;/th&gt;
&lt;th&gt;落地&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;加密标识同源（2026-10-17）&lt;/td&gt;
&lt;td&gt;同一套算法、同一把盐，一个号一个标识&lt;/td&gt;
&lt;td&gt;路 A 从&quot;有条件&quot;转&quot;可执行&quot;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;短信能力（2026-10-17）&lt;/td&gt;
&lt;td&gt;不能接收、也不代发&lt;/td&gt;
&lt;td&gt;六处降级，短信不再阻塞任务生成&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;真实被叫号（2026-10-20）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;不回传&lt;/strong&gt;；话单回传的是顾问号码&lt;/td&gt;
&lt;td&gt;&quot;话单反查真号&quot;这条路关闭&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;掩码号稳定性（2026-10-20）&lt;/td&gt;
&lt;td&gt;掩码号固定；&lt;strong&gt;中间号每次外呼会变&lt;/strong&gt;；回拨走平台线路&lt;/td&gt;
&lt;td&gt;判重键只能落加密标识&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;基木鱼页&lt;/td&gt;
&lt;td&gt;实为《效果广告星链数据查询》出站回传页&lt;/td&gt;
&lt;td&gt;撤销该入口，定稿 11 条&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-27&quot;&gt;5.5 已定性（不再等对方答复，转我方自主决策）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;事项&lt;/th&gt;
&lt;th&gt;定性（2026-10-21）&lt;/th&gt;
&lt;th&gt;我们怎么落地&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N14&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;密文比对匹配的用途边界&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;已定性结案（2026-10-28 业务裁决）&lt;/strong&gt;：效率优先，系统比对命中即直接转正写入主字段（来源 3、phone_status=1）供坐席直拨，全流程严格审计留痕，不再设置多余的外呼策略开关&lt;/td&gt;
&lt;td&gt;落地开发交付，直接写主字段并记录来源 3&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N15&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;到店成交换明文与转明回传&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;已定性结案（2026-10-28 业务裁决）&lt;/strong&gt;：转明即彻底停传抖音，成交与跟进均不再回传抖音，亦不通过抖音获取明文，闭环自给自足&lt;/td&gt;
&lt;td&gt;结案关单，不再等待字节答复，交车转明走本地 DMS 密文比对&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-28&quot;&gt;6. 风险评估与兜底预案&lt;/h2&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;风险&lt;/th&gt;
&lt;th&gt;应对&lt;/th&gt;
&lt;th&gt;等级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;R1&lt;/td&gt;
&lt;td&gt;密文比对匹配属&lt;strong&gt;我方自主行为&lt;/strong&gt;——平台不予书面回应、不承担合规责任&lt;/td&gt;
&lt;td&gt;责任全在我方且无平台背书。应对：① 业务裁决效率优先，系统比对命中直接转正供坐席直拨；② 全程严格审计留痕；③ 法务核协议条款有无禁止性约定&lt;/td&gt;
&lt;td&gt;高&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;R2&lt;/td&gt;
&lt;td&gt;第三方外呼供应商&quot;隐私号套隐私号&quot;&lt;/td&gt;
&lt;td&gt;影响抖音线索呼叫稳定性，与天润切换评估合并判断&lt;/td&gt;
&lt;td&gt;高&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;R3&lt;/td&gt;
&lt;td&gt;存量线索未完成加密&lt;/td&gt;
&lt;td&gt;新老线索互不相认，重复建单。列为阶段 2 硬性交付&lt;/td&gt;
&lt;td&gt;高&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;R3a&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;密钥单侧轮换&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;不报错、不告警，只表现为密文匹配率归零，极难倒查。轮换写成双向流程 + 切前 100 条样本比对 + 命中率告警&lt;/td&gt;
&lt;td&gt;中&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;R4&lt;/td&gt;
&lt;td&gt;短信不可用&lt;/td&gt;
&lt;td&gt;失去外呼失败后的短信兜底，接通率与二次触达率下降；报表必须按来源拆分&lt;/td&gt;
&lt;td&gt;中&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;R6&lt;/td&gt;
&lt;td&gt;掩码号稳定性误解&lt;/td&gt;
&lt;td&gt;判重键只认加密标识，禁止以掩码号判重&lt;/td&gt;
&lt;td&gt;中&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;R7&lt;/td&gt;
&lt;td&gt;时间风险&lt;/td&gt;
&lt;td&gt;11 月初须启动、10 月下旬须立项；准备过渡预案&lt;/td&gt;
&lt;td&gt;高&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;过渡兜底（三档才启用）&lt;/strong&gt;：「智能 DCC + 隐私号」路径——号码 90 天有效、不支持跨渠道去重；需额外做「号码有效期类型 / 剩余天数」字段、到期预警、剩余不足拦截外呼、转其他触达。代价是明年再切一次。&lt;/p&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-29&quot;&gt;附录 A：术语对照&lt;/h2&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;说法&lt;/th&gt;
&lt;th&gt;同义&lt;/th&gt;
&lt;th&gt;备注&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;掩码号 / mask_phone / maskPhone / 隐私号&lt;/td&gt;
&lt;td&gt;平台下发的星号号&lt;/td&gt;
&lt;td&gt;固定不变&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;加密标识 / encrypt_id / encryptId / 密文 / 乱码&lt;/td&gt;
&lt;td&gt;VOPRF 密文&lt;/td&gt;
&lt;td&gt;一个号一个值，永不变&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;中间号 / 外呼临时号&lt;/td&gt;
&lt;td&gt;每次外呼临时分配&lt;/td&gt;
&lt;td&gt;会变，只作拨号通道&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;撞重&lt;/td&gt;
&lt;td&gt;跨渠道认人&lt;/td&gt;
&lt;td&gt;认出来=撞上，认不出=撞不上&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;幂等&lt;/td&gt;
&lt;td&gt;同一条报文重复推送只建一条线索&lt;/td&gt;
&lt;td&gt;靠原线索 ID 保证&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;透传&lt;/td&gt;
&lt;td&gt;上游字段原样带到下游，不改不丢&lt;/td&gt;
&lt;td&gt;加密标识断在中台将导致去重机制完全失效&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;明文&lt;/td&gt;
&lt;td&gt;真实 11 位手机号&lt;/td&gt;
&lt;td&gt;只有&quot;已验证&quot;才进主字段&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-30&quot;&gt;附录 B：辅材与历史底稿&lt;/h2&gt;
&lt;p&gt;本文档是唯一现行口径。辅材情况如下：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;材料&lt;/th&gt;
&lt;th&gt;现状&lt;/th&gt;
&lt;th&gt;里面有什么&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;接口与影响面明细&lt;/td&gt;
&lt;td&gt;✅ &lt;strong&gt;保留为同目录辅材&lt;/strong&gt;：&lt;code&gt;抖音掩码改造_接口与影响面明细.md&lt;/code&gt;（v2.7）&lt;/td&gt;
&lt;td&gt;每个接口改什么字段、字段总表全 11 列、错误码全集&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;辅材使用规则&lt;/strong&gt;：只用来查&quot;某个接口具体改哪几个字段&quot;&quot;这段结论的原型出处&quot;，不作宣讲、不作评审判断；两份材料说法不一致时，&lt;strong&gt;一律以本文档为准&lt;/strong&gt;。&lt;/p&gt;
&lt;blockquote&gt;
&lt;p&gt;阅读版：两份 md 均已并入《抖音掩码改造_文档合集.html》（带 TAB 切换），改稿只改 md 再重新生成回填合集，不再单独维护同名 html。&lt;/p&gt;
&lt;/blockquote&gt;

      &lt;h1&gt;抖音掩码改造 · 接口与影响面明细&lt;/h1&gt;
      
    &lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;
&lt;div class=&quot;alert alert-note&quot; style=&quot;border-left:4px solid #155eef;background:#eff4ff;color:#123a86;padding:12px 16px;border-radius:8px;margin:16px 0;font-size:13.5px;line-height:1.7;&quot;&gt;&lt;strong style=&quot;display:block;margin-bottom:4px;font-size:13px;letter-spacing:0.02em;&quot;&gt;📌 系统说明与背景&lt;/strong&gt;&lt;strong&gt;【系统范围与责任边界声明】&lt;/strong&gt;：本项目交付范围仅包含总部线索接入平台与 NEV 总部培育系统。门店销售助手由联友独立承建，油车直发店端由联友负责，非本系统范围；我方系统下发合规报文即履约完成。&lt;/div&gt;

&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-1&quot;&gt;一、两类线索，两条链路&lt;/h2&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;对比项&lt;/th&gt;
&lt;th&gt;留资线索&lt;/th&gt;
&lt;th&gt;培育线索&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;是什么&lt;/td&gt;
&lt;td&gt;媒体渠道产生的原始留资&lt;/td&gt;
&lt;td&gt;NEV 中台把留资线索&lt;strong&gt;去重&lt;/strong&gt;后，挑出需要 DCC 总部培育的那部分，转成的线索&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;从哪来&lt;/td&gt;
&lt;td&gt;车巴巴承接媒体接口后下发&lt;/td&gt;
&lt;td&gt;NEV 中台转化后推送&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;经过谁&lt;/td&gt;
&lt;td&gt;车巴巴 → 线索中心（接入层）→ 主机厂 COC / NEV&lt;/td&gt;
&lt;td&gt;NEV 中台 → DCC 培育&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;去向&lt;/td&gt;
&lt;td&gt;主机厂线索池并去重（不在我方）&lt;/td&gt;
&lt;td&gt;AI 外呼 / 人工客服 → 下发中台或总部客服&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;我方角色&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;中转与校验&lt;/strong&gt;（在网检测、字段校验、下发队列）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;执行方&lt;/strong&gt;（判重、外呼、跟进、质检、回写）&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;留资线索&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;seq-wrap&quot;&gt;&lt;div class=&quot;seq&quot; style=&quot;min-width:750px&quot;&gt;
&lt;div class=&quot;seq-head&quot;&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:10.0000%&quot;&gt;各媒体渠道&lt;/div&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:30.0000%&quot;&gt;字节系入口&lt;/div&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:50.0000%&quot;&gt;车巴巴&lt;/div&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:70.0000%&quot;&gt;线索中心·接入管理&lt;/div&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:90.0000%&quot;&gt;厂商系统（COC/NEV）&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-body&quot;&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:10.0000%&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:30.0000%&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:50.0000%&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:70.0000%&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:90.0000%&quot;&gt;&lt;/i&gt;
&lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;seq-link L2R&quot; style=&quot;left:10.0000%;width:40.0000%&quot;&gt;&lt;span class=&quot;seq-tag&quot;&gt;&lt;b&gt;1&lt;/b&gt;线索报文（手机号必填，明文）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;seq-link L2R&quot; style=&quot;left:30.0000%;width:20.0000%&quot;&gt;&lt;span class=&quot;seq-tag&quot;&gt;&lt;b&gt;2&lt;/b&gt;线索报文（掩码号 + 加密标识 + 原线索ID）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row auto&quot;&gt;&lt;div class=&quot;seq-note&quot; style=&quot;margin-left:max(40.0000%,130px)&quot;&gt;字节系入口 7 条：头条MAPI / 懂车云店4个抖音号 / 东风南方抖音号 / 启辰抖店&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row auto&quot;&gt;&lt;div class=&quot;seq-self&quot; style=&quot;margin-left:max(50.0000%,130px)&quot;&gt;&lt;b&gt;3&lt;/b&gt;号码强校验 → 查重(extsystem_clue_id) → SC映射 → 跨城分派 → 一对多拆分&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;seq-link L2R&quot; style=&quot;left:50.0000%;width:20.0000%&quot;&gt;&lt;span class=&quot;seq-tag&quot;&gt;&lt;b&gt;4&lt;/b&gt;车巴巴线索接收接口 A/B&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row auto&quot;&gt;&lt;div class=&quot;seq-self&quot; style=&quot;margin-left:max(70.0000%,130px)&quot;&gt;&lt;b&gt;5&lt;/b&gt;联系电话强校验 → 在网状态查询（空号缓存48h）&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row auto&quot;&gt;&lt;div class=&quot;seq-self&quot; style=&quot;margin-left:max(70.0000%,130px)&quot;&gt;&lt;b&gt;6&lt;/b&gt;待下发队列&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;seq-link L2R&quot; style=&quot;left:70.0000%;width:20.0000%&quot;&gt;&lt;span class=&quot;seq-tag&quot;&gt;&lt;b&gt;7&lt;/b&gt;厂商系统接收接口&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row auto&quot;&gt;&lt;div class=&quot;seq-self&quot; style=&quot;margin-left:max(90.0000%,130px)&quot;&gt;&lt;b&gt;8&lt;/b&gt;主机厂线索池并去重&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;培育线索&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;seq-wrap&quot;&gt;&lt;div class=&quot;seq&quot; style=&quot;min-width:620px&quot;&gt;
&lt;div class=&quot;seq-head&quot;&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:12.5000%&quot;&gt;NEV 中台&lt;/div&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:37.5000%&quot;&gt;DCC 培育&lt;/div&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:62.5000%&quot;&gt;AI 外呼 / 人工客服&lt;/div&gt;&lt;div class=&quot;seq-p&quot; style=&quot;left:87.5000%&quot;&gt;坐席·任务跟进&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-body&quot;&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:12.5000%&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:37.5000%&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:62.5000%&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seq-life&quot; style=&quot;left:87.5000%&quot;&gt;&lt;/i&gt;
&lt;div class=&quot;seq-row auto&quot;&gt;&lt;div class=&quot;seq-self&quot; style=&quot;margin-left:max(12.5000%,130px)&quot;&gt;&lt;b&gt;1&lt;/b&gt;留资线索去重 → 判定是否需 DCC 培育 → 转培育线索&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;seq-link L2R&quot; style=&quot;left:12.5000%;width:25.0000%&quot;&gt;&lt;span class=&quot;seq-tag&quot;&gt;&lt;b&gt;2&lt;/b&gt;推送培育线索&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row auto&quot;&gt;&lt;div class=&quot;seq-note&quot; style=&quot;margin-left:max(37.5000%,130px)&quot;&gt;入口「NEV 总部培育线索接收」部署在本系统内&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row auto&quot;&gt;&lt;div class=&quot;seq-self&quot; style=&quot;margin-left:max(37.5000%,130px)&quot;&gt;&lt;b&gt;3&lt;/b&gt;解析 smartCode → 空号检测（缓存15天）→ 入库&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;seq-link L2R&quot; style=&quot;left:37.5000%;width:25.0000%&quot;&gt;&lt;span class=&quot;seq-tag&quot;&gt;&lt;b&gt;4&lt;/b&gt;AI 外呼 / 批量下发人工客服&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;seq-link L2R&quot; style=&quot;left:62.5000%;width:25.0000%&quot;&gt;&lt;span class=&quot;seq-tag&quot;&gt;&lt;b&gt;5&lt;/b&gt;任务跟进&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seq-row&quot;&gt;&lt;div class=&quot;seq-link R2L&quot; style=&quot;left:12.5000%;width:75.0000%&quot;&gt;&lt;span class=&quot;seq-tag&quot;&gt;&lt;b&gt;6&lt;/b&gt;结果回写 NEV 线索中台&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-2&quot;&gt;二、留资线索链路：改造范围&lt;/h2&gt;
&lt;p&gt;留资链路分三段：车巴巴收（2.1）→ 线索中心校验并下发（2.2）→ 厂商系统入库（2.3）。三段都要动，其中前两段是号码闸门所在。&lt;/p&gt;
&lt;h3 id=&quot;sec-3&quot;&gt;2.0 先看这张表：同一个东西，在各处叫什么&lt;/h3&gt;
&lt;p&gt;各系统历史上各叫各的，先看这张对照表，后面遇到新名字不用再猜。概念本身（掩码号、加密标识、中间号是什么、会不会变）见&lt;strong&gt;交底总方案第 1 章&lt;/strong&gt;，这里只管「字段名叫什么」。&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;说的是什么&lt;/th&gt;
&lt;th&gt;各处实际叫什么&lt;/th&gt;
&lt;th&gt;本文统一叫&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;客户的明文手机号&lt;/td&gt;
&lt;td&gt;接口 A &lt;code&gt;phone&lt;/code&gt;、接口 B &lt;code&gt;contactTel&lt;/code&gt;、东风南方 / 启辰抖店 &lt;code&gt;telephone&lt;/code&gt;、懂车云店原型写「电话」、汽车之家状态回传 &lt;code&gt;customerPhone&lt;/code&gt;、主库列名也是 &lt;code&gt;phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;主字段&lt;/strong&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;抖音给的线索 ID&lt;/td&gt;
&lt;td&gt;接口 A &lt;code&gt;extsystem_clue_id&lt;/code&gt;、接口 B &lt;code&gt;outSystemCluekey&lt;/code&gt;、抖音入口 &lt;code&gt;id&lt;/code&gt; 或「线索ID」、回写接口「线索外部系统线索id」、报表「NEV线索中台编码」&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;原线索 ID&lt;/strong&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;这条线索是明文还是掩码&lt;/td&gt;
&lt;td&gt;&lt;code&gt;phone_type&lt;/code&gt;（A）/ &lt;code&gt;phoneType&lt;/code&gt;（B）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;号码形态&lt;/strong&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;平台下发的 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;&lt;code&gt;mask_phone&lt;/code&gt;（A）/ &lt;code&gt;maskPhone&lt;/code&gt;（B）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;掩码号&lt;/strong&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;不可逆加密哈希标识&lt;/td&gt;
&lt;td&gt;&lt;code&gt;encrypt_id&lt;/code&gt;（A）/ &lt;code&gt;encryptId&lt;/code&gt;（B）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;加密标识&lt;/strong&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;坐席或密文比对拿到、但还没验证的明文&lt;/td&gt;
&lt;td&gt;&lt;code&gt;candidate_phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;候选明文&lt;/strong&gt;&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;全文就这六个中文名：主字段、原线索 ID、号码形态、掩码号、加密标识、候选明文。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;三层名字别混&lt;/strong&gt;：接口层是报文字段名（车巴巴 A 接口用下划线、B 接口用驼峰，两边本来就不一致）；存储层是主库列名，统一下划线（如 &lt;code&gt;candidate_phone&lt;/code&gt;）；展示层是页面与报表上的中文标签。讲接口入参一律说「手机号」，讲落库与转正一律说「主字段」。&lt;/p&gt;

&lt;/blockquote&gt;
&lt;h4&gt;2.1.2 改造条目&lt;/h4&gt;

&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;CB1&lt;/td&gt;
&lt;td&gt;各媒体渠道的线索接收接口&lt;/td&gt;
&lt;td&gt;接口 A 的 &lt;code&gt;phone&lt;/code&gt;、接口 B 的 &lt;code&gt;contactTel&lt;/code&gt; 均为&lt;strong&gt;必填&lt;/strong&gt;参数&lt;/td&gt;
&lt;td&gt;《车巴巴线索标准接口A【逻辑流程图】》《车巴巴线索标准接口B【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;见&lt;strong&gt;交底总方案 3.1&lt;/strong&gt;：新增号码形态 / 掩码号 / 加密标识三个字段，主字段由「必填」改为「条件必填」&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB2&lt;/td&gt;
&lt;td&gt;字节系线索入口（E1–E11）&lt;/td&gt;
&lt;td&gt;一对多下发：一条线索若带多个经销商编码，会拆成多条分别下发——原型示例：1 条广州线索同时拆给广州风日 / 绿日 / 南菱 3 家店&lt;/td&gt;
&lt;td&gt;《字节头条线索下发接口【逻辑流程图】》（1发3）；《媒体线索-记录【逻辑流程图】》（1发2，2023-03-23）&lt;/td&gt;
&lt;td&gt;拆出来的每一条都必须带上&lt;strong&gt;同一个加密标识&lt;/strong&gt;；否则 3 家店会把同一客户当 3 个新客户，各自跟进、重复统计&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB3&lt;/td&gt;
&lt;td&gt;转发下游（线索中心 / COC / 效果通）&lt;/td&gt;
&lt;td&gt;按车型、smartcode、经销商编码组装参数&lt;/td&gt;
&lt;td&gt;《车巴巴线索标准接口A【逻辑流程图】》《车巴巴线索标准接口B【逻辑流程图】》《车巴巴线索接收接口【业务流程图】》&lt;/td&gt;
&lt;td&gt;下游参数新增掩码与加密标识字段；&lt;strong&gt;联友侧同步改造中台接收接口&lt;/strong&gt;，放行主字段为空并支持下发&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB5&lt;/td&gt;

&lt;td&gt;请求参数 &lt;code&gt;customerPhone = 手机号码&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;《汽车之家线索状态同步【逻辑流程图】》&lt;/td&gt;

&lt;td&gt;「【强校验】电话是否为空，且是否符合号段 13~19 开头的 11 位数字为正常」——E2–E5 四入口与 E8 车云店店端完全一致（同款强校验共 5 处）；E9 / E10 校验「手机号码是否合法」；E11 拉取型无入站强校验&lt;/td&gt;
&lt;td&gt;《广告投放抖音号-懂车云店api线索接收接口》等四页&lt;/td&gt;
