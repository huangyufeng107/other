&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB11&lt;/td&gt;
&lt;td&gt;启辰抖店卡券领取&lt;/td&gt;
&lt;td&gt;卡券接口「手机号码」= &lt;code&gt;telephone&lt;/code&gt;，&lt;code&gt;source&lt;/code&gt; 固定 4、&lt;code&gt;sms_release&lt;/code&gt; 固定 1&lt;/td&gt;
&lt;td&gt;《启辰抖店官方店线索接收接口【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;掩码线索无法领券（核销靠号码）→ 改按加密标识或原线索ID&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CB12&lt;/td&gt;
&lt;td&gt;号码归属地字段&lt;/td&gt;
&lt;td&gt;E2–E5 请求参数含「&lt;strong&gt;号码归属地&lt;/strong&gt;」「意向城市」「意向省份」三项&lt;/td&gt;
&lt;td&gt;《广告投放抖音号-懂车云店api线索接收接口》《日产懂车云店数据分流【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;「号码归属地」失效，「意向城市/意向省份」仍有效 → 作归属城市第二顺位（见 LC-B5）&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h4&gt;2.1.3 CB1 落地细则：错误码、例外报文、存储与灰度&lt;/h4&gt;
&lt;blockquote&gt;
&lt;p&gt;三个字段怎么传、分场景怎么必填、老调用方为何零改造，&lt;strong&gt;交底总方案 3.1&lt;/strong&gt; 已完整定义，本节不重复。这里只补三件主文档没写、开发实现要用的东西：错误码全集、声明掩码却带明文的报文怎么处置、存储索引与灰度验收。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;&lt;strong&gt;① 错误码全集（主文档 3.1 只列前三个，此处补全）&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;错误码&lt;/th&gt;
&lt;th&gt;触发条件&lt;/th&gt;
&lt;th&gt;返回提示&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;1001&lt;/td&gt;
&lt;td&gt;手机号为空，且号码形态≠2&lt;/td&gt;
&lt;td&gt;手机号必填；掩码线索请改传号码形态=2，并同时携带掩码号 + 加密标识 + 原线索 ID&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;1002&lt;/td&gt;
&lt;td&gt;号码形态=2，但掩码号不符合平台下发形态（正则按真实样本锁定，示例 &lt;code&gt;^\*+\d{4}$&lt;/code&gt;）&lt;/td&gt;
&lt;td&gt;掩码号格式不正确&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;1003&lt;/td&gt;
&lt;td&gt;号码形态=2，但缺加密标识&lt;/td&gt;
&lt;td&gt;加密标识不能为空&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;1004&lt;/td&gt;
&lt;td&gt;号码形态=2，但缺原线索 ID&lt;/td&gt;
&lt;td&gt;原线索 ID 不能为空&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;1005&lt;/td&gt;
&lt;td&gt;同一加密标识 + 同一专营店重复推送&lt;/td&gt;
&lt;td&gt;返回成功 + 已有线索 ID（幂等，不报错）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;1006&lt;/td&gt;
&lt;td&gt;该入口号码形态=2 灰度未开放&lt;/td&gt;
&lt;td&gt;该入口暂未开放掩码线索受理&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;1007&lt;/td&gt;
&lt;td&gt;号码形态≠2，却携带了掩码号或加密标识&lt;/td&gt;
&lt;td&gt;明文线索不应携带掩码号、加密标识（防脏数据落库，与主文档 3.1 的分场景必填规则一致）&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;研发实现时，上表的「号码形态」对应 &lt;code&gt;phone_type&lt;/code&gt;（接口 B 为 &lt;code&gt;phoneType&lt;/code&gt;），「手机号」对应报文的 &lt;code&gt;phone&lt;/code&gt;（接口 B 为 &lt;code&gt;contactTel&lt;/code&gt;）。错误码文案是给调用方看的，所以用中文；条件表达式在代码里用字段名。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;&lt;strong&gt;② 例外：声明是掩码线索，却同时传了 11 位明文号&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;这种报文一定会出现（上游复用 DTO、过渡期平台双发、链路中途补号），处置原则一句话：&lt;strong&gt;不拒收、不采信——主字段置空，明文转存候选，验证过才准用。&lt;/strong&gt; 密文同源已确认（2026-10-17），所以问题不是&quot;对不上&quot;，是&quot;这个随报文塞进来的号码本身不敢信&quot;：它没经过平台背书，也可能是占位号或旧号；一旦采信，坐席照着拨、正式转明时覆盖打架、老旧模块绕过加密标识走手机号判重，引发三重系统性数据故障。&lt;/p&gt;
&lt;p&gt;处置分五层：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;层&lt;/th&gt;
&lt;th&gt;处置&lt;/th&gt;
&lt;th&gt;为什么&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;校验&lt;/td&gt;
&lt;td&gt;只校验三件套，&lt;strong&gt;不校验明文号格式&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;不因明文号非法而拒收，兼容上游现状&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;落库&lt;/td&gt;
&lt;td&gt;主字段落 NULL；明文值转存候选明文，来源记 &lt;strong&gt;1（报文明文）&lt;/strong&gt;、验证状态=0。该列不参与判重、外呼、展示等业务动作，录入与转正规则见 2.5&lt;/td&gt;
&lt;td&gt;主字段保持干净，信息不丢&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;判重&lt;/td&gt;
&lt;td&gt;只用加密标识 + 专营店，&lt;strong&gt;不读候选明文&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;与纯掩码线索同一套键，不分裂&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;展示&lt;/td&gt;
&lt;td&gt;显示掩码号；候选明文仅在有权限的详情页以「待验证」标识展示&lt;/td&gt;
&lt;td&gt;防坐席照着打&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;外呼&lt;/td&gt;
&lt;td&gt;走隐私号双轨，&lt;strong&gt;默认不拨候选明文&lt;/strong&gt;；按品牌/门店的策略开关放开后可拨，并打标留痕（开关默认关，用途边界见交底总方案第 6 章 N14）&lt;/td&gt;
&lt;td&gt;号码未验证；放开属业务决策，做成开关而不是写死禁止&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;候选明文的转正条件：&lt;strong&gt;短信核身通过&lt;/strong&gt;（总部录入路径，见 ⑤）或&lt;strong&gt;店端核身回传&lt;/strong&gt;跟随转正（店端已完成核身）；转明后彻底对抖音停传，交车转明走本地 DMS 密文比对、留审计痕迹；密文比对匹配走 2.4，来源记 3，审计分得开。另外按调用方计数上报这类报文，推动上游改干净——否则问题会被「兼容」悄悄掩盖。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;③ 存储与索引（有一条硬约束）&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;号码相关字段共 &lt;strong&gt;11 列&lt;/strong&gt;，完整定义只在 &lt;strong&gt;2.5 ①&lt;/strong&gt; 维护一份，本节不重复列表，避免避免规则口径冲突。本节只涉及其中五列：主字段、号码形态、掩码号、加密标识、候选明文。默认值 &lt;code&gt;phone_type=1&lt;/code&gt;，其余为 NULL；MySQL 8 用 instant add column，不锁表&lt;/li&gt;&lt;li&gt;&lt;strong&gt;&lt;code&gt;encrypt_id&lt;/code&gt; 不能建唯一索引&lt;/strong&gt;：同一客户从不同渠道来会生成多条线索，加密标识必然重复，唯一约束会把这些正常线索直接挡回去。建&lt;strong&gt;普通索引&lt;/strong&gt; &lt;code&gt;idx_encrypt_id&lt;/code&gt; 供密文比对查询即可&lt;/li&gt;&lt;li&gt;候选明文不建索引、不进查询条件——号码占用检查靠密文查 &lt;code&gt;idx_encrypt_id&lt;/code&gt;，不靠这个明文列（做法见 2.5 ④）&lt;/li&gt;&lt;li&gt;幂等仍靠原线索 ID（A &lt;code&gt;extsystem_clue_id&lt;/code&gt; / B &lt;code&gt;outSystemCluekey&lt;/code&gt;），与现有逻辑一致，不新增判重路径&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;④ 向下游透传&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;车巴巴 → 线索中心：号码形态、掩码号、加密标识三个字段原样带过去；线索中心在主字段为空时 LC-A1 放行、LC-A2 跳过（改法见 2.2）&lt;/li&gt;&lt;li&gt;&lt;strong&gt;候选明文不向下游透传&lt;/strong&gt;：它未经验证，一旦流到线索中心与厂商系统，就等于把「不采信」的决定在下一跳推翻&lt;/li&gt;&lt;li&gt;一对多拆分：每条复制&lt;strong&gt;同一&lt;/strong&gt;加密标识与掩码号，原线索 ID 相同——否则 3 家店会把同一客户当 3 个新客户&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;⑤ 灰度与验收&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;灰度：按 &lt;code&gt;page_id&lt;/code&gt;、&lt;code&gt;dataSource&lt;/code&gt; 两个维度做白名单，放开号码形态=2 的受理（先小范围）。先拿 1 个品牌 + 1 家店跑通。开关关着时一律返回 1006——不复用 1002，避免把「没开放」误报成「掩码号格式错」&lt;/li&gt;&lt;li&gt;验收用例，八条：&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;用例&lt;/th&gt;
&lt;th&gt;期望结果&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;1&lt;/td&gt;
&lt;td&gt;老报文，不带任何新字段&lt;/td&gt;
&lt;td&gt;正常入库，行为与现在一致&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2&lt;/td&gt;
&lt;td&gt;掩码报文，三字段齐全&lt;/td&gt;
&lt;td&gt;入库，密文落库&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;3&lt;/td&gt;
&lt;td&gt;号码形态=2，但缺加密标识&lt;/td&gt;
&lt;td&gt;返回 1003&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;4&lt;/td&gt;
&lt;td&gt;同一报文重复推 3 次&lt;/td&gt;
&lt;td&gt;只建 1 条线索&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;5&lt;/td&gt;
&lt;td&gt;一条线索拆给 3 家店&lt;/td&gt;
&lt;td&gt;3 条线索，加密标识相同&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;6&lt;/td&gt;
&lt;td&gt;号码形态=2，但带了 11 位明文号&lt;/td&gt;
&lt;td&gt;不报错；手机号落空，明文进候选明文；线索与外呼都不读它；判重仍走加密标识&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;7&lt;/td&gt;
&lt;td&gt;明文报文却带了掩码号或加密标识&lt;/td&gt;
&lt;td&gt;返回 1007，不入库&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;8&lt;/td&gt;
&lt;td&gt;手机号为空，且没传号码形态&lt;/td&gt;
&lt;td&gt;返回 1001，提示里写清三件套要求&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-5&quot;&gt;2.2 线索中心 · 线索接入管理（留资出口，改造最重）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;功能&lt;/th&gt;
&lt;th&gt;现状（原型原文）&lt;/th&gt;
&lt;th&gt;原型页面&lt;/th&gt;
&lt;th&gt;需改造&lt;/th&gt;
&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;LC-A1&lt;/td&gt;
&lt;td&gt;联系电话位数强校验&lt;/td&gt;
&lt;td&gt;「1 开头，第二位 3-9，总长度 11 位纯数字，&lt;code&gt;^1[3-9]\d{9}$&lt;/code&gt;」&lt;/td&gt;
&lt;td&gt;《线索接入管理【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;掩码号必然通不过。这是&lt;strong&gt;第二道&lt;/strong&gt;拦截点，CB9 在它前面&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;LC-A2&lt;/td&gt;
&lt;td&gt;手机号在网状态查询&lt;/td&gt;
&lt;td&gt;「查询手机号码在网状态」并按异常状态处理；查出来的空号结果缓存 48 小时&lt;/td&gt;
&lt;td&gt;《线索接入管理【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【已闭环】&lt;/strong&gt;抖音已确认不提供检测；掩码线索&lt;strong&gt;统一跳过在网查询并打标&lt;/strong&gt;，不拦截流转，由外呼触达反推&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;LC-A3&lt;/td&gt;
&lt;td&gt;下发厂商系统&lt;/td&gt;
&lt;td&gt;待下发队列 → 厂商系统接收接口；状态 &lt;code&gt;14-待下发厂商&lt;/code&gt; / &lt;code&gt;16-下发失败&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;《线索接入管理【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;报文新增掩码字段；失败原因区分「号码不可用」与「厂商拒收」&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;LC-A4&lt;/td&gt;
&lt;td&gt;线索接收入库字段&lt;/td&gt;
&lt;td&gt;客户姓名、性别、联系电话、备用电话、线索级别、IP、品牌、意向车型/门店、备注、外部系统线索编码、原始系统来源编码&lt;/td&gt;
&lt;td&gt;《线索接入管理【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;新增掩码字段；&lt;code&gt;备用电话&lt;/code&gt; 与 &lt;code&gt;联系电话&lt;/code&gt; 分别标注明文状态&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-6&quot;&gt;2.3 厂商系统 COC / NEV（不在我方，仅契约）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;事项&lt;/th&gt;
&lt;th&gt;原型页面&lt;/th&gt;
&lt;th&gt;我方要做&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;CO1&lt;/td&gt;
&lt;td&gt;接收报文新增掩码字段、允许 phone 为空&lt;/td&gt;
&lt;td&gt;《线索接入管理【逻辑流程图】》；《车巴巴线索标准接口A【逻辑流程图】》《…B【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;提前报备字段变更、约定联调窗口&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CO2&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;去重在 NEV 中台&lt;/strong&gt;：加密标识未透传则中台无法判重&lt;/td&gt;
&lt;td&gt;《培育线索系统流程图》《NEV总部培育线索接收【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;确认标识全链路透传&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CO3&lt;/td&gt;
&lt;td&gt;媒体状态回传链路（车巴巴读 COC 线索状态）&lt;/td&gt;
&lt;td&gt;《汽车之家线索状态同步【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;状态字段不变，号码口径另议&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-7&quot;&gt;2.4 密文比对匹配：工程前提、审计约束与自测&lt;/h3&gt;
&lt;p&gt;同源在工程上等价于两条：&lt;strong&gt;同一号码，本地算与平台下发得到同一个密文；且本地任意时点可对任意明文重算密文&lt;/strong&gt;。有了这两条才能做密文比对——拿密文去比对库里已有的明文（首轮本地实时库、二轮联友全量库，见下方实施分层），不向抖音发任何请求。&lt;/p&gt;
&lt;blockquote&gt;
&lt;p&gt;这条能力是双刃的：谁能调加密节点，谁就能对任意号码算出密文去撞库。因此加密节点只由服务端调用、业务侧不开放直接调用；所有反查必须记操作人与事由，与 2.5 ④ 号码占用检查共用同一套审计约束。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;&lt;strong&gt;方案口径全部在交底总方案 3.3 路 A&lt;/strong&gt;：两道闸门（密文同源 / 明文可信）、补的八条规则（补空不覆盖、只写候选、打三标、不并线索、正式链路覆盖并告警、实时 + 日终两个触发点、一条对多条全补、多条对一条取最近一次）、责任归属与三条自我约束，以那份为准，本节不重复。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;实施分层（2026-10-28 补充）：比对分两轮，范围由近及远&lt;/strong&gt;——首轮用数据公司当日实时库按密文碰撞，命中即取得明文；首轮未命中调联友查询接口（传加密标识 + 车系标识，匹配联友全量库），命中返回明文、仍未命中保持掩码等下次比对。二轮前提：联友全量库存有可匹配的加密标识（LC-A 落地后具备）；两轮都属内部系统间动作，明文不经过抖音。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;本节交付给开发的自测清单&lt;/strong&gt;：① 密文比对命中 → 号码落候选明文、主字段仍空、来源=3、状态=0；② 跨店密文比对 → 照补（2026-10-21 起不限门店），且能查到「补给了哪个门店」；③ 字节线索主字段已有值 → 一个字不碰；④ 补全后DMS 密文比对命中不同号码 → 以最新有效交车登记为准，差异有日志、有告警。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;灰度&lt;/strong&gt;：先 dry-run 两周只统计不写，准确率 ≥95% 再开写。同源已确认后，「密文没命中」是正常的查不到；真正要盯的异常是「明明同一个人却算不出同一个密文」，那是加密节点配置漂移，按故障排查，不计入业务拒绝。&lt;/p&gt;
&lt;h3 id=&quot;sec-8&quot;&gt;2.5 人工跟进拿到明文之后：录入、验证、回写&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;这条路线不需要新造功能，落点在现网已有的动作上。&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;《任务跟进》原型（v10.1，2026-04-08）原文写着：「任务列表的『呼叫』按钮，唤起 PHONEBAR 的『外呼』拨号键，回填任务关联的手机号。&lt;strong&gt;备注：坐席可以修改手机号，和修改线路呼出，不影响关联回访任务。&lt;/strong&gt;」&lt;/p&gt;
&lt;p&gt;也就是说，坐席改号现在就能做，改完直接盖在号码字段上——不校验、不留痕、不知道改的是对是错。掩码上线后，这个动作就是「坐席录入真实号码」的唯一入口。本节要做的就是改它的行为：&lt;strong&gt;改号仍然当场可拨（那是本次呼叫的会话参数），但不再直接写主字段，改写候选。&lt;/strong&gt;&lt;/p&gt;
&lt;h4&gt;① 字段总表：号码相关 11 列（完整定义只此一份；主文档 3.3 是摘要）&lt;/h4&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;列名&lt;/th&gt;
&lt;th&gt;中文名（见 2.0）&lt;/th&gt;
&lt;th&gt;类型&lt;/th&gt;
&lt;th&gt;含义&lt;/th&gt;
&lt;th&gt;谁写&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;主字段&lt;/td&gt;
&lt;td&gt;varchar(20)&lt;/td&gt;
&lt;td&gt;已验证的明文号。&lt;strong&gt;只有验证通过才有值&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;转正事务&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_type&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;号码形态&lt;/td&gt;
&lt;td&gt;tinyint&lt;/td&gt;
&lt;td&gt;1 明文 / 2 掩码&lt;/td&gt;
&lt;td&gt;接口入参&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;mask_phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;掩码号&lt;/td&gt;
&lt;td&gt;varchar(32)&lt;/td&gt;
&lt;td&gt;平台下发的 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt;，展示与兜底外呼用。长度与接口层一致，统一定 32&lt;/td&gt;
&lt;td&gt;接口入参&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;encrypt_id&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;加密标识&lt;/td&gt;
&lt;td&gt;varchar(512)&lt;/td&gt;
&lt;td&gt;不可逆密文，密文比对与占用检查用&lt;/td&gt;
&lt;td&gt;加密节点&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;candidate_phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;候选明文&lt;/td&gt;
&lt;td&gt;varchar(20)&lt;/td&gt;
&lt;td&gt;未验证的明文，来自坐席录入或密文比对匹配&lt;/td&gt;
&lt;td&gt;坐席录入 / 2.4&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_source&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;号码来源&lt;/td&gt;
&lt;td&gt;tinyint&lt;/td&gt;
&lt;td&gt;1 报文明文 / 2 正式链路 / 3 密文比对匹配 / 4 坐席采集&lt;/td&gt;
&lt;td&gt;写入时打标&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_status&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;验证状态&lt;/td&gt;
&lt;td&gt;tinyint&lt;/td&gt;
&lt;td&gt;0 待验证 / 1 已验证 / 2 已失效&lt;/td&gt;
&lt;td&gt;状态机&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_captured_by&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;录入人&lt;/td&gt;
&lt;td&gt;varchar(32)&lt;/td&gt;
&lt;td&gt;坐席工号&lt;/td&gt;
&lt;td&gt;坐席录入&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_captured_at&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;录入时间&lt;/td&gt;
&lt;td&gt;datetime&lt;/td&gt;
&lt;td&gt;—&lt;/td&gt;
&lt;td&gt;坐席录入&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_verified_by&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;验证方式&lt;/td&gt;
&lt;td&gt;tinyint&lt;/td&gt;
&lt;td&gt;1 短信核身（总部录入）/ 2 店端核身回传（跟随转正）/ 3 本地 DMS 密文比对转正/ 4 人工复听（仅内部标记，不转正）&lt;/td&gt;
&lt;td&gt;验证动作&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_verified_at&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;验证时间&lt;/td&gt;
&lt;td&gt;datetime&lt;/td&gt;
&lt;td&gt;—&lt;/td&gt;
&lt;td&gt;验证动作&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_ref_clue_id&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;参照线索&lt;/td&gt;
&lt;td&gt;varchar(64)&lt;/td&gt;
&lt;td&gt;密文比对匹配时对方的线索 ID&lt;/td&gt;
&lt;td&gt;2.4&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;索引三条：&lt;code&gt;idx_encrypt_id&lt;/code&gt;（普通索引，密文比对与占用检查都靠它）、&lt;code&gt;idx_phone&lt;/code&gt;（现有）、&lt;code&gt;idx_phone_status&lt;/code&gt;（扫待验证队列用）。&lt;strong&gt;&lt;code&gt;candidate_phone&lt;/code&gt; 不建索引&lt;/strong&gt;，占用检查不用明文查（见 ④）。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;手机号空值的三种状态怎么落&lt;/strong&gt;（三种状态的判定口径落在本节，便于开发与测试直接对照）：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;状态&lt;/th&gt;
&lt;th&gt;判定&lt;/th&gt;
&lt;th&gt;举个例子&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;本就不下发&lt;/td&gt;
&lt;td&gt;&lt;code&gt;phone_type=1&lt;/code&gt; 且 &lt;code&gt;phone&lt;/code&gt; 有值——非字节渠道，号码本来就有，不存在等待&lt;/td&gt;
&lt;td&gt;门店 DMS 推来的线索，手机号一开始就是 11 位明文&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;待获取&lt;/td&gt;
&lt;td&gt;&lt;code&gt;phone_type=2&lt;/code&gt; 且 &lt;code&gt;phone_status&lt;/code&gt; 为 0 或 2——掩码线索还没拿到明文&lt;/td&gt;
&lt;td&gt;抖音来的张先生只有 &lt;code&gt;&lt;strong&gt;*&lt;/strong&gt;**3090&lt;/code&gt;，候选格空着&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;已获取&lt;/td&gt;
&lt;td&gt;&lt;code&gt;phone_type=2&lt;/code&gt; 且 &lt;code&gt;phone_status=1&lt;/code&gt;——已转正，&lt;code&gt;phone&lt;/code&gt; 有值&lt;/td&gt;
&lt;td&gt;张先生短信核身通过，3090 搬进正式栏&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;三种状态都不触发空号告警。唯一算异常的是 &lt;code&gt;phone_type=1&lt;/code&gt; 却 &lt;code&gt;phone&lt;/code&gt; 为空（上游违约），按 1001 拒收。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;候选变更历史表&lt;/strong&gt;（状态机「坐席改录另一个号，旧的进历史表」的落点，&lt;code&gt;lead_phone_history&lt;/code&gt;）：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;列&lt;/th&gt;
&lt;th&gt;类型&lt;/th&gt;
&lt;th&gt;存什么&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;clue_id&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;varchar(64)&lt;/td&gt;
&lt;td&gt;哪条线索&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;old_candidate_phone&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;varchar(20)&lt;/td&gt;
&lt;td&gt;被替换掉的旧候选号&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;old_encrypt_id&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;varchar(512)&lt;/td&gt;
&lt;td&gt;旧候选号的加密标识&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;phone_source&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;tinyint&lt;/td&gt;
&lt;td&gt;旧的来源取值&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;changed_by&lt;/code&gt; / &lt;code&gt;changed_at&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;varchar(32) / datetime&lt;/td&gt;
&lt;td&gt;谁改的、什么时候&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;code&gt;reason&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;varchar(64)&lt;/td&gt;
&lt;td&gt;替换原因：坐席改录 / 转正 / 失效&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h4&gt;② 状态机&lt;/h4&gt;
&lt;p&gt;七个状态、两条已验证来路（&lt;strong&gt;短信核身&lt;/strong&gt; / &lt;strong&gt;店端核身回传&lt;/strong&gt;）与「只有已验证才写主字段」的约束，见&lt;strong&gt;交底总方案 3.3 状态机&lt;/strong&gt;（带完整例子），本节不重复。&lt;/p&gt;
&lt;h4&gt;③ 录入四条校验，顺序执行，任一不过就拦&lt;/h4&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;校验&lt;/th&gt;
&lt;th&gt;不过时&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;1&lt;/td&gt;
&lt;td&gt;11 位、&lt;code&gt;^1[3-9]\d{9}$&lt;/code&gt;&lt;/td&gt;
&lt;td&gt;2002&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2&lt;/td&gt;
&lt;td&gt;后四位与掩码尾号一致（掩码形态含星号，由第 1 条天然拦下）&lt;/td&gt;
&lt;td&gt;2002&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;3&lt;/td&gt;
&lt;td&gt;号码占用检查（见 ④）&lt;/td&gt;
&lt;td&gt;2001&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;4&lt;/td&gt;
&lt;td&gt;坐席对该线索有跟进权限&lt;/td&gt;
&lt;td&gt;2003&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h4&gt;④ 号码占用检查：用密文查，不查明文&lt;/h4&gt;
&lt;p&gt;这一步防的是「坐席错一位数，正好是另一个真实客户」。看起来概率低，线索量上百万就是天天发生，而且后果是两个客户的数据交叉、两家店抢同一个客户。&lt;/p&gt;
&lt;p&gt;做法：写入前先把输入的号码本地加密，得到一个加密标识，再用 &lt;code&gt;idx_encrypt_id&lt;/code&gt; 索引查这个密文是否已经在&lt;strong&gt;其他&lt;/strong&gt;线索上：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;未命中 → 允许录入，号码落候选明文&lt;/li&gt;&lt;li&gt;命中其他线索 → &lt;strong&gt;直接拦下（2001），不让通过&lt;/strong&gt;；坐席核对无误可重录。真是同一位客户的，由密文比对匹配（密文一致即同一人、不限门店，见总方案 3.3）自动把号关联到本条线索，&lt;strong&gt;不需要坐席手工归并&lt;/strong&gt;；报错文案提示「该号码已在其他线索存在，系统会自动关联，无需重复录入」&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;好处是三重的：不用给候选明文建索引、不拿明文做查询条件、与 2.1.3 定的存储约束一致。前提是加密节点全系统统一、且与平台同算法同盐——&lt;strong&gt;后一条已于 2026-10-17 由字节确认&lt;/strong&gt;。&lt;/p&gt;
&lt;h4&gt;⑤ 已验证的两个来路：短信核身 / 店端核身回传&lt;/h4&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;方式&lt;/th&gt;
&lt;th&gt;触发&lt;/th&gt;
&lt;th&gt;判定&lt;/th&gt;
&lt;th&gt;要坐席操作吗&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;短信核身&lt;/td&gt;
&lt;td&gt;坐席点「发验证短信」（号码在录入时已通过尾号校验）&lt;/td&gt;
&lt;td&gt;客户点链接或回填验证码&lt;/td&gt;
&lt;td&gt;是&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;店端核身回传&lt;/td&gt;
&lt;td&gt;店端登记真实手机号并当面核身后回传接入平台&lt;/td&gt;
&lt;td&gt;店端已完成核身，&lt;strong&gt;跟随写转正、不再重复发码&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;否（核身发生在店端）&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;总部坐席录入路径的验证方式只有&lt;strong&gt;短信核身&lt;/strong&gt;一种（前期沟通已定）；&lt;strong&gt;店端核身回传&lt;/strong&gt;是另一条已验证来路——店端当面完成核身，回传后跟随写转正。再次留资密文一致走&lt;strong&gt;密文比对匹配&lt;/strong&gt;（2.4），系统直接写入主字段转正（来源 3、phone_status=1 已验证）供坐席直拨；交车转明完全靠本地 DMS 密文比对，转明后彻底对抖音停传。「人工复听」只把验证方式记为 4，&lt;strong&gt;不转正&lt;/strong&gt;，仅作内部标记。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;h4&gt;⑥ 转正：一个事务，四件事&lt;/h4&gt;
&lt;ol&gt;
&lt;li&gt;主字段写入候选明文的值，验证状态置 1，同时记下验证方式与验证时间；&lt;strong&gt;号码来源保持原值&lt;/strong&gt;——来源是历史事实，不因为验证过就改成「正式链路」&lt;/li&gt;&lt;li&gt;候选明文、录入人与录入时间都不清空，审计要能回答「这个号最早是谁提供的」&lt;/li&gt;&lt;li&gt;写一条转正事件到回写队列&lt;/li&gt;&lt;li&gt;工作台该线索的号码位刷新，外呼按钮从「隐私号外呼」变为「直接拨号」&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;strong&gt;转正后同步与占用拒绝（2026-10-28 业务确认口径，规则细节与例子见总方案 3.3 路 B）&lt;/strong&gt;：&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;strong&gt;店端明文回传&lt;/strong&gt;：店端跟进拿到真实手机号并已完成核身，回传线索接入平台后跟随更新写转正（不再重复发码），全链路数据一处更新&lt;/li&gt;&lt;li&gt;&lt;strong&gt;同步联友各业务系统&lt;/strong&gt;：转正后的明文手机号 + 用明文重算出的加密标识，同步至联友侧各业务系统，完成关联线索的信息更新——一条明文关联多条线索的批量生效&lt;/li&gt;&lt;li&gt;&lt;strong&gt;占用拒绝转正&lt;/strong&gt;：用户提供的手机号已绑定其他&lt;strong&gt;有效线索&lt;/strong&gt;的，直接拒绝本次转正申请，不影响原线索正常流转；被拒线索保持掩码，等正式链路回传或换号再发起。与 ④ 的录入拦截分层：④ 拦「录」（2001），这条拦「转」&lt;/li&gt;
&lt;/ol&gt;
&lt;h4&gt;⑦ 回写：两条现成通道，加字段即可，不新建接口&lt;/h4&gt;
&lt;p&gt;原型里本来就有两个回写口，正好对应两个方向：&lt;/p&gt;

&lt;td&gt;回访描述、时间、提交人、录音地址、通话状态等，&lt;strong&gt;不含电话&lt;/strong&gt;&lt;/td&gt;

&lt;td&gt;同上，&lt;strong&gt;不含电话&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;同上&lt;/td&gt;
&lt;td&gt;默认关，接口确认后开&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;本系统留资线索&lt;/td&gt;

&lt;td&gt;同上&lt;/td&gt;
&lt;td&gt;默认开&lt;/td&gt;
&lt;/tr&gt;

&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;三条铁律：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;只回写已验证的&lt;/strong&gt;。待验证的号不出本系统——宁可中台少一条号码，也不要多一条错号&lt;/li&gt;&lt;li&gt;回写必须带加密标识，让对方自己用密文校验一致性，不必信明文&lt;/li&gt;&lt;li&gt;回写失败重试 3 次后进失败队列，&lt;strong&gt;不影响本地转正结果&lt;/strong&gt;：本地已生效，回写只是补偿&lt;/li&gt;
&lt;/ul&gt;

&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-9&quot;&gt;三、培育线索链路：改造范围&lt;/h2&gt;

&lt;td&gt;手工导入车系线索&lt;/td&gt;
&lt;td&gt;《线索导入》&lt;/td&gt;
&lt;td&gt;程序自动加密入库（分两种场景，见下方说明）&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;LC-B16&lt;/td&gt;
&lt;td&gt;号码质量与报表（并入 4.3 RP2/RP3）&lt;/td&gt;
&lt;td&gt;无效号码标签明细、质量标签明细等，统一由「报表」条目承接&lt;/td&gt;
&lt;td&gt;同 RP2/RP3&lt;/td&gt;
&lt;td&gt;见 RP2 / RP3&lt;/td&gt;
&lt;td&gt;见 RP2/RP3&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;LC-B17&lt;/td&gt;
&lt;td&gt;短信触达（预触达 / 外呼后短信 / 坐席短信跟进 / 排班模板）&lt;/td&gt;
&lt;td&gt;5 条下发规则按外呼类型、通话状态、标签、优先级命中后下发；3 次未接自动转「短信辅助建联」；未接通下跟进结果含「短信跟进」&lt;/td&gt;
&lt;td&gt;《短信下发配置》《任务排班-短信模板》《任务跟进》《三无忧配置》&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;掩码号收不了、平台不代发（2026-10-17 已确认）&lt;/strong&gt;：按线索来源跳过并降级，见 3.1&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;附1&lt;/td&gt;
&lt;td&gt;首触归因&lt;/td&gt;
&lt;td&gt;按手机号打「首次触达」标记（交底总方案 3.2 已列，无独立 B 编号）&lt;/td&gt;
&lt;td&gt;见交底总方案 3.2&lt;/td&gt;
&lt;td&gt;改按加密标识 + 首触打标，否则渠道归因、投放评估、供应商结算全错&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;附2&lt;/td&gt;
&lt;td&gt;关键行为提醒（同店再次留资 T/N）&lt;/td&gt;
&lt;td&gt;按手机号命中「同店再次留资」提醒（交底总方案 3.2 已列，无独立 B 编号）&lt;/td&gt;
&lt;td&gt;见交底总方案 3.2&lt;/td&gt;
&lt;td&gt;改按加密标识，时间窗 T 与频次 N 不变&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;blockquote&gt;
&lt;p&gt;附1、附2 不是新编号，是交底总方案 3.2 换键清单里落在培育主线的两处，开发按条目名找即可，别按编号找。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;&lt;strong&gt;LC-B15 落地说明：导入场景下「加密」由谁做、模板怎么改&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;加密由程序在上传后自动完成，员工不需要、也不该手工填加密标识。&lt;/strong&gt; 分两种场景：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;场景&lt;/th&gt;
&lt;th&gt;Excel 里有什么&lt;/th&gt;
&lt;th&gt;程序做什么&lt;/th&gt;
&lt;th&gt;模板改不改&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;① 明文号码（常态：展会、门店、DCC 手工收集）&lt;/td&gt;
&lt;td&gt;客户姓名 + 11 位手机号&lt;/td&gt;
&lt;td&gt;服务端先做 11 位校验 → 本地加密生成加密标识 → 与明文号码同行落库（号码形态记 1）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;不用改&lt;/strong&gt;，员工无感；加密标识由系统生成，不开放填写&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;② 带掩码的数据（外部系统导出、批量承接字节线索）&lt;/td&gt;
&lt;td&gt;手机号列是掩码格式，另有加密标识、原线索 ID&lt;/td&gt;
&lt;td&gt;按号码列的形态&lt;strong&gt;自动分流&lt;/strong&gt;：是 11 位明文就走场景①；是掩码格式就走掩码入库，此时加密标识与原线索 ID 必填，缺一个就整行拒收并在结果里标出行号&lt;/td&gt;
&lt;td&gt;增加三列&lt;strong&gt;可选&lt;/strong&gt;列：掩码号 / 加密标识 / 原线索 ID；不填就走场景①&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;两个必须守住的口径：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;加密与字节下发同算法同盐，已确认（2026-10-17）&lt;/strong&gt;。所以场景①本地生成的加密标识，和平台下发的能直接比对：这位客户从手工导入渠道进来，能跟字节来的那条撞上，导入判重成立。原来是这条链上最悬的一环，现在落地了。要守住的是——加密节点必须严格按字节给的算法与盐配置，不许自行选参数或换实现。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;导入判重键跟着变&lt;/strong&gt;：明文行按现有手机号判重不变；掩码行按加密标识（或原线索 ID）判重，同一文件内重复行提示合并，不重复建线索。&lt;/li&gt;
&lt;/ul&gt;
&lt;h3 id=&quot;sec-10&quot;&gt;3.1 短信：已确认发不出去，影响六处&lt;/h3&gt;
&lt;p&gt;2026-10-17 已确认：&lt;strong&gt;掩码号不能接收短信，平台也不代发&lt;/strong&gt;。且短信&lt;strong&gt;不是&lt;/strong&gt;任务生成的前置条件（原型批次 10,000 条去重、短信成功 9,911 条，任务照样 10,000 个，见交底总方案 4.5）——抖音线索不会卡在短信这一步，真正丢的是下面六处动作：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;落点&lt;/th&gt;
&lt;th&gt;原型出处（现状证据）&lt;/th&gt;
&lt;th&gt;改法（开发执行）&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;1&lt;/td&gt;
&lt;td&gt;三无忧「短信预触达」&lt;/td&gt;
&lt;td&gt;批次执行记录四步：候选池生成（准入/分层/去重过滤）→ 短信预触达 → 生成任务；报表列「短信成功」排在「DCC培育任务」之前&lt;/td&gt;
&lt;td&gt;掩码线索跳过预触达、直接进任务池；报表「短信成功」列对掩码线索显示「不适用」，成功率分母剔除&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2&lt;/td&gt;
&lt;td&gt;AI 外呼结束后的短信下发（5 条规则）&lt;/td&gt;
&lt;td&gt;《短信下发配置》：按外呼类型、通话状态、外呼标签、优先级命中后下发，共 5 个模板&lt;/td&gt;
&lt;td&gt;规则执行前先判线索来源，掩码线索直接跳过并记「未触达-无可用号码」&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;3&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;三次未接的自动兜底&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;《2~N呼接通率》自愈机制：「若 3 次外呼皆未接通，系统自动触发退池机制，将其转为『短信辅助建联』策略」&lt;/td&gt;
&lt;td&gt;改为「转待短信池」：标记等明文，拿到明文后补发；掩码期不计入「短信辅助建联」口径&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;4&lt;/td&gt;
&lt;td&gt;坐席「未接通」下的跟进结果&lt;/td&gt;
&lt;td&gt;《任务跟进》跟进结果枚举：未接通 → 稍后回拨 / 短信跟进（未接通发短信、客户要求短信、其他）&lt;/td&gt;
&lt;td&gt;掩码线索隐藏「短信跟进」，只留「稍后回拨」；客户明确要求短信时，落一条「待补发」待办&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;5&lt;/td&gt;
&lt;td&gt;坐席任务卡「下发短信 / 下发关怀短信」&lt;/td&gt;
&lt;td&gt;《任务跟进》任务卡两个按钮&lt;/td&gt;
&lt;td&gt;掩码线索按钮置灰，悬浮写明原因&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;6&lt;/td&gt;
&lt;td&gt;任务排班 4 类模板&lt;/td&gt;
&lt;td&gt;《任务排班-短信模板》：到店提醒、跟进回访、活动邀约、生日祝福&lt;/td&gt;
&lt;td&gt;模板标注「掩码线索不可用」；到店提醒改由坐席电话或企微提醒，试驾排程页同步&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;改完的净效果：&lt;strong&gt;抖音线索在拿到明文之前，触达手段只剩外呼一种，且没有短信兜底。&lt;/strong&gt; 接通率与二次触达率都会受影响，报表必须能按线索来源分开看，否则会被当成系统故障排查。&lt;/p&gt;
&lt;hr&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-11&quot;&gt;四、非线索模块：号码依赖影响面&lt;/h2&gt;
&lt;p&gt;线索中心 480 个页面里，有 84 个页面的「手机号 / 联系电话」出现 3 次以上，属于与号码强相关的页面（企微营销板块的页面不属于我方，未纳入下表）。主线之外，还有质检、报表、试驾、配置器四条支线以号码为键。&lt;/p&gt;
&lt;h3 id=&quot;sec-12&quot;&gt;4.1 板块全景&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;板块&lt;/th&gt;
&lt;th&gt;主要页面&lt;/th&gt;
&lt;th&gt;号码依赖&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;线索培育（主线）&lt;/td&gt;
&lt;td&gt;线索接入管理、NEV总部培育线索接收、任务跟进、批量下发&lt;/td&gt;
&lt;td&gt;判重、外呼、在网/空号检测&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;录音抽检（质检）&lt;/td&gt;
&lt;td&gt;录音列表、质检明细、质检看板、质检模型配置&lt;/td&gt;
&lt;td&gt;录音↔线索关联、明细列&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;报表 / 看板&lt;/td&gt;
&lt;td&gt;外呼任务明细、AI外呼任务明细、培育后效明细、质量标签明细、员工维度看板&lt;/td&gt;
&lt;td&gt;导出回填、号码列、无效号码统计&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;试驾 / 排程&lt;/td&gt;
&lt;td&gt;预约试驾、试驾回访处理流程、试驾排程评分统计&lt;/td&gt;
&lt;td&gt;试驾回访工单查询、排程评分&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;配置器群&lt;/td&gt;
&lt;td&gt;培育任务分配配置器、回访预外呼重推配置、外呼执行/预外呼任务/未接通/未转化配置器&lt;/td&gt;
&lt;td&gt;分配规则按&lt;strong&gt;号码归属地&lt;/strong&gt;分城；重推请求带手机号码并按号码查状态&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-13&quot;&gt;4.2 质检 / 录音抽检&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;功能&lt;/th&gt;
&lt;th&gt;现状（原型证据）&lt;/th&gt;
&lt;th&gt;原型页面&lt;/th&gt;
&lt;th&gt;需改造&lt;/th&gt;
&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;QA1&lt;/td&gt;
&lt;td&gt;录音 ↔ 线索关联&lt;/td&gt;
&lt;td&gt;质检明细按「客户手机号」展示并关联被检录音&lt;/td&gt;
&lt;td&gt;《人工质检-质检明细》《人工质检-录音列表》&lt;/td&gt;
&lt;td&gt;掩码线索录音无法按号码关联 → 关联键改任务ID / 加密标识&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;QA2&lt;/td&gt;
&lt;td&gt;质检看板号码维度&lt;/td&gt;
&lt;td&gt;按号码维度统计与筛选&lt;/td&gt;
&lt;td&gt;《nev培育-质检看板》&lt;/td&gt;
&lt;td&gt;统计失真 → 改按任务/坐席/线索ID&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;QA3&lt;/td&gt;
&lt;td&gt;质检平台登录&lt;/td&gt;
&lt;td&gt;「使用手机号&amp;amp;验证码即可登录」&lt;/td&gt;
&lt;td&gt;《人工质检-录音列表》&lt;/td&gt;
&lt;td&gt;用的是员工本人手机号，与线索号码无关，不用改&lt;/td&gt;
&lt;td&gt;仅核对&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-14&quot;&gt;4.3 报表 / 看板&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;功能&lt;/th&gt;
&lt;th&gt;现状（原型证据）&lt;/th&gt;
&lt;th&gt;原型页面&lt;/th&gt;
&lt;th&gt;需改造&lt;/th&gt;
&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;RP1&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;外呼任务明细导出回填&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;「导出数据时执行，根据&lt;strong&gt;手机号码&lt;/strong&gt;查询 DCC 留资线索数据，取最新一条回填『NEV线索中台编码』参数」&lt;/td&gt;
&lt;td&gt;《外呼任务明细》&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;硬伤&lt;/strong&gt;：掩码线索查不到 → 「NEV线索中台编码」整列空 → 与中台对账时对不上&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;RP2&lt;/td&gt;
&lt;td&gt;无效号码标签统计&lt;/td&gt;
&lt;td&gt;按号码判定空号/停机&lt;/td&gt;
&lt;td&gt;《无效号码标签明细》&lt;/td&gt;
&lt;td&gt;掩码期无法判无效 → 掩码线索单列「号码不可判定」，不参与无效率分母&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;RP3&lt;/td&gt;
&lt;td&gt;号码列展示&lt;/td&gt;
&lt;td&gt;质量标签明细列「手机号码」「客户手机号」；AI外呼任务明细、培育后效明细含号码列&lt;/td&gt;
&lt;td&gt;《质量标签明细》《ai外呼任务明细》《培育后效明细》&lt;/td&gt;
&lt;td&gt;号码列脱敏 + 导出权限收敛&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;RP4&lt;/td&gt;
&lt;td&gt;看板口径&lt;/td&gt;
&lt;td&gt;预外呼效果、自动填单效果、员工维度、AI外呼重拨四个看板&lt;/td&gt;
&lt;td&gt;同现状列四个看板页&lt;/td&gt;
&lt;td&gt;分母若含号码有效率，需同步剔除&lt;/td&gt;
&lt;td&gt;P2&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-15&quot;&gt;4.4 试驾 / 排程&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;功能&lt;/th&gt;
&lt;th&gt;现状（原型证据）&lt;/th&gt;
&lt;th&gt;原型页面&lt;/th&gt;
&lt;th&gt;需改造&lt;/th&gt;
&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;TD1&lt;/td&gt;
&lt;td&gt;试驾回访工单查询&lt;/td&gt;
&lt;td&gt;同 LC-B14：按手机号查最近 180 天工单&lt;/td&gt;
&lt;td&gt;《任务跟进》&lt;/td&gt;
&lt;td&gt;改按加密标识关联&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;TD2&lt;/td&gt;
&lt;td&gt;试驾排程与评分&lt;/td&gt;
&lt;td&gt;预约试驾、预约试驾明细、试驾回访处理流程、试驾排程评分统计、留资线索试驾排程场景&lt;/td&gt;
&lt;td&gt;同现状列五页&lt;/td&gt;
&lt;td&gt;评分若含号码维度需同步&lt;/td&gt;
&lt;td&gt;P2&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;TD3&lt;/td&gt;
&lt;td&gt;接收试驾状态数据&lt;/td&gt;
&lt;td&gt;按线索回写试驾状态&lt;/td&gt;
&lt;td&gt;《接收试驾状态数据》&lt;/td&gt;
&lt;td&gt;关联键核对&lt;/td&gt;
&lt;td&gt;P2&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-16&quot;&gt;4.5 配置器群&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;事项&lt;/th&gt;
&lt;th&gt;说明&lt;/th&gt;
&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;CF1&lt;/td&gt;
&lt;td&gt;外呼执行配置器 / 预外呼任务配置器&lt;/td&gt;
&lt;td&gt;原型全文 0 命中「号码/手机号」；仅核对筛选条件确无「号码状态」（空号/停机）维度&lt;/td&gt;
&lt;td&gt;仅核对&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CF2&lt;/td&gt;
&lt;td&gt;未接通 / 未转化 / 跟进次数配置器&lt;/td&gt;
&lt;td&gt;按跟进结果与次数触发，不依赖号码&lt;/td&gt;
&lt;td&gt;仅核对&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CF3&lt;/td&gt;
&lt;td&gt;培育任务分配配置器 / 分配规则&lt;/td&gt;
&lt;td&gt;配置器本身不依赖号码形态、无需改动。仅核对一点：分配执行选「按城市」时取的是「手机号码归属地」，掩码线索取不到 → 确认该处取数已切到 LC-B5 新链（专营店城市 &amp;gt; 媒体推送省市 &amp;gt; IP &amp;gt; 省份兜底），否则掩码线索落默认城市&lt;/td&gt;
&lt;td&gt;仅核对&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CF4&lt;/td&gt;
&lt;td&gt;SC / 线索状态 / 渠道 / 车系配置器、数据字典管理&lt;/td&gt;
&lt;td&gt;字典与映射，不存号码&lt;/td&gt;
&lt;td&gt;仅核对&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;CF5&lt;/td&gt;
&lt;td&gt;回访预外呼重推配置&lt;/td&gt;
&lt;td&gt;请求参数含手机号码、主叫号码；执行「查询手机号码是否存在店端跟进中状态」→ 改按线索 ID / 加密标识（与 OT1 同款查询）&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-17&quot;&gt;4.6 其他零散页&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;#&lt;/th&gt;
&lt;th&gt;功能&lt;/th&gt;
&lt;th&gt;现状（原型证据）&lt;/th&gt;
&lt;th&gt;原型页面&lt;/th&gt;
&lt;th&gt;需改造&lt;/th&gt;
&lt;th&gt;优先级&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;OT1&lt;/td&gt;
&lt;td&gt;智能体填单审核&lt;/td&gt;
&lt;td&gt;「查询&lt;strong&gt;手机号码&lt;/strong&gt;是否存在店端跟进中状态」&lt;/td&gt;
&lt;td&gt;《智能体填单审核》&lt;/td&gt;
&lt;td&gt;判重依赖号码 → 改加密标识（与 LC-B3 同源，但是另一条入口）&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;OT2&lt;/td&gt;
&lt;td&gt;私域留资未满同步&lt;/td&gt;
&lt;td&gt;与《留资未满线索数据同步》同源的另一条 CDP 同步&lt;/td&gt;
&lt;td&gt;《私域留资未满线索数据同步【逻辑流程图】》&lt;/td&gt;
&lt;td&gt;唯一 ID 的生成依据跟着改，与 LC-B4 是同一类问题&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;OT4&lt;/td&gt;
&lt;td&gt;线索导入&lt;/td&gt;
&lt;td&gt;手工导入车系线索&lt;/td&gt;
&lt;td&gt;《线索导入》&lt;/td&gt;
&lt;td&gt;同 LC-B15&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-18&quot;&gt;4.7 影响面结论（全系统）&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;板块（章节）&lt;/th&gt;
&lt;th&gt;对应条目&lt;/th&gt;
&lt;th&gt;最高优先级&lt;/th&gt;
&lt;th&gt;最需要先动的一处&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;车巴巴（2.1）&lt;/td&gt;
&lt;td&gt;CB1–CB12&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;td&gt;懂车云店与车云店的「13~19 位」强校验（CB9）把掩码线索全挡在门外（强校验同款共 5 处）；头条 MAPI 两页原型均无电话字段（N9）；E11 无强校验，掩码号能直接进（反向风险）；原拟「基木鱼线索接口」为回传页已撤销&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;线索中心接入层（2.2）&lt;/td&gt;
&lt;td&gt;LC-A1–A4&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;td&gt;正则强校验（A1）与在网查询（A2）两道都过不了掩码号&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;培育主线（三）&lt;/td&gt;
&lt;td&gt;LC-B1–B12、B14–B15（B16 见报表、B17 见短信）&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;td&gt;《任务跟进》整条流程以号码为轴：坐席搜索、线路评分、试驾回访工单、天网分派全按手机号；B17 短信六处降级&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;质检 / 录音（4.2）&lt;/td&gt;
&lt;td&gt;QA1–QA3&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;td&gt;录音与线索靠手机号关联，掩码线索的录音拿不出关联证据&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;报表 / 看板（4.3）&lt;/td&gt;
&lt;td&gt;RP1–RP4&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;td&gt;《外呼任务明细》导出按手机号反查线索回填「NEV线索中台编码」，掩码后整列空&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;试驾 / 排程（4.4）&lt;/td&gt;
&lt;td&gt;TD1–TD3&lt;/td&gt;
&lt;td&gt;P1&lt;/td&gt;
&lt;td&gt;试驾回访工单按手机号取 180 天记录&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;配置器群（4.5）&lt;/td&gt;
&lt;td&gt;CF1–CF5&lt;/td&gt;
&lt;td&gt;P0（CF5）&lt;/td&gt;
&lt;td&gt;回访预外呼重推配置按手机号查店端跟进状态（CF5），与 OT1 同款查询&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;其他散页（4.6）&lt;/td&gt;
&lt;td&gt;OT1、OT2、OT4&lt;/td&gt;
&lt;td&gt;P0&lt;/td&gt;
&lt;td&gt;智能体填单审核按号码判重（OT1）；私域留资未满同步的唯一 ID 生成（OT2）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;已排查、无落点&lt;/td&gt;
&lt;td&gt;—&lt;/td&gt;
&lt;td&gt;仅核对&lt;/td&gt;
&lt;td&gt;CDP 打标签、AI 场景专营店选取规则：号码只用于展示或条件匹配，不产生新的改造项&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;读法：标 P0 的六行不同步改，上线当天会同时出问题——媒体线索进不来、接入层拦下、坐席搜不到人、报表对不上账、判重重复建单。&lt;/p&gt;

&lt;body id=&quot;top&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;

&lt;main&gt;
&lt;div class=&quot;hero&quot;&gt;
&lt;span class=&quot;kicker&quot;&gt;对外技术讲解 · 疑问与依赖&lt;/span&gt;
&lt;h1&gt;抖音掩码改造 · 疑问与依赖梳理&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-1&quot;&gt;一、要请字节侧答复的疑问&lt;/h2&gt;
&lt;h3 id=&quot;sec-1-0&quot;&gt;先看链路：一条抖音线索怎么走到主机厂&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;客户留资 → 抖音线索系统 → DNDC 接入平台 → 下发主机厂（COC / NEV）&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;客户留资&lt;/strong&gt;：客户在抖音 App 里填表单、私信、直播间组件留了购车意向；&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;抖音线索系统&lt;/strong&gt;：抖音把线索收集起来，按 2027-01-04 新政脱敏后向主机厂侧分发；&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;DNDC 接入平台&lt;/strong&gt;：我们这一端收报文、验号码、判重、向下转发——&lt;strong&gt;本次改造的课题基本都压在这一环&lt;/strong&gt;；&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;下发主机厂（COC / NEV）&lt;/strong&gt;：线索进入 COC / NEV 中台，再流到 DCC 培育与门店跟进。&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;围绕 DNDC 接入平台的课题（先看大局）&lt;/h3&gt;
&lt;p&gt;按上面四个环节，16 条疑问归成五类课题。每类先说一句话，&lt;strong&gt;细节（场景、卡点、例子、建议谁去问）按阻断 → 重要 → 一般三级列在本节后半部分&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;环节&lt;/th&gt;&lt;th&gt;课题一句话&lt;/th&gt;&lt;th&gt;相关编号&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;进&lt;/strong&gt;：报文收得进来吗&lt;/td&gt;&lt;td&gt;号码在报文里怎么传、我方校验放不放行——三种形态对应三套改法，不定无法开工&lt;/td&gt;&lt;td&gt;N1、N9、N19、N13&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;认&lt;/strong&gt;：认得出是谁吗&lt;/td&gt;&lt;td&gt;判重从手机号换成加密标识，这个字段和归属地能不能跟着线索一路带过来&lt;/td&gt;&lt;td&gt;N2、N3&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;转&lt;/strong&gt;：转得出主机厂吗&lt;/td&gt;&lt;td&gt;向 COC / NEV 转发的报文要不要加掩码字段，卡在下游排期&lt;/td&gt;&lt;td&gt;N8、N10&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;用&lt;/strong&gt;：外呼还灵不灵&lt;/td&gt;&lt;td&gt;话单录音怎么回传、空号检测还能不能做——决定培育环节的能力边界&lt;/td&gt;&lt;td&gt;N5&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;出&lt;/strong&gt;：明文怎么回来&lt;/td&gt;&lt;td&gt;到店回传口径、政策有效期、评级与进展回传——决定取号与转化的闭环&lt;/td&gt;&lt;td&gt;N17、N18、N7&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;一句话读法&lt;/strong&gt;：进和转是「能不能开工」（阻断 / 契约），认和用是「做到一半停不停」（设计依赖），出是「闭环闭不闭得上」（政策口径）。五类课题的明细如下。&lt;/p&gt;
&lt;h3 id=&quot;sec-1-1&quot;&gt;阻断级&lt;/h3&gt;
&lt;blockquote&gt;
&lt;p&gt;这三条拿不到答复，对应的代码就没法开始写。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;什么场景&lt;/th&gt;
&lt;th&gt;卡在哪&lt;/th&gt;
&lt;th&gt;不确认会怎样（举个例子）&lt;/th&gt;
&lt;th&gt;建议谁去问 / 渠道&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N1&lt;/strong&gt;（11/05 前）&lt;/td&gt;
&lt;td&gt;11 个字节系入口把线索推 / 拉给我们：E2–E10 对方推送、E1 与 E11 我方轮询拉取&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;报文里号码怎么传&lt;/strong&gt;没有说法——① 掩码号填进原「电话」字段；② 电话字段留空、另加掩码号与加密标识；③ 仍给明文。同时我方接口 &lt;code&gt;phone&lt;/code&gt; / &lt;code&gt;contactTel&lt;/code&gt; 必填、车巴巴另有 13~19 位强校验（5 处），&lt;strong&gt;校验是否放开也要一起定&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;三种形态对应三种改法，分流方案与工作量都估不出，还可能出现线索全被拒收：懂车云店推一条只有 &lt;code&gt;*******3090&lt;/code&gt; 的线索过来，现有校验判「手机号码不合法」，整条进异常表&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;产品书面发字节&lt;/strong&gt;：附 E1–E11 清单与三种形态选项让对方勾选，需正式答复&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N9&lt;/strong&gt;（11/05 前）&lt;/td&gt;
&lt;td&gt;头条 MAPI 这一路：下发每 10 分钟、更新每 6 小时，由我方轮询拉取&lt;/td&gt;
&lt;td&gt;号码&lt;strong&gt;从哪个字段取&lt;/strong&gt;不知道——下发与更新两页原型的示例只有姓名 / 省 / 市 / 经销商 / 车型，没有电话那一格&lt;/td&gt;
&lt;td&gt;窗口 ① 无法改造，头条来源的线索取不到号：头条推一条「广州风日 H2901X」的线索过来，报文里翻不到号码放在哪个 key，加密比对无从做起&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;研发进技术群直接问&lt;/strong&gt;：纯字段确认，可与 N1 同一封发出&lt;/td&gt;
&lt;/tr&gt;

&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-1-2&quot;&gt;重要级&lt;/h3&gt;
&lt;blockquote&gt;
&lt;p&gt;这六条可以先动手，但做到一半一定会停下来等答复。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;什么场景&lt;/th&gt;
&lt;th&gt;卡在哪&lt;/th&gt;
&lt;th&gt;不确认会怎样（举个例子）&lt;/th&gt;
&lt;th&gt;建议谁去问 / 渠道&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N2&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;线索归属地分派与一对多下发——现规则「专营店城市 &amp;gt; 手机号城市 &amp;gt; 专营店省份 &amp;gt; 手机号省份」&lt;/td&gt;
&lt;td&gt;掩码线索&lt;strong&gt;是否仍带&lt;/strong&gt;省 / 市 / 经销商编码（E2–E5 已知带「意向城市 / 意向省份 / 分发经销商ID」）&lt;/td&gt;
&lt;td&gt;只能按手机号归属地猜城市：原来靠「分发经销商ID」直接把线索派到广州风日，这个字段在掩码线索上没了，就只能猜客户在哪个城市&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;随 N1 一并书面确认&lt;/strong&gt;：同属报文形态问题，不单发&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N3&lt;/strong&gt; &lt;span style=&quot;color:#059669;font-weight:600;font-size:11px;background:#ecfdf5;padding:1px 5px;border-radius:4px;border:1px solid #a7f3d0&quot;&gt;已闭环&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;同一客户在抖音和其他渠道分别留资，要在 NEV 中台判成同一人&lt;/td&gt;
&lt;td&gt;加密标识&lt;strong&gt;能否透传到 NEV 中台&lt;/strong&gt;并用于其去重（算法同源已确认，剩链路与中台是否采用）&lt;/td&gt;
&lt;td&gt;透传断了重复线索激增：客户在抖音留一次、在官网留一次，两边密文一模一样，中台不认，仍建两条线索，派给两家店&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;研发对接，两问合一&lt;/strong&gt;：字节确认透传 + 联友确认中台是否采用&lt;/td&gt;
&lt;/tr&gt;

&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N17&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;豁免期（2027-01-14）结束后，此前以明文下发的存量线索怎么办&lt;/td&gt;
&lt;td&gt;豁免期内取得的明文&lt;strong&gt;还能不能用&lt;/strong&gt;、要不要我方对存量线索重新按隐私号口径取号&lt;/td&gt;
&lt;td&gt;可能要二次改造：库里已有的存量明文线索，1 月 14 号之后还能不能拨、要不要重取一遍号，没人回答就只能先按最坏情况预留工作量&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;产品 / 商务问字节&lt;/strong&gt;：政策口径，书面确认并留凭证&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N18&lt;/strong&gt; &lt;span style=&quot;color:#059669;font-weight:600;font-size:11px;background:#ecfdf5;padding:1px 5px;border-radius:4px;border:1px solid #a7f3d0&quot;&gt;已闭环&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;掩码号「不限期」这个有效期口径，直接决定任务调度与号码回收怎么写&lt;/td&gt;
&lt;td&gt;是否与线索状态有关、已成交或已关单&lt;strong&gt;能否再呼&lt;/strong&gt;、是否需周期性重新取号&lt;/td&gt;
&lt;td&gt;任务调度设计不了：客户三个月前已经成交，这条号码是永远有效，还是关单就该停呼——两种做法对应两套调度逻辑&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;随 N17 一并问&lt;/strong&gt;：同为政策有效期口径&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N5&lt;/strong&gt; &lt;span style=&quot;color:#059669;font-weight:600;font-size:11px;background:#ecfdf5;padding:1px 5px;border-radius:4px;border:1px solid #a7f3d0&quot;&gt;已闭环&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;外呼前查在网 / 空号，把无效号码提前拦掉（现有两套空号缓存 48 小时 / 15 天）&lt;/td&gt;
&lt;td&gt;掩码号&lt;strong&gt;能否用于&lt;/strong&gt;在网 / 空号检测，或平台是否直接返回号码有效性&lt;/td&gt;
&lt;td&gt;两套缓存口径都要改，拦不住就白打：现在查到空号直接拦，掩码号查不了，就只能拨出去才知道是空号，坐席空号率上升&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;研发进技术群问&lt;/strong&gt;：能力接口类，一句话可答&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3 id=&quot;sec-1-3&quot;&gt;一般级&lt;/h3&gt;
&lt;blockquote&gt;
&lt;p&gt;这 7 条都不是「报错型」问题——失败时系统不崩、日志无告警，只会&lt;strong&gt;产生静默业务降级&lt;/strong&gt;（评级空了、回传匹配不上、字段传不过去），容易拖到上线后才发现。&lt;/p&gt;
&lt;/blockquote&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;编号&lt;/th&gt;
&lt;th&gt;什么场景&lt;/th&gt;
&lt;th&gt;卡在哪&lt;/th&gt;
&lt;th&gt;不确认会怎样（举个例子）&lt;/th&gt;
&lt;th&gt;建议谁去问 / 渠道&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;

&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N7&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;线索有进展（已联系 / 已到店 / 已购车）要回传媒体（汽车之家等），请求参数里 &lt;code&gt;customerPhone&lt;/code&gt; 现为明文&lt;/td&gt;
&lt;td&gt;掩码线索没有已验证的明文：填掩码号媒体认不出，留空可能被拒&lt;/td&gt;
&lt;td&gt;回传匹配不上 → 媒体侧看不到转化 → 投放优化与线索成本结算受影响。张先生已到店，回传时 &lt;code&gt;customerPhone&lt;/code&gt; 填 &lt;code&gt;*******3090&lt;/code&gt;，汽车之家不知道是哪条线索。要问：能否改传隐私号或改用线索 ID 映射——本质是「双方认同一个键」&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;随 N1 一并书面确认&lt;/strong&gt;：同为状态回传口径，可能涉及媒体方&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N8&lt;/strong&gt; &lt;span style=&quot;color:#059669;font-weight:600;font-size:11px;background:#ecfdf5;padding:1px 5px;border-radius:4px;border:1px solid #a7f3d0&quot;&gt;联友承接改造&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;车巴巴收到线索后转发下游（主机厂 COC / NEV 中台），转发报文里 &lt;code&gt;phone&lt;/code&gt; 必填&lt;/td&gt;
&lt;td&gt;掩码线索没有明文 phone：传空行不行？能否新增 &lt;code&gt;mask_phone&lt;/code&gt;、&lt;code&gt;encrypt_id&lt;/code&gt; 字段？下游不在我方，需对方排期&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【已明确由联友侧改造】&lt;/strong&gt;联友侧系统已确认承接中台改造：支持新增掩码字段并放行 phone 为空，确保抖音掩码线索正常下发至主机厂中台，链路通畅。&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;与 N3 合并发联友&lt;/strong&gt;：报文加字段由联友排期&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N10&lt;/strong&gt; &lt;span style=&quot;color:#059669;font-weight:600;font-size:11px;background:#ecfdf5;padding:1px 5px;border-radius:4px;border:1px solid #a7f3d0&quot;&gt;联友承接改造&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;【已商定由联友侧改造】&lt;/strong&gt;已明确 NEV 培育线索转正闭环：坐席人员电话核身更正的真实手机号&lt;strong&gt;必须回传 NEV 线索中台&lt;/strong&gt;；联友侧改造回写接收接口并采信更新，确保全链路客户主档案数据同步。&lt;/td&gt;
&lt;td&gt;能不能加号码字段？加了之后中台&lt;strong&gt;采不采信&lt;/strong&gt;（拿它去重与下发）&lt;/td&gt;
&lt;td&gt;若中台收到但不用，这条回写失去业务落地价值——所以它是「值不值得做」而非「能不能做」，答案为「不采信」则该功能点砍掉只留本地。坐席在 DCC 跟进张先生并回写，但中台不拿号码判重，下次他在官网留资中台仍当新客户。&lt;strong&gt;回答能省工作量&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;群里先问&lt;/strong&gt;：一句话定做不做，研发即可发起&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N13&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;E11「启辰本地通车云店」入口，我方每 10 分钟拉取一次&lt;/td&gt;
&lt;td&gt;那页原型修订记录写着「&lt;strong&gt;下线接口服务&lt;/strong&gt;」（2024-01-04），可能两年前就停了，无人确认&lt;/td&gt;
&lt;td&gt;两个方向都有成本：停了 → 11 入口变 10、改造量可减；还在跑 → 它是唯一无入站强校验的入口，掩码号会直接当合法电话入库。&lt;code&gt;*******3090&lt;/code&gt; 进来没有任何校验拦截，只能靠线索中心那层兜底。&lt;strong&gt;问一句就能省工作量或补漏洞&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;群里先问&lt;/strong&gt;：一句话定入口个数&lt;/td&gt;
&lt;/tr&gt;

&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;N19&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;客户在抖音&lt;strong&gt;私信聊天里自己打手机号&lt;/strong&gt;（走 E11，&lt;code&gt;clue_source=8&lt;/code&gt;、来源「私信」），平台会做脱敏处理&lt;/td&gt;
&lt;td&gt;脱敏后给我们的&lt;strong&gt;字段形态&lt;/strong&gt;没人确认：是掩码号、&lt;code&gt;138****8899&lt;/code&gt; 中间打码、还是别的格式？字段定义能否同步&lt;/td&gt;
&lt;td&gt;形态不明则解析规则写不了，按 11 位正则匹配全部失败，这类线索整批进异常表。客户私信打「我电话 138xxxx8899」，平台给我们 &lt;code&gt;138****8899&lt;/code&gt;——既不是掩码号、也不是加密标识、也不是明文，是设计之外的第 4 种形态&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;随 N1 书面发字节&lt;/strong&gt;：字段定义类，要正式答复&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;这 7 条分三类，问的顺序建议&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;类型&lt;/th&gt;
&lt;th&gt;条目&lt;/th&gt;
&lt;th&gt;不确认的代价&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;防静默降级&lt;/td&gt;
&lt;td&gt;N7 回传、N19 私信解析&lt;/td&gt;
&lt;td&gt;上线后才发现：评级空、转化回传不上、整类线索进异常表&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;契约确认（下游改不改）&lt;/td&gt;
&lt;td&gt;N8 报文加字段 过渡路径到期&lt;/td&gt;
&lt;td&gt;卡在别人排期上，越晚问越贵&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;能省工作量&lt;/td&gt;
&lt;td&gt;N10 回写值不值得做、N13 入口还剩几个&lt;/td&gt;
&lt;td&gt;不问就得按最坏情况估工作量&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;N13、N10 最便宜（一句话定工作量），可先在群里问掉；N6、N19 最易被忽略但隐蔽性最高、潜在影响最深，建议与 N1 一起发给字节；N8 与 N3 合并成一封；&lt;/p&gt;
&lt;hr /&gt;
&lt;/div&gt;&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-2&quot;&gt;二、要跟联友 / DNDC、内部对齐的依赖&lt;/h2&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;依赖项&lt;/th&gt;
&lt;th&gt;对齐什么&lt;/th&gt;
&lt;th&gt;现状&lt;/th&gt;
&lt;th&gt;建议对接方（谁牵头确认）&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;加密节点全系统统一&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;全系统只能有一个加密节点（同一算法、同一把盐）；各方落库 / 传输环节都用它算密文&lt;/td&gt;
&lt;td&gt;已与字节确认同源；联友侧系统是否接入同一节点&lt;strong&gt;待对齐&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;我方数据团队&lt;/strong&gt;牵头（节点由其部署运维）；&lt;strong&gt;联友侧接口负责人&lt;/strong&gt;配合确认 NEV 链路是否接同一节点&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;NEV 报文 / 回写接口加字段&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;加密标识、掩码号要能透传（N8 / N10）&lt;/td&gt;
&lt;td&gt;待接口侧排期&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;联友（NEV 中台接口侧）&lt;/strong&gt; 确认能否加字段、是否采信回写号码——这条由他们排期，问得越晚越贵&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;存量线索补加密&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;新老线索互不相认会导致重复建单，列为阶段 2 硬性交付（R3）&lt;/td&gt;
&lt;td&gt;排期内&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;我方数据团队&lt;/strong&gt;执行（批量补算密文）；&lt;strong&gt;业务运营&lt;/strong&gt;确认存量线索范围（哪些渠道、哪些年份要纳入）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;密钥轮换双向流程&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;单侧轮换不报错、不告警，只表现为密文比对率归零，极难倒查（R3a）&lt;/td&gt;
&lt;td&gt;已写入设计约束&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;我方数据团队&lt;/strong&gt;发起并落实为流程（换密钥两侧同批、切前 100 条样本比对、命中率告警）；&lt;strong&gt;联友等接入方&lt;/strong&gt;签署遵守——只要一方单独换钥，全系统判重即失效&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;短信能力&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;抖音线索掩码号收不到短信、平台不代发——六处短信触发点全部降级&lt;/td&gt;
&lt;td&gt;已闭环（2026-10-17），此处仅同步&lt;/td&gt;
&lt;td&gt;无需确认。&lt;strong&gt;同步对象：业务运营&lt;/strong&gt;——管理预期：拿到明文前短信触达不可用，外呼是唯一手段&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;真实被叫号&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;话单回传的是顾问号码，平台不回传客户真号——「话单反查真号」不可行&lt;/td&gt;
&lt;td&gt;已闭环（2026-10-20），请业务侧管理预期&lt;/td&gt;
&lt;td&gt;无需确认。&lt;strong&gt;同步对象：质检 / 业务侧&lt;/strong&gt;——话单只能用于通话质检，不能反查客户号码&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;hr /&gt;
&lt;/div&gt;&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-3&quot;&gt;三、我方已定、不再等答复的事项（同步性质）&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;密文比对匹配的用途边界（N14）&lt;/strong&gt;：平台对此不予书面回应、不承担责任，属我方自主行为、风险自留。业务定调结论：效率优先，系统比对命中即直接转正供坐席直拨真实号码，全程严格审计留痕，不再设置多余的外呼开关阻断。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;落实分工&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;事项&lt;/th&gt;
&lt;th&gt;由谁&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;自限三条落入系统设计（候选不写主字段、策略开关默认关、审计留痕）&lt;/td&gt;
&lt;td&gt;我方开发（已写入总方案 3.3 / 4.3，随开发交付）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;核查协议有无「密文比对取明文」的禁止性条款&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;法务&lt;/strong&gt;（评审前完成，结论回填本清单）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;群内发一条告知性留言留痕（只告知、不请示）&lt;/td&gt;
&lt;td&gt;&lt;strong&gt;产品&lt;/strong&gt;（开工前完成，留聊天记录）&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;hr /&gt;
&lt;/div&gt;&lt;div class=&quot;section&quot;&gt;&lt;h2 id=&quot;sec-4&quot;&gt;四、时间依赖链&lt;/h2&gt;
&lt;p&gt;&lt;pre&gt;&lt;code&gt;10月下旬 立项 ──→ 11月初 启动 ──→ 11/05、11/10 字节答复节点
      ──→ 12月 开发与联调 ──→ 2027-01-04 政策生效
&lt;/code&gt;&lt;/pre&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;11 月初不启动，后续全部顺延（R7，高风险）；&lt;/li&gt;
&lt;li&gt;12 月窗口内还要并行完成存量线索加密（阶段 2）；&lt;/li&gt;
&lt;li&gt;政策生效前需完成切换演练（命中率 / 密文比对率对账指标就位）。&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/main&gt;
&lt;/div&gt;
